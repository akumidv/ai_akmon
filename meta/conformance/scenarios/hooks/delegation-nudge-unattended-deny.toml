# The same ask in a non-interactive permission mode escalates to a hard deny (C31): an
# unattended ask is a silent no-op, so the hook refuses instead of trusting it.
id = "hooks/delegation-nudge-unattended-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:delegation-nudge"]

[fixture]
attach = "native"
tmp_files = { "akmon-delegation-nudge-sess-dn-deny.count" = "123 121.0" }

[run]
script = "delegation-nudge"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-dn-deny"
permission_mode = "acceptEdits"
cwd = "{{root}}"
tool_input = { command = "make test" }

[expected]
exit = 0
stderr = ""
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "deny"
permissionDecisionReason = "[akmon] Sustained delegation drift — a drift score of 122 (an edit or shell call counts 1, a read ½, the first 8 calls of a stretch nothing) with no subagent delegation. A read never carries this ask, so it lands on a call that changes something (guardrails/_common.md § Route by task kind).\nRoute the next steps to a `k_*` delegate — exploration/summaries → `k_explorer` · mechanical edits / doc-sync / test scaffolds → `k_mechanic` · gate loops → `k_validator` · code under a decided contract → `k_implementer` · load-bearing analysis → `k_reasoner` — or confirm this is genuinely one of the orchestrator's reserved four (decompose · route · synthesize · owner dialogue) to proceed.\nFires once per drift episode (a subagent delegation re-arms it). [escalated ask→deny: permission_mode='acceptEdits' is not the interactive default, so 'ask' cannot be trusted to reach the owner (ADR-0006/D02, C31) — re-run from an attended default-mode session if this was genuinely intended.]"
