# A commit on the default branch resolves the live git branch (the fixture repo is on main):
# a landing commit is an ask, not a deny.
id = "hooks/git-commit-guard-main-commit-ask"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-main"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "git commit -m \"update docs\"" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "ask"
permissionDecisionReason = "Commit guardrail: the owner owns commits. A commit on 'main' is a landing commit — confirm explicitly, or branch to backup/* first."
