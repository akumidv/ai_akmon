# First planning-doc edit of a session: the analysis-before-mutation reminder (additionalContext).
id = "hooks/analysis-guard-first-edit"
ecosystem = "shared"
kind = "hook"
covers = ["hook:analysis-guard"]

[run]
script = "analysis-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Edit"
session_id = "sess-ag-first"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { file_path = "{{root}}/_aitna/TASKS.md" }

[expected]
exit = 0
stderr = ""
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
additionalContext = "[akmon] Analysis-before-mutation check — you are editing a planning/design doc (backlog / design / ADR / requirements / akmon process).\nRole: **assessing what is** (problems, state, conformance) is `review`; **constructing the design** (options, contracts, the chosen structure) is `architect`. Declare the role (`🧭 agent: <name> — <focus>`) and restate it on a switch (roles/README.md).\nIf this turn is analysis-only — the owner asked you to analyze, explain, review, compare options, or identify what remains — STOP: report findings + a recommendation in chat and get explicit confirmation (\"write it\" / \"record it\" / \"make the change\") before editing. If the request was already an edit command, proceed. Rule: guardrails/_common.md § Analysis before mutation."
