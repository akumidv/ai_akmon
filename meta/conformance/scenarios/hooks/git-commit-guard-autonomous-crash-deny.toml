# D-C203-GUARD-CRASH: a crash in the commit guard denies an autonomous run (a tool_input that is not an object is the AttributeError `.get` raises), where a developer's is crash-open.
id = "hooks/git-commit-guard-autonomous-crash-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
AKMON_ACTOR = "autonomous"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-crash-1"
permission_mode = "default"
cwd = "{{root}}"
tool_input = [1]

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\nakmon git-commit-guard hook: AttributeError\n"
stdout = "{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Commit guardrail (autonomous run): the access matrix could not be read, or the guard failed while evaluating this command, so an autonomous run is denied \\u2014 nothing was run. The owner restores the setup (`akmon verify`); a developer run is let through in the same case.\"}}\n"
