# A Codex payload whose `cwd` is longer than any path the kernel can look up (4096 UTF-8
# bytes, Linux's PATH_MAX): the project-root walk refuses it before resolving it, and the
# refusal takes the crash contract — one stderr line naming the route and the class, exit 1,
# nothing on stdout. Found by the differential fuzz (seed 1, case 634: 32,769 `a/` components),
# where Python did not finish in 400 s and Node raised an OSError after 58 s. The `cwd` below is
# the project root plus 2,080 `a/` components, written as one TOML basic string folded with
# line-ending backslashes.
id = "hooks/codex-hook-over-long-cwd"
ecosystem = "shared"
kind = "hook"
covers = ["hook:codex-hook", "hook:role-on-code"]

[run]
script = "codex-hook"
args = ["role-on-code"]

[run.payload]
tool_name = "apply_patch"
session_id = "sess-ch-long"
tool_input = { command = "*** Begin Patch\n*** Add File: src/mod.py\n+x = 1\n*** End Patch\n" }
