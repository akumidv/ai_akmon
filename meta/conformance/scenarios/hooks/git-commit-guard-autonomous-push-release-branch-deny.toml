# A release branch is protected like develop: an autonomous run never pushes it (`release/*`, a prefix in protected_branches).
id = "hooks/git-commit-guard-autonomous-push-release-branch-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[fixture]
branch = "agent/C203-x"

[env]
AKMON_ACTOR = "autonomous"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-rb-6"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "git push origin release/1.0" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = "{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Commit guardrail (autonomous run): push of the default branch is denied \\u2014 an autonomous run never pushes 'release/1.0', force or not (the default branch and `develop` are protected); its work reaches the default branch through a pull request the owner merges.\"}}\n"
