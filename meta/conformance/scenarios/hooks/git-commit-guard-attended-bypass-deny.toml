# ADR-0025/D06: a mode that skips every question is never attended, whatever the host states, so the ask is a deny.
id = "hooks/git-commit-guard-attended-bypass-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
CLAUDE_CODE_SESSION_ATTENDED = "1"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-attended-bypass-deny"
permission_mode = "bypassPermissions"
cwd = "{{root}}"
tool_input = { command = "git push origin feature" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "deny"
permissionDecisionReason = "Commit guardrail: the owner owns publishing. push and tag are the owner's everywhere, a linked worktree's own branch included — confirm this is explicitly requested. [escalated ask→deny: the run is unattended — permission_mode='bypassPermissions', CLAUDE_CODE_SESSION_ATTENDED=1 — so 'ask' cannot be trusted to reach the owner (ADR-0025/D06, C31) — re-run from an attended session if this was genuinely intended.]"
