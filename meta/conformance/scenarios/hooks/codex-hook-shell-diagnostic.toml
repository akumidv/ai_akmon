# A shell route with no classifiable path effect: nothing on stdout (the advisories stay
# quiet), but the once-per-session stderr diagnostic says the route may mutate the
# filesystem unseen.
id = "hooks/codex-hook-shell-diagnostic"
ecosystem = "shared"
kind = "hook"
covers = ["hook:codex-hook"]

[run]
script = "codex-hook"
args = ["role-on-code"]

[run.payload]
tool_name = "Bash"
session_id = "sess-ch-shell"
cwd = "{{root}}"
tool_input = { command = "make build" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = ""
