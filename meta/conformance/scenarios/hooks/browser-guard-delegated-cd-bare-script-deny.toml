# A delegated agent running the bare script after a cd into the tools directory is denied.
id = "hooks/browser-guard-delegated-cd-bare-script-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-bg-delegated-cd-bare-script-deny"
permission_mode = "default"
cwd = "{{root}}"
agent_id = "agent-1"
tool_input = { command = "cd js/tools && node browser.mjs status" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = "{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Browser guardrail: the shared browser is the developer's session's tool, and a delegated agent does not drive it. Use the ordinary web request (WebFetch, WebSearch) instead; if the step needs the browser, hand it back to the main session.\"}}\n"
