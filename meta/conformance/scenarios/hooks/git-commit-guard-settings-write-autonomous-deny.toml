# The settings write is denied for an autonomous run as well: the rule takes no actor.
id = "hooks/git-commit-guard-settings-write-autonomous-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
AKMON_ACTOR = "autonomous"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-seg-3"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "sed -i s/a/b/ .claude/settings.json" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = "{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Privilege guardrail: this command writes .claude/settings.json, a harness settings file whose `env` carries the run's actor (AKMON_ACTOR). An agent never writes the `env` of a harness settings file. If the change is genuinely needed, ask the owner to run it themselves.\"}}\n"
