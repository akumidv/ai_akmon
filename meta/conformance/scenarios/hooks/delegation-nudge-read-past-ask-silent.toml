# A read never carries the ask (C88 calibration): even past the ask threshold a Read call
# emits nothing — the score stays over the threshold so the ask lands on the next edit or
# shell call instead.
id = "hooks/delegation-nudge-read-past-ask-silent"
ecosystem = "shared"
kind = "hook"
covers = ["hook:delegation-nudge"]

[fixture]
attach = "native"
tmp_files = { "akmon-delegation-nudge-sess-dn-read.count" = "123 121.0" }

[run]
script = "delegation-nudge"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Read"
session_id = "sess-dn-read"
permission_mode = "default"
cwd = "{{root}}"

[expected]
exit = 0
stderr = ""
stdout = ""
