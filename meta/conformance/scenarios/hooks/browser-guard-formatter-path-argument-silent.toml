# A path to the tool named to a formatter is an argument, not a drive: the browser tool runs nothing.
id = "hooks/browser-guard-formatter-path-argument-silent"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-bg-formatter-path-argument-silent"
permission_mode = "default"
cwd = "{{root}}"
agent_id = "agent-1"
tool_input = { command = "npx --no-install oxfmt js/tools/browser.mjs" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = ""
