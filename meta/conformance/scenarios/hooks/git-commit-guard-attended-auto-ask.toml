# ADR-0025/D06: the host states an attended session (CLAUDE_CODE_SESSION_ATTENDED=1), so the ask reaches the owner even in the auto permission mode.
id = "hooks/git-commit-guard-attended-auto-ask"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
CLAUDE_CODE_SESSION_ATTENDED = "1"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-attended-auto-ask"
permission_mode = "auto"
cwd = "{{root}}"
tool_input = { command = "git push origin feature" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "ask"
permissionDecisionReason = "Commit guardrail: the owner owns commits. push/tag/merge land history — confirm this is explicitly requested."
