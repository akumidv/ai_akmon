# privilege.no-escalation: any shell command containing sudo is denied. The Bash route also
# emits its once-per-session stderr diagnostic on the first call of this session (the marker
# is fresh), so stderr carries the route line alongside the decision document.
id = "hooks/git-commit-guard-sudo-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-sudo"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "sudo apt-get install -y foo" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "deny"
permissionDecisionReason = "Privilege-escalation guardrail: 'sudo' is never run by the agent. If elevated access is genuinely required, ask the owner to run the command themselves."
