# An autonomous run has no developer's browser to drive: the Bash verbs are denied.
id = "hooks/browser-guard-autonomous-bash-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
AKMON_ACTOR = "autonomous"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-bg-autonomous-bash-deny"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "akmon tool browser status" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
stdout = "{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\", \"permissionDecision\": \"deny\", \"permissionDecisionReason\": \"Browser guardrail (autonomous run): the shared browser is the developer's session's tool, and an autonomous run has no developer to share it with. Use the ordinary web request (WebFetch, WebSearch) instead.\"}}\n"
