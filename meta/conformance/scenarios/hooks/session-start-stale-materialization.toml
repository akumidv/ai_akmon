# Package mode: the materialized guardrails copy under <aitna>/.akmon/ differs from the
# executing tree — SessionStart speaks the stale notice on the owner-only systemMessage
# channel while the roster still reaches the model.
id = "hooks/session-start-stale-materialization"
ecosystem = "shared"
kind = "hook"
covers = ["hook:session-start-agent"]

[fixture]
attach = "native"
files = { "_aitna/.akmon.toml" = "mount = \"package\"\necosystem = \"{{ecosystem}}\"\nakmon_version = \"{{version}}\"\n", "_aitna/.akmon/guardrails/_common.md" = "stale guardrail copy\n" }

[run]
script = "session-start-agent"

[run.payload]
hook_event_name = "SessionStart"
session_id = "sess-stale"
cwd = "{{root}}"

[expected]
exit = 0
stderr = ""
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "SessionStart"
additionalContext = "[akmon] Role declaration\nBefore doing project work, state which role you are operating in, and restate it whenever you switch. Format: `🧭 role: <name> — <focus>`.\n- DEVELOP (build the project), agents and the roles they work in: development — roles review, architect, engineer\nNo role is declared yet.\nPick the role (never an agent name) by operation: decompose an existing thing → review · construct a new structure/decision → architect · realize a decided structure in code → engineer. If unclear, ask.\nDelegation is the default for non-atomic work: before the first repository sweep, edit, or test run, decompose the task and delegate every independent sub-step to available subagents. Keep only decomposition, routing, synthesis, and owner dialogue in the orchestrator. Skip delegation only when the task is atomic or the harness exposes no subagents; state the reason. The work style sets the rest: delegating also hands whole athla and higher-tier calls to delegates; controlling leaves stages to sessions the developer starts and, where a reasoner, auditor or athlos implementer would be called, recommends which, for what and why.\nwork style: delegating (default)\nAlso: read `_aitna/memory/` at session start (project memory)."
