# D-C203-GUARD-CRASH: a developer run stays crash-open (ADR 0013): the owner is told and the command goes ahead.
id = "hooks/git-commit-guard-developer-crash-open"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-crash-2"
permission_mode = "default"
cwd = "{{root}}"
tool_input = [1]

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\nakmon git-commit-guard hook: AttributeError\n"
stdout = "{\"systemMessage\": \"\\u26a0 akmon: the git-commit-guard hook failed (AttributeError) and was skipped \\u2014 this action went ahead without it. Check the setup: `akmon verify` (a mounted tree: `python3 _aitna/akmon/bin/verify.py`).\"}\n"
