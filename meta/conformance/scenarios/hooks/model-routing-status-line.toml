# SessionStart with a fresh recorded binding (registry hash matches, orchestrator inside the
# healthy corridor, no context pressure): the steady-state status line, context-only — no
# systemMessage. The config is generated by tools/model_routing/init.py against the same
# registry, so it stays fresh as long as the registry content is unchanged.
id = "hooks/model-routing-status-line"
ecosystem = "shared"
kind = "hook"
covers = ["hook:model-routing"]

[fixture]
attach = "native"
files = { ".claude/model-routing.local.json" = """{
  "vendor": "anthropic",
  "orchestrator": "opus",
  "binding": {
    "reasoner": "opus",
    "worker": "haiku",
    "mid": "sonnet",
    "auditor": "opus",
    "escalation": [
      "sonnet"
    ]
  },
  "second_opinion": false,
  "second_opinion_provider": "openai",
  "available": [
    "haiku",
    "sonnet",
    "opus"
  ],
  "registry_hash": "6f691dfce2008872",
  "task_kind_floors": {
    "quant-derivation": "opus"
  }
}
"""}

[run]
script = "model-routing"

[run.payload]
hook_event_name = "SessionStart"
session_id = "sess-mr-status"
cwd = "{{root}}"

[expected]
exit = 0
stderr = ""
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "SessionStart"
additionalContext = "[akmon] model routing: vendor=anthropic · orchestrator=opus · reasoner=opus · auditor=opus · worker=haiku · mid=sonnet · second-opinion=codex(off)\nDelegation is the default — route by task kind (MODEL.md § Capability tiers): k_explorer/k_mechanic/k_validator (worker) · k_implementer (mid) · k_reasoner · k_auditor (audit at gates); escalate one rung only on failure signals (escalation path: sonnet). In a zoned fan-out, start each call's description with [zone:<label>].\nSelf-check: if your actual model is not 'opus', re-run `{{tool model_routing/init}} --orchestrator <alias>`."
