# ADR-0025/D06: the host states an unattended run (CLAUDE_CODE_SESSION_ATTENDED=0), so the ask is a deny even though the permission mode is default (as under -p, M199).
id = "hooks/git-commit-guard-unattended-default-deny"
ecosystem = "shared"
kind = "hook"
covers = ["hook:git-commit-guard"]

[env]
CLAUDE_CODE_SESSION_ATTENDED = "0"

[run]
script = "git-commit-guard"

[run.payload]
hook_event_name = "PreToolUse"
tool_name = "Bash"
session_id = "sess-gcm-unattended-default-deny"
permission_mode = "default"
cwd = "{{root}}"
tool_input = { command = "git push origin feature" }

[expected]
exit = 0
stderr = "akmon hook: a shell call may mutate the filesystem, but the path-keyed advisories cannot classify this route; hook-process stderr diagnostic only — role-on-code, analysis-guard and the path-keyed reminders receive no inferred target\n"
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "PreToolUse"
permissionDecision = "deny"
permissionDecisionReason = "Commit guardrail: the owner owns commits. push/tag/merge land history — confirm this is explicitly requested. [escalated ask→deny: the run is unattended — permission_mode='default', CLAUDE_CODE_SESSION_ATTENDED=0 — so 'ask' cannot be trusted to reach the owner (ADR-0025/D06, C31) — re-run from an attended session if this was genuinely intended.]"
