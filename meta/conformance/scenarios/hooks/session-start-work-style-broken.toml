# SessionStart when `common/work_style.json` is not valid JSON: the work-style line alone is left out
# (ADR 0031/D03); the roster, the picking rule, the delegation rule and the memory line are delivered as
# in `session-start-roster`. Both implementations read the file from the tree the consumer runs.
id = "hooks/session-start-work-style-broken"
ecosystem = "shared"
kind = "hook"
covers = ["hook:session-start-agent"]

[fixture]
tree_files = { "common/work_style.json" = "not json" }

[run]
script = "session-start-agent"

[run.payload]
hook_event_name = "SessionStart"
session_id = "sess-ss-work-style-broken"
cwd = "{{root}}"

[expected]
exit = 0
stderr = ""
[expected.stdout_json]
[expected.stdout_json.hookSpecificOutput]
hookEventName = "SessionStart"
additionalContext = "[akmon] Role declaration\nBefore doing project work, state which role you are operating in, and restate it whenever you switch. Format: `🧭 role: <name> — <focus>`.\n- DEVELOP (build the project), agents and the roles they work in: development — roles review, architect, engineer\nNo role is declared yet.\nPick the role (never an agent name) by operation: decompose an existing thing → review · construct a new structure/decision → architect · realize a decided structure in code → engineer. If unclear, ask.\nDelegation is the default for non-atomic work: before the first repository sweep, edit, or test run, decompose the task and delegate every independent sub-step to available subagents. Keep only decomposition, routing, synthesis, and owner dialogue in the orchestrator. Skip delegation only when the task is atomic or the harness exposes no subagents; state the reason. The work style sets the rest: delegating also hands whole athla and higher-tier calls to delegates; controlling leaves stages to sessions the developer starts and, where a reasoner, auditor or athlos implementer would be called, recommends which, for what and why. Controlling: a delegate's brief is in the developer's language.\nAlso: read `_aitna/memory/` at session start (project memory)."
