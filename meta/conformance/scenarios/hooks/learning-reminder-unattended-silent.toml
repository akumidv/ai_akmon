# An unattended run (CLAUDE_CODE_SESSION_ATTENDED=0, as under `claude -p`) is recorded but never reminded, even with the threshold passed.
id = "hooks/learning-reminder-unattended-silent"
ecosystem = "shared"
kind = "hook"
covers = ["hook:learning-reminder"]

[fixture]
attach = "native"
files = { "_aitna/local/learning.json" = "{\n  \"last_run\": null,\n  \"since\": \"2999-01-01T00:00:00Z\",\n  \"sessions\": [\n    \"seed-0\",\n    \"seed-1\",\n    \"seed-2\",\n    \"seed-3\",\n    \"seed-4\",\n    \"seed-5\",\n    \"seed-6\",\n    \"seed-7\",\n    \"seed-8\",\n    \"seed-9\"\n  ]\n}\n" }

[env]
CLAUDE_CODE_SESSION_ATTENDED = "0"

[run]
script = "learning-reminder"

[run.payload]
hook_event_name = "SessionStart"
session_id = "sess-lr-unattended"
source = "startup"
cwd = "{{root}}"

[expected]
exit = 0
stderr = ""
stdout = ""
