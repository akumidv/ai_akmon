# C129: a Node repository attached in a mounted mode, its record naming ecosystem = "node" (the
# node-mount layer). The JavaScript sync runs from the mount, `node _aitna/akmon/js/akmon/cli.mjs`:
# the hook wiring runs node on `_aitna/akmon/js/hooks`, a standard skill's stub links into the mount,
# nothing is materialized under `_aitna/.akmon/` and the record is not stamped (ADR 0020 D02 as
# amended). Node-tagged: the Python implementation refuses a node record.
id = "cli/sync-node-mount"
ecosystem = "node"
kind = "cli"
covers = ["command:sync"]

[fixture]
attach = "mount"

[fixture.tree_files]
"skills/standard-demo/SKILL.md" = "---\nname: standard-demo\ndescription: A skill the standard ships.\n---\n# standard-demo\n"

[run]
argv = ["sync"]

[expected]
exit = 0
stderr = ""
stdout = "updated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/standard-demo/SKILL.md\nupdated: .agents/skills/standard-demo/SKILL.md\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\n"
file_absent = ["_aitna/.akmon"]
[expected.files]
".claude/settings.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR git-commit-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write|MultiEdit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR role-on-code}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR analysis-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Task|Agent\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-log}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash|Edit|Write|MultiEdit|Task|Agent|Read|Grep|Glob\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-nudge}}\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR session-start-agent}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR gate-audit}}\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
".codex/hooks.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash|apply_patch\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} role-on-code\",\n            \"statusMessage\": \"Checking akmon role switch\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} analysis-guard\",\n            \"statusMessage\": \"Checking analysis-before-mutation\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"matcher\": \"startup|resume|clear|compact\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} session-start\",\n            \"statusMessage\": \"Loading akmon session reminders\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
".claude/skills/standard-demo/SKILL.md" = "---\n# Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand.\nname: standard-demo\ndescription: A skill the standard ships.\n---\n\n# standard-demo\n\nSource skill: [../../../_aitna/akmon/skills/standard-demo/SKILL.md](../../../_aitna/akmon/skills/standard-demo/SKILL.md)\n\nRead and follow the source SKILL.md. Do not duplicate its contents here.\n"
"_aitna/.akmon.toml" = "mount = \"submodule\"\necosystem = \"node\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\nlast_realign = \"{{version}}\"\n"
