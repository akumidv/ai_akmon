# Tree-side break: the mounted CHANGELOG.md carries no `## Unreleased` heading — the mounted
# changelog discipline speaks its warn side (the package-mode skip is pinned by the healthy
# package scenario).
id = "cli/verify-changelog-no-unreleased"
ecosystem = "python"
kind = "cli"
covers = ["command:verify", "code:changelog.unreleased"]

[fixture]
attach = "mount"
warmup = true

[fixture.tree_files]
"CHANGELOG.md" = "# Changelog\n\n## 0.3.0\n\n- an earlier release\n"

[run]
argv = ["verify"]

