# Package mode, healthy: the record declares package, the manifest pins akmon in a dev group,
# the launcher shim exists (hooks.launcher ok side), CI uses the package spellings, and the
# mounted changelog discipline is owned by the standard (changelog.package-mode ok side).
id = "cli/verify-package-healthy"
ecosystem = "python"
kind = "cli"
covers = [
  "command:verify",
  "code:hooks.launcher",
  "code:package.dev-pin",
  "code:changelog.package-mode",
  "code:ci.akmon-checks",
]

[fixture]
attach = "native"
warmup = true

[fixture.files]
".github/workflows/ci.yml" = "name: CI\non: [push]\njobs:\n  checks:\n    runs-on: ubuntu-latest\n    steps:\n      - run: uv run akmon sync --check\n      - run: uv run akmon verify --strict\n"

[run]
argv = ["verify"]

[expected]
exit = 0
stderr = ""
