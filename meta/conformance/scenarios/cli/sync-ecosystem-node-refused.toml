id = "cli/sync-ecosystem-node-refused"
ecosystem = "python"
kind = "cli"
covers = ["command:sync"]

# A record the JavaScript implementation wrote: the Python sync would spell the wiring for its own
# launcher, so it refuses and names the implementation that serves the project (C105).
[fixture]
attach = "native"
warmup = "before"
name = "base"
files = { "_aitna/.akmon.toml" = "mount = \"package\"\necosystem = \"node\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\nlast_realign = \"{{version}}\"\n" }

[run]
argv = ["sync"]

[expected]
exit = 2
stdout = ""
stderr = "akmon sync: this project's integration record names ecosystem = \"node\" (<AITNA_ROOT>/.akmon.toml), and the Python implementation serves Python projects only; run the JavaScript implementation for it: npx akmon sync\n"
