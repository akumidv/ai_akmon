# Tree-side break: the mounted registry.json lost a vendor — verify's routing vendor check
# speaks the error side. The broken registry is corpus-controlled via tree_files.
id = "cli/verify-routing-vendor-missing"
ecosystem = "shared"
kind = "cli"
covers = ["command:verify", "code:routing.vendor-present"]

[fixture]
attach = "native"
warmup = true

[fixture.tree_files]
"tools/model_routing/registry.json" = '''
{
  "anthropic": {
    "selection_policy": {
      "available_order": "weakest-to-strongest",
      "worker": "lowest",
      "mid": "next-after-worker",
      "reasoner": "orchestrator",
      "auditor": "highest",
      "orchestrator_floor": "opus"
    },
    "second_opinion": {
      "harness": "claude",
      "operation": "review",
      "model_flag": "--model {model}",
      "report_dir": ".codex/second-opinion/"
    },
    "semantic_fallback": {
      "worker": "worker",
      "mid": "mid",
      "reasoner": "strongest",
      "auditor": "strongest",
      "orchestrator": "strongest"
    }
  },
  "context_pressure": {
    "recommended_max": 200000,
    "recommended_max_by_alias": {},
    "info_ratio": 0.85
  },
  "task_kinds": {
    "explore-search": {
      "tier": "worker"
    },
    "summarize": {
      "tier": "worker"
    },
    "mech-edit": {
      "tier": "worker"
    },
    "test-scaffold": {
      "tier": "worker"
    },
    "doc-sync": {
      "tier": "worker"
    },
    "validate-loop": {
      "tier": "worker"
    },
    "implement-under-spec": {
      "tier": "worker",
      "rung": "mid"
    },
    "debug-deep": {
      "tier": "reasoner"
    },
    "design-fork": {
      "tier": "reasoner"
    },
    "quant-derivation": {
      "tier": "reasoner",
      "floor": "highest"
    },
    "plan-draft": {
      "tier": "reasoner"
    },
    "audit": {
      "tier": "auditor"
    },
    "independent-review": {
      "tier": "second-opinion"
    }
  },
  "second_opinion_policy": {
    "diversity_ladder": [
      "other-vendor",
      "same-vendor-other-model"
    ],
    "never": "same-model"
  },
  "gate_triggers": {
    "review_min_findings": 3,
    "architect_min_options": 2
  },
  "cross_cutting_kinds": [
    "independent-review",
    "audit"
  ],
  "role_task_kinds": {
    "review": [
      "explore-search",
      "summarize",
      "debug-deep",
      "plan-draft"
    ],
    "architect": [
      "explore-search",
      "summarize",
      "design-fork",
      "quant-derivation",
      "plan-draft",
      "doc-sync"
    ],
    "engineer": [
      "explore-search",
      "summarize",
      "mech-edit",
      "test-scaffold",
      "doc-sync",
      "validate-loop",
      "implement-under-spec",
      "debug-deep",
      "quant-derivation",
      "plan-draft"
    ],
    "learn": [
      "explore-search",
      "summarize",
      "doc-sync"
    ],
    "release": [
      "validate-loop",
      "doc-sync",
      "summarize"
    ]
  }
}
'''

[run]
argv = ["verify"]

[expected]
exit = 1
stderr = ""
findings = [
  "OK layout.consumer-path AGENTS.md: AGENTS.md exists → Keep AGENTS.md in place.",
  "OK layout.consumer-path _aitna/TASKS.md: _aitna/TASKS.md exists → Keep _aitna/TASKS.md in place.",
  "OK layout.consumer-path _aitna/agents: _aitna/agents exists → Keep _aitna/agents in place.",
  "OK layout.consumer-path _aitna/memory: _aitna/memory exists → Keep _aitna/memory in place.",
  "OK isolation.use-surface: USE surface names no akmon development artifacts → Keep decision-record citations and dev-tree paths out of the USE surface.",
  "OK agents.block-anchors AGENTS.md: AGENTS.md akmon block contains required anchors → Keep every required anchor in the AGENTS.md akmon block.",
  "OK pointers.vendor-agents-link: vendor pointers point at AGENTS.md → Keep every vendor pointer aimed at AGENTS.md.",
  "OK agents.skill-roots AGENTS.md: AGENTS.md references source skill roots → Keep the source skill roots named in AGENTS.md.",
  "OK caps.always-loaded AGENTS.md: consumer-total: lines=21/570 bytes=917/34000 → Keep AGENTS.md and the guardrails it imports within the always-loaded cap",
  "OK charters.role-link _aitna/agents/engineer/README.md: _aitna/agents/engineer/README.md links a akmon role → Keep the akmon role link in this charter.",
  "OK memory.index _aitna/memory/README.md: _aitna/memory/README.md exists → Keep README.md as the memory index.",
  "OK memory.index-coverage _aitna/memory: memory index mentions all memory markdown files → Keep every memory file listed in the index.",
  "OK tasks.entry-status _aitna/TASKS.md: TASKS.md uses well-formed index entries → Keep every entry's status field within active | blocked | deferred | done.",
  "OK skills.present: found 1 skill(s) → Keep at least one SKILL.md in a skill root.",
  "OK pointers.generated-freshness: generated pointers match `akmon sync` → Re-run akmon sync after every change to a generated file's source.",
  "OK codex.host-trust .codex/hooks.json: codex is not installed; Codex host-trust delivery is not verified → Install codex to verify hook delivery, or ignore if this project does not run it.",
  "OK routing.registry-parse standard tree:tools/model_routing/registry.json: model-routing registry parses → Keep the model-routing registry valid JSON.",
  "OK routing.selection-policy tools/model_routing/registry.json#anthropic: model-routing anthropic semantic selection policy exists → Keep the semantic selection policy on this vendor.",
  "OK routing.semantic-fallback tools/model_routing/registry.json#anthropic: model-routing anthropic semantic fallback exists → Keep a model named for every tier in this vendor's semantic_fallback.",
  "OK routing.second-opinion tools/model_routing/registry.json#anthropic: model-routing anthropic second_opinion is configured → Keep harness, operation and report_dir set for this vendor's second_opinion.",
  "ERROR routing.vendor-present tools/model_routing/registry.json#openai: model-routing registry is missing vendor 'openai' → Add the openai object to the model-routing registry.",
  "OK gitignore.env-secrets .gitignore: .gitignore has the akmon env secret pattern → Keep the '*.env' and '!*.env.example' patterns in .gitignore.",
  "OK ci.akmon-checks .github/workflows: CI checks akmon generated pointers and verify → Keep the akmon sync and verify commands in CI.",
  "OK changelog.package-mode: package mode: changelog discipline is owned by the akmon repository → Track the standard's changelog discipline in the akmon repository itself.",
  "OK attach.record _aitna/.akmon.toml: _aitna/.akmon.toml records akmon version {{version}} → Refresh _aitna/.akmon.toml on every akmon bump.",
  "OK attach.realign _aitna/.akmon.toml: _aitna/.akmon.toml was realigned at {{version}}, the version it records → Run `akmon init` after every bump so the realign follows the pin.",
]
