id = "cli/check-scope"
ecosystem = "shared"
kind = "cli"
covers = ["command:check", "code:check.scope"]

[fixture]
attach = "native"
name = "base"
git = false
files = { "_aitna/.akmon.toml" = "mount = \"package\"\nakmon_version = \"{{version}}\"\nlast_realign = \"{{version}}\"\nattached_archetype = \"demo\"\n\n[check]\nlint = \"nosuchcheck-never-installed {files}\"\n" }

[run]
argv = ["check", "--changed"]

[expected]
exit = 1
stderr = ""
stdout = "ERROR check.scope: cannot list the files changed against HEAD: `git diff --name-only HEAD --` exited with status 129 → Run it inside a git work tree\n"
