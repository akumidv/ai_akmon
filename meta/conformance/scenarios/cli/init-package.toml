# init in package mode, the offline realign shape: a record already exists (a first package
# attach would ask the remote for its latest release tag — network, off the corpus's hermetic
# contract) and the manifest carries the dev pin, so the attach completes (exit 0) and the
# generated wiring hangs every hook from $CLAUDE_PROJECT_DIR ({{hook <anchor> <name>}}).
# Python-tagged: init records the Python project's own checks (ruff) and names the Python
# carrier; the Node attach (package.json pin, JS linters) is C105/C109's node scenario.
id = "cli/init-package"
ecosystem = "python"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "native"


[run]
argv = ["init", "--mode", "package", "--yes", "--project-root", "{{root}}"]

[expected]
exit = 0
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: package (requested) · dev layer: _aitna/\nakmon init: wrote _aitna/agents/review/README.md\nakmon init: wrote _aitna/agents/architect/README.md\nakmon init: AGENTS.md already carries an akmon block — left untouched\nakmon init: .gitignore: added the akmon entries (secrets, dev-layer venv, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=package, akmon_version={{version}})\nakmon init: pyproject.toml: [tool.ruff] extends akmon's Python rules (_aitna/.akmon/profiles/ruff.toml)\nakmon init: akmon check will run: ruff (recorded as [check])\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: _aitna/.akmon/profiles/ruff.toml\nok: CLAUDE.md\nok: .github/copilot-instructions.md\nok: GEMINI.md\nok: .codex/README.md\nok: .codex/hooks.json\nok: .claude/settings.json\nok: .claude/skills/demo/SKILL.md\nok: .agents/skills/demo/SKILL.md\nok: _aitna/.akmon/guardrails/_common.md\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=strongest · reasoner=strongest · auditor=strongest · worker=worker · mid=mid · second-opinion=codex(off)\n⚠ using semantic model labels because no concrete model list was provided; run model discovery or pass --available to bind vendor aliases locally\n\nakmon init: attached, with steps left to a human/agent decision:\n  1. classify the project (archetype + language) against ARCHETYPES.md, import the language profile in AGENTS.md, and set `attached_archetype` in _aitna/.akmon.toml\n  2. `akmon verify --strict` checks the existing AGENTS.md block against the contract\n  3. add the contract checks to your existing workflow(s): `akmon sync --check` and `akmon verify --strict`\n  4. add ruff to the project's development dependencies so `akmon check` can run it\n  5. pin the test environment: record the project's own pytest invocation as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5 — do not build a venv when the project already has one)\n  6. run `akmon verify --strict` and review the diff — the owner commits, not the assistant (D5)\n"
[expected.files]
"_aitna/.akmon.toml" = "mount = \"package\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\nlast_realign = \"{{version}}\"\n\n[check]\n# What `akmon check` runs: the project's own commands, `{files}` becoming the files a run covers.\nruff = \"ruff check {files}\"\n"
".claude/settings.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR git-commit-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write|MultiEdit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR role-on-code}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR analysis-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Task|Agent\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-log}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash|Edit|Write|MultiEdit|Task|Agent|Read|Grep|Glob\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-nudge}}\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR session-start-agent}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR gate-audit}}\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
