id = "cli/init-node-mode-refused"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

# A mounted first attach of a repository with no package.json is the Python implementation's (C129:
# a mounted attach is Node for package.json with no Python files): the JavaScript init refuses it
# before touching the project and names the Python command.
[fixture]
attach = "none"
name = "base"

[run]
argv = ["init", "--mode", "vendored", "--yes", "--project-root", "{{root}}"]

[expected]
exit = 2
stderr = "akmon init: this project is attached by the Python implementation of akmon (a mounted attach is Node only for a repository with package.json and no Python files); run it, or pass `--ecosystem node` to attach it with this JavaScript implementation:\n    uvx --from git+https://github.com/akumidv/ai_akmon@{{ref}} akmon init --mode vendored\n"
stdout = ""
