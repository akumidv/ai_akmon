id = "cli/sync-obsolete"
ecosystem = "shared"
kind = "cli"
covers = ["command:sync", "code:sync.obsolete-generated"]

[fixture]
attach = "native"
warmup = "before"
name = "base"
remove = ["skills/demo"]
files = { ".claude/skills/demo/SKILL.md" = "# demo\n\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nSource skill: [../../skills/demo/SKILL.md](../../skills/demo/SKILL.md)\n\nRead and follow the source SKILL.md. Do not duplicate its contents here.\n" }

[run]
argv = ["sync", "--check"]

