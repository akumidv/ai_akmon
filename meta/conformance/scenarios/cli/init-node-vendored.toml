# C129: a first attach of a Node repository in mode vendored by the JavaScript CLI: the copy holds the
# standard's members plus the CLI data and package.json (init.json tree_members_node), the block and
# the charters point into the mount, the record names ecosystem = "node", and the mount's own CLI runs
# the generated surface.
id = "cli/init-node-vendored"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "none"
name = "base"
# src/app.py is Python (C129: a Python source makes a Python repository)
remove = ["_aitna", "AGENTS.md", "src"]
files = { "package.json" = "{\n  \"name\": \"demo\",\n  \"private\": true\n}\n" }

[run]
argv = ["init", "--mode", "vendored", "--project-root", "{{root}}", "--yes"]

[expected]
file_absent = ["_aitna/.akmon", "node_modules", "_aitna/akmon/meta", "_aitna/akmon/js/akmon/cli.test.mjs"]
exit = 0
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: vendored (requested) · dev layer: _aitna/\nakmon init: vendored 17 standard-tree members into _aitna/akmon (pin: {{version}})\nakmon init: wrote _aitna/TASKS.md\nakmon init: wrote _aitna/memory/README.md\nakmon init: wrote _aitna/agents/review/README.md\nakmon init: wrote _aitna/agents/architect/README.md\nakmon init: wrote _aitna/agents/engineer/README.md\nakmon init: wrote AGENTS.md with the akmon block\nakmon init: .gitignore: added the akmon entries (secrets, Node dependencies, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=vendored, akmon_version={{version}})\nakmon init: wrote .oxlintrc.json extending akmon's JavaScript/TypeScript rules (./_aitna/akmon/profiles/oxlint.json)\nakmon init: akmon check will run: oxlint (recorded as [check])\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=strongest · reasoner=strongest · auditor=strongest · worker=worker · mid=mid · second-opinion=codex(off)\n⚠ using semantic model labels because no concrete model list was provided; run model discovery or pass --available to bind vendor aliases locally\n\nakmon init: attached, with steps left to a human/agent decision:\n  1. classify the project's archetype against ARCHETYPES.md and set `attached_archetype` in _aitna/.akmon.toml\n  2. add the contract checks to your existing workflow(s): `node _aitna/akmon/js/akmon/cli.mjs sync --check` and `node _aitna/akmon/js/akmon/cli.mjs verify --strict`\n  3. narrow `env` in .oxlintrc.json to where the project's code runs (`node`, `browser`, …); oxlint does not read `/* global */` comments, so name globals under `globals`\n  4. add oxlint as a development dependency so `akmon check` can run it: `npm install -D -E oxlint`\n  5. pin the test environment: record the project's own test command (`npm test`, for example) as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5)\n  6. optional: name the mounted CLI in package.json `scripts` (`\"akmon\": \"node _aitna/akmon/js/akmon/cli.mjs\"`, then `npm run akmon -- verify --strict`); init does not edit package.json\n  7. run `node _aitna/akmon/js/akmon/cli.mjs verify --strict` and review the diff — the owner commits, not the assistant (D5)\n"
[expected.files]
"_aitna/.akmon.toml" = "# akmon integration record — written by `akmon init`, refreshed on realign.\n# The version this project sits on; a later bump diffs the CHANGELOG window against it.\nmount = \"vendored\"\necosystem = \"node\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\n\nlast_realign = \"{{version}}\"\n[test]\n# The project's own test invocation, used verbatim by the release check\n# (BOOTSTRAP §A5). Uncomment and set it to whatever this project already uses:\n# runner = \"npm test\"\n\n[check]\n# What `akmon check` runs: the project's own commands, `{files}` becoming the files a run covers.\noxlint = { command = \"npx --no-install oxlint {files}\", files = [\"*.js\", \"*.mjs\", \"*.cjs\", \"*.jsx\", \"*.ts\", \"*.mts\", \"*.cts\", \"*.tsx\"] }\n"
".oxlintrc.json" = "{\n  \"extends\": [\"./_aitna/akmon/profiles/oxlint.json\"],\n  \"env\": { \"browser\": true, \"node\": true }\n}\n"
"_aitna/akmon/.gitignore" = "__pycache__/\n*.py[cod]\n"
