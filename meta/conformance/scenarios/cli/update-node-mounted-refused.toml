id = "cli/update-node-mounted-refused"
ecosystem = "node"
kind = "cli"
covers = ["command:update"]

# A mounted record belongs to the Python implementation: the JavaScript update refuses before the
# plan, naming what the record holds (C107).
[fixture]
attach = "native"
warmup = false
files = { "_aitna/.akmon.toml" = "mount = \"submodule\"\nakmon_version = \"0.1.0\"\nlast_realign = \"0.1.0\"\n" }

[run]
argv = ["update", "--ref", "v{{version}}", "--project-root", "{{root}}"]

[expected]
exit = 2
stdout = ""
stderr = "akmon update: this project's integration record is not a Node package attach (mount = \"submodule\"); the JavaScript implementation updates Node projects in package mode only, and the Python implementation of akmon serves the other records\n"
