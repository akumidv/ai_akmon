id = "cli/verify-node-language-profile-missing"
ecosystem = "node"
kind = "cli"
covers = ["command:verify"]

# The Node side of agents.language-profile (C127; the code is Python-owned in coverage.toml because
# the profile follows the carrier's manifest): a package.json project whose AGENTS.md imports only
# the common guardrail warns, naming the js.md line to add under the package prefix.
[fixture]
attach = "native"
warmup = true

[fixture.files]
"AGENTS.md" = "# AGENTS.md\n\n## Dev layer — akmon\n\nThe standard ships in the installed `akmon` package: `akmon path` prints its root.\nArchetype: `ARCHETYPES.md`. Read `_aitna/memory` at session start.\n\nThe owner verifies consequential decisions recorded in ADRs. D5 is always-on. Secrets come from `.env`.\nSkills live in root `skills/`; generated vendor skill stubs are pointers only.\n\n**Delegation is the default.** For every non-trivial task, delegate independent mechanical\nsubsteps without waiting for an owner prompt; the orchestrator keeps decomposition, routing,\nsynthesis, and owner dialogue.\n\n@_aitna/.akmon/guardrails/_common.md\n"

[run]
argv = ["verify"]

[expected]
exit = 0
stderr = ""
stdout = "OK layout.consumer-path AGENTS.md: AGENTS.md exists → Keep AGENTS.md in place.\nOK layout.consumer-path _aitna/TASKS.md: _aitna/TASKS.md exists → Keep _aitna/TASKS.md in place.\nOK layout.standard-path standard tree:README.md: standard tree:README.md exists → Keep standard tree:README.md in the standard tree.\nOK layout.standard-path standard tree:BOOTSTRAP.md: standard tree:BOOTSTRAP.md exists → Keep standard tree:BOOTSTRAP.md in the standard tree.\nOK layout.standard-path standard tree:ARCHETYPES.md: standard tree:ARCHETYPES.md exists → Keep standard tree:ARCHETYPES.md in the standard tree.\nOK layout.standard-path standard tree:CHANGELOG.md: standard tree:CHANGELOG.md exists → Keep standard tree:CHANGELOG.md in the standard tree.\nOK layout.standard-path standard tree:MODEL.md: standard tree:MODEL.md exists → Keep standard tree:MODEL.md in the standard tree.\nOK layout.standard-path standard tree:CAPABILITIES.md: standard tree:CAPABILITIES.md exists → Keep standard tree:CAPABILITIES.md in the standard tree.\nOK layout.standard-path standard tree:roles/README.md: standard tree:roles/README.md exists → Keep standard tree:roles/README.md in the standard tree.\nOK layout.standard-path standard tree:roles/review.md: standard tree:roles/review.md exists → Keep standard tree:roles/review.md in the standard tree.\nOK layout.standard-path standard tree:roles/architect.md: standard tree:roles/architect.md exists → Keep standard tree:roles/architect.md in the standard tree.\nOK layout.standard-path standard tree:roles/engineer.md: standard tree:roles/engineer.md exists → Keep standard tree:roles/engineer.md in the standard tree.\nOK layout.standard-path standard tree:roles/learn.md: standard tree:roles/learn.md exists → Keep standard tree:roles/learn.md in the standard tree.\nOK layout.standard-path standard tree:roles/release.md: standard tree:roles/release.md exists → Keep standard tree:roles/release.md in the standard tree.\nOK layout.standard-path standard tre