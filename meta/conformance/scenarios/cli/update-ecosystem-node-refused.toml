id = "cli/update-ecosystem-node-refused"
ecosystem = "python"
kind = "cli"
covers = ["command:update"]

# A record the JavaScript implementation serves: the Python update refuses before the plan and names
# the implementation that moves its pin (C107).
[fixture]
attach = "native"
warmup = "before"
name = "base"
files = { "_aitna/.akmon.toml" = "mount = \"package\"\necosystem = \"node\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\nlast_realign = \"{{version}}\"\n" }

[run]
argv = ["update", "--ref", "v{{version}}", "--project-root", "{{root}}"]

[expected]
exit = 2
stderr = "akmon update: this project's integration record names ecosystem = \"node\" (_aitna/.akmon.toml), and the Python implementation serves Python projects only; run the JavaScript implementation for it: npx akmon update\n"
stdout = ""
