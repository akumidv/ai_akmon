# C129: mode subtree in a Node repository: the JavaScript init prints the one command that writes
# history, as the Python does, and the re-run names the mount's own CLI; nothing is written.
id = "cli/init-node-subtree-refused"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "none"
name = "base"
repo = true
# src/app.py is Python (C129: a Python source makes a Python repository)
remove = ["_aitna", "AGENTS.md", "src"]
files = { "package.json" = "{\n  \"name\": \"demo\",\n  \"private\": true\n}\n" }

[run]
argv = ["init", "--mode", "subtree", "--repo", "{{repo}}", "--project-root", "{{root}}", "--yes"]

[expected]
exit = 2
stderr = "akmon init: mode 'subtree' needs one command `init` must not run for you — `git subtree add` creates commits, and commits are the owner's (D5). Run it, then re-run init:\n    git subtree add --prefix _aitna/akmon {{repo}} main --squash\n    node _aitna/akmon/js/akmon/cli.mjs init --mode subtree --ref main\n"
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: subtree (requested) · dev layer: _aitna/\n"
