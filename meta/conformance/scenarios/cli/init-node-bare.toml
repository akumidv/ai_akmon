id = "cli/init-node-bare"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

# A first attach on a project with no package.json: everything is written, the pin step comes
# first and the exit is 1 until akmon is pinned in devDependencies.
[fixture]
attach = "none"
name = "base"

[run]
argv = ["init", "--yes", "--project-root", "{{root}}"]

[expected]
exit = 1
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: package (the JavaScript implementation attaches in package mode) · dev layer: _aitna/\nakmon init: wrote _aitna/agents/review/README.md\nakmon init: wrote _aitna/agents/architect/README.md\nakmon init: AGENTS.md already carries an akmon block — left untouched\nakmon init: .gitignore: added the akmon entries (secrets, Node dependencies, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=package, akmon_version={{version}})\nakmon init: wrote .oxlintrc.json extending akmon's JavaScript/TypeScript rules (./node_modules/akmon/profiles/oxlint.json)\nakmon init: akmon check will run: oxlint (recorded as [check])\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\nupdated: _aitna/.akmon/guardrails/_common.md\nok: _aitna/.akmon.toml\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=strongest · reasoner=strongest · auditor=strongest · worker=worker · mid=mid · second-opinion=codex(off)\n⚠ using semantic model labels because no concrete model list was provided; run model discovery or pass --available to bind vendor aliases locally\n\nakmon init: attached, but INCOMPLETE:\n  1. **pin akmon in `devDependencies`** of package.json at an exact version, never in the runtime dependencies: `npm install -D -E akmon@{{version}}`. Until then `node_modules/akmon` is missing: the CI checks cannot run, and the generated hook commands fail silently because the scripts they name do not exist\n  2. classify the project (archetype + language) against ARCHETYPES.md, import the language profile in AGENTS.md, and set `attached_archetype` in _aitna/.akmon.toml\n  3. `akmon verify --strict` checks the existing AGENTS.md block against the contract\n  4. add the contract checks to your existing workflow(s): `npx akmon sync --check` and `npx akmon verify --strict`\n  5. narrow `env` in .oxlintrc.json to where the project's code runs (`node`, `browser`, …); oxlint does not read `/* global */` comments, so name globals under `globals`\n  6. add oxlint as a development dependency so `akmon check` can run it: `npm install -D -E oxlint`\n  7. pin the test environment: record the project's own test command (`npm test`, for example) as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5)\n  8. run `npx akmon verify --strict` and review the diff — the owner commits, not the assistant (D5)\n\nakmon init: exit 1: mode 'package' has no akmon pin in devDependencies yet (step 1) — nothing else attaches it, so this attach is not finished. Re-run `akmon init` after adding it (it keeps the recorded mode), or `akmon verify --strict` to re-check.\n"
[expected.files]
"_aitna/.akmon.toml" = "# akmon integration record — written by `akmon init`, refreshed on realign.\n# The version this project sits on; a later bump diffs the CHANGELOG window against it.\nmount = \"package\"\necosystem = \"node\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\n\n[test]\n# The project's own test invocation, used verbatim by the release check\n# (BOOTSTRAP §A5). Uncomment and set it to whatever this project already uses:\n# runner = \"npm test\"\n\n[check]\n# What `akmon check` runs: the project's own commands, `{files}` becoming the files a run covers.\noxlint = { command = \"npx --no-install oxlint {files}\", files = [\"*.js\", \"*.mjs\", \"*.cjs\", \"*.jsx\", \"*.ts\", \"*.mts\", \"*.cts\", \"*.tsx\"] }\n"
