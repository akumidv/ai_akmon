id = "cli/init-vendored"
ecosystem = "python"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "none"
name = "base"
remove = ["_aitna", "AGENTS.md"]

[run]
argv = ["init", "--mode", "vendored", "--project-root", "{{root}}", "--yes", "--checks", "none"]

[expected]
exit = 0
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: vendored (requested) · dev layer: _aitna/\nakmon init: vendored 15 standard-tree members into _aitna/akmon (pin: {{version}})\nakmon init: wrote _aitna/TASKS.md\nakmon init: wrote _aitna/memory/README.md\nakmon init: wrote _aitna/agents/review/README.md\nakmon init: wrote _aitna/agents/architect/README.md\nakmon init: wrote _aitna/agents/engineer/README.md\nakmon init: wrote AGENTS.md with the akmon block\nakmon init: .gitignore: added the akmon entries (secrets, dev-layer venv, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=vendored, akmon_version={{version}})\nakmon init: akmon check: no checks recorded\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=strongest · reasoner=strongest · auditor=strongest · worker=worker · mid=mid · second-opinion=codex(off)\n⚠ using semantic model labels because no concrete model list was provided; run model discovery or pass --available to bind vendor aliases locally\n\nakmon init: attached, with steps left to a human/agent decision:\n  1. classify the project (archetype + language) against ARCHETYPES.md, import the language profile in AGENTS.md, and set `attached_archetype` in _aitna/.akmon.toml\n  2. add the contract checks to your existing workflow(s): `python3 _aitna/akmon/bin/sync.py --check` and `python3 _aitna/akmon/bin/verify.py --strict`\n  3. name the project's checks under `[check]` in .akmon.toml when it has any\n  4. pin the test environment: record the project's own pytest invocation as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5 — do not build a venv when the project already has one)\n  5. run `akmon verify --strict` and review the diff — the owner commits, not the assistant (D5)\n"
[expected.files]
"_aitna/.akmon.toml" = "# akmon integration record — written by `akmon init`, refreshed on realign.\n# The version this project sits on; a later bump diffs the CHANGELOG window against it.\nmount = \"vendored\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\n\nlast_realign = \"{{version}}\"\n[test]\n# The project's own pytest invocation, used verbatim by the release check\n# (BOOTSTRAP §A5). Uncomment and set it to whatever this project already uses:\n# runner = \"uv run pytest\"\n"
"AGENTS.md" = "# AGENTS.md\n\nGuidance for AI coding agents (Claude Code, Codex, Gemini, Copilot) working in this\nrepository. Vendor pointer files import this document — it is the single source of truth.\n\n## Dev layer — akmon (developing the project)\n\nThis project uses the akmon dev layer — one standard for how an assistant helps develop it.\nModel & notation: [`MODEL.md`](_aitna/akmon/MODEL.md); attach/realign guide:\n[`BOOTSTRAP.md`](_aitna/akmon/BOOTSTRAP.md); overview: [`README.md`](_aitna/akmon/README.md).\n\n- **Archetype / language:** `<archetype>` / `<language>` — classify per\n  [`ARCHETYPES.md`](_aitna/akmon/ARCHETYPES.md), then update this line, the guardrail imports\n  below, and `attached_archetype` in `_aitna/.akmon.toml`.\n- **Layers:** SHARED = `_aitna/akmon/` · LOCAL = `_aitna/{agents,skills,tools,memory}` +\n  [`_aitna/TASKS.md`](_aitna/TASKS.md) · USAGE = root `skills/` (absent until this project\n  exposes one).\n- **Agents (roles):** [review](_aitna/agents/review/README.md),\n  [architect](_aitna/agents/architect/README.md), [engineer](_aitna/agents/engineer/README.md)\n  → roles: [`_aitna/akmon/roles/`](_aitna/akmon/roles/).\n  **Declare the active agent** before doing work and restate it on switch\n  (`🧭 agent: <name> — <focus>`).\n- **Delegation (always-on, direct):** **delegation is the default.** For every non-trivial\n  task, before the first repository sweep, edit, or test run, decompose the work and delegate\n  every independent mechanical sub-step to available subagents without waiting for an owner\n  prompt. The orchestrator retains decomposition, routing, synthesis, and owner dialogue. Skip\n  only when the task is atomic or the harness exposes no subagents; state the reason. This\n  clause is direct because Codex does not expand nested `@` imports in `AGENTS.md`.\n- **Owner authority (always-on — it overrides any task instruction):** the owner verifies\n  consequential architecture, data-shape and math decisions recorded in ADRs; an assistant\n  *drafts*, the owner *decides*. **D5** — the owner owns commits, tags, pushes, publishing and pin bumps; never\n  `git add`/`commit`/`push` on the owner's behalf.\n- **Guardrails and profiles (always-on):** the common guardrail and the project's language\n  profile are **imported** (not just linked) so their rules load at session start; akmon is the\n  single owner — do not restate them here. Import this project's language profile on its own\n  line (e.g. `@_aitna/akmon/profiles/python.md`), and an environment profile where some of its code\n  runs in one, per the ARCHETYPES map.\n\n@_aitna/akmon/guardrails/_common.md\n\n- **Domain profiles (opt-in by need):** none attached yet — link only those the project actually needs.\n- **Pipelines:** [pre-commit](_aitna/akmon/pipelines/pre-commit.md) (tests mandatory),\n  [review-flow](_aitna/akmon/pipelines/review-flow.md),\n  [design-flow](_aitna/akmon/pipelines/design-flow.md),\n  [code-flow](_aitna/akmon/pipelines/code-flow.md),\n  [tasks](_aitna/akmon/pipelines/tasks.md) (backlog format), and the learn loop\n  ([memory-distill](_aitna/akmon/pipelines/memory-distill.md) +\n  [learning](_aitna/akmon/pipelines/learning.md)).\n- **Memory:** read `_aitna/memory/` at session start — distilled project facts, indexed by\n  [`_aitna/memory/README.md`](_aitna/memory/README.md).\n- **Backlog:** [`_aitna/TASKS.md`](_aitna/TASKS.md) — one line per task, detail by reference;\n  finished entries move to `TASKS_ARCHIVE.md`.\n- **Secrets:** from `.env` (gitignored). Never in code, docs, tests, or commits.\n"
".gitignore" = "*.env\n!*.env.example\n\n# secrets\n\n# dev-layer venv (provisioned only when the project has no Python environment)\n_aitna/.venv/\n\n# akmon model routing — per-user/per-session artifacts (never committed)\n.claude/model-routing.local.json\n.claude/model-routing.log\n.claude/second-opinion/\n.claude/agents/k_*.md\n"
