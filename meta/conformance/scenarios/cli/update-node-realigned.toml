id = "cli/update-node-realigned"
ecosystem = "node"
kind = "cli"
covers = ["command:update", "command:init"]

# A Node package attach already at the target: the pin stays, and the project's own installed CLI
# (node_modules/akmon) runs init, sync --check and verify --strict. No manager, no registry.
[fixture]
attach = "native"
warmup = "before"

[run]
argv = ["update", "--ref", "v{{version}}", "--project-root", "{{root}}"]

