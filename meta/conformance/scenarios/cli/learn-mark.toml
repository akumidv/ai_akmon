# mark records the end of a run: last_run is now, the counted sessions are cleared.
id = "cli/learn-mark"
ecosystem = "shared"
kind = "cli"
covers = ["command:learn"]

[fixture]
attach = "native"
files = { "_aitna/local/learning.json" = "{\n  \"last_run\": null,\n  \"since\": \"2999-01-01T00:00:00Z\",\n  \"sessions\": [\n    \"seed-0\",\n    \"seed-1\",\n    \"seed-2\"\n  ]\n}\n" }

[env]
HOME = "{{tmp}}"

[run]
argv = ["learn", "mark"]

[expected]
exit = 0
stderr = ""
stdout = "akmon learn: learning run recorded at {{ts}}; the counted sessions are cleared\n"
