id = "cli/verify-node-pin-runtime"
ecosystem = "node"
kind = "cli"
covers = ["command:verify"]

# akmon pinned as a runtime dependency: dev tooling pushed onto the package's users is an error, and a dependencies pin is not judged for exactness.
[fixture]
attach = "native"
warmup = true

[fixture.files]
".github/workflows/ci.yml" = "name: CI\non: [push]\njobs:\n  checks:\n    runs-on: ubuntu-latest\n    steps:\n      - run: npx akmon sync --check\n      - run: npx akmon verify --strict\n"
"package.json" = "{\n  \"name\": \"corpus-consumer\",\n  \"private\": true,\n  \"dependencies\": {\n    \"akmon\": \"{{version}}\"\n  }\n}\n"

[run]
argv = ["verify"]

