# C129 step 8: the move of a Python-mounted record to the JavaScript implementation keeps a [check]
# the owner edited (C123) — only akmon's exact ruff default is decided again — and names no ruff.toml
# that is not byte for byte akmon's template. Node-tagged, as cli/init-node-switch-from-python.
id = "cli/init-node-switch-keeps-check"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "mount"

[fixture.files]
"_aitna/.akmon.toml" = "# akmon integration record — written by `akmon init`, refreshed on realign.\n# The version this project sits on; a later bump diffs the CHANGELOG window against it.\nmount = \"vendored\"\nakmon_version = \"{{version}}\"\nattached_archetype = \"unclassified\"\n\nlast_realign = \"{{version}}\"\n[test]\n# The project's own pytest invocation, used verbatim by the release check\n# (BOOTSTRAP §A5). Uncomment and set it to whatever this project already uses:\n# runner = \"uv run pytest\"\n\n[check]\n# What `akmon check` runs: the project's own commands, `{files}` becoming the files a run covers.\nruff = \"ruff check --fix {files}\"\n"
"ruff.toml" = "line-length = 100\n# ruff with akmon's Python rules; adjust them here with extend-select, extend-ignore and\n# per-file-ignores.\nextend = \"_aitna/akmon/profiles/ruff.toml\"\n"
".claude/settings.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/git-commit-guard.py\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write|MultiEdit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/role-on-code.py\\\"\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/analysis-guard.py\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Task|Agent\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/delegation-log.py\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash|Edit|Write|MultiEdit|Task|Agent|Read|Grep|Glob\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/delegation-nudge.py\\\"\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/session-start-agent.py\\\"\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/model-routing.py\\\"\"\n          }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/model-routing.py\\\"\"\n          }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/_aitna/akmon/hooks/gate-audit.py\\\"\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
".codex/hooks.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash|apply_patch\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$(git rev-parse --show-toplevel)/_aitna/akmon/hooks/codex-hook.py\\\" role-on-code\",\n            \"statusMessage\": \"Checking akmon role switch\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$(git rev-parse --show-toplevel)/_aitna/akmon/hooks/codex-hook.py\\\" analysis-guard\",\n            \"statusMessage\": \"Checking analysis-before-mutation\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"matcher\": \"startup|resume|clear|compact\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"python3 \\\"$(git rev-parse --show-toplevel)/_aitna/akmon/hooks/codex-hook.py\\\" session-start\",\n            \"statusMessage\": \"Loading akmon session reminders\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"

[run]
argv = ["init", "--ecosystem", "node", "--project-root", "{{root}}", "--yes"]

[expected]
exit = 0
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: vendored (recorded) · dev layer: _aitna/\nakmon init: moving the integration record to the JavaScript implementation: ecosystem python → node (_aitna/.akmon.toml)\nakmon init: _aitna/akmon is the tree this CLI runs from — nothing to copy (pin: {{version}})\nakmon init: wrote _aitna/agents/review/README.md\nakmon init: wrote _aitna/agents/architect/README.md\nakmon init: AGENTS.md already carries an akmon block — left untouched\nakmon init: .gitignore: added the akmon entries (secrets, Node dependencies, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=vendored, akmon_version={{version}})\nakmon init: [check] already names this project's checks — left untouched\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=opus · reasoner=opus · auditor=opus · worker=haiku · mid=sonnet · second-opinion=codex(off)\n\nakmon init: attached, with steps left to a human/agent decision:\n  1. classify the project's archetype against ARCHETYPES.md and set `attached_archetype` in _aitna/.akmon.toml\n  2. `node _aitna/akmon/js/akmon/cli.mjs verify --strict` checks the existing AGENTS.md block against the contract\n  3. update the akmon commands in your existing workflow(s): `node _aitna/akmon/js/akmon/cli.mjs sync --check` and `node _aitna/akmon/js/akmon/cli.mjs verify --strict`\n  4. pin the test environment: record the project's own test command (`npm test`, for example) as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5)\n  5. Codex: the move rewrote the akmon entries of `.codex/hooks.json` to run node, which voids their `/hooks` approval — such an entry keeps reporting `enabled: true` and runs nothing until re-approved; open `/hooks` in Codex and review and trust them again (BOOTSTRAP §F)\n  6. optional: name the mounted CLI in package.json `scripts` (`\"akmon\": \"node _aitna/akmon/js/akmon/cli.mjs\"`, then `npm run akmon -- verify --strict`); init does not edit package.json\n  7. run `node _aitna/akmon/js/akmon/cli.mjs verify --strict` and review the diff — the owner commits, not the assistant (D5)\n"
