# `--project-root` names the project: the state is read from there although the working directory is
# not (and holds no project root of its own).
id = "cli/learn-status-project-root"
ecosystem = "shared"
kind = "cli"
covers = ["command:learn"]

[fixture]
attach = "none"
files = { "other/_aitna/.local/learning.json" = "{\n  \"last_run\": \"2999-01-01T00:00:00Z\",\n  \"since\": null,\n  \"sessions\": [\n    \"a\"\n  ]\n}\n" }

[env]
HOME = "{{tmp}}"

[run]
argv = ["learn", "status", "--project-root", "{{root}}/other"]

[expected]
exit = 0
stderr = ""
stdout = "last run: 2999-01-01T00:00:00Z\ncounting since: no session recorded yet\nsessions since the last run: 1\ndays since the last run (or since counting began): 0\nreminder at 10 sessions or 7 days (from <dev root>/.akmon.toml [learning])\nstate: _aitna/.local/learning.json\n"
