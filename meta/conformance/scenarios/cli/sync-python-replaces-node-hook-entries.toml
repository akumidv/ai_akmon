id = "cli/sync-python-replaces-node-hook-entries"
ecosystem = "python"
kind = "cli"
covers = ["command:sync"]

# A Python project whose wiring still carries the entries the JS `sync` writes for a Node package
# (`node "<anchor>/node_modules/akmon/js/hooks/<script>.mjs"`, from `sync.json::node_hook_command`
# and `node_codex_hook_command`): the Python `sync` recognises every one as akmon's and replaces
# it with its own launcher entry, keeping the project's own hook (C16).

[fixture]
attach = "native"
warmup = "before"

[fixture.files]
".claude/settings.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write|MultiEdit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/role-on-code.mjs\\\"\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/analysis-guard.mjs\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Task|Agent\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/delegation-log.mjs\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash|Edit|Write|MultiEdit|Task|Agent|Read|Grep|Glob\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/delegation-nudge.mjs\\\"\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node tools/own-hook.mjs\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/session-start-agent.mjs\\\"\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/model-routing.mjs\\\"\"\n          }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/model-routing.mjs\\\"\"\n          }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/gate-audit.mjs\\\"\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
".codex/hooks.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash|apply_patch\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$(git rev-parse --show-toplevel)/node_modules/akmon/js/hooks/codex-hook.mjs\\\" role-on-code\",\n            \"statusMessage\": \"Checking akmon role switch\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$(git rev-parse --show-toplevel)/node_modules/akmon/js/hooks/codex-hook.mjs\\\" analysis-guard\",\n            \"statusMessage\": \"Checking analysis-before-mutation\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"matcher\": \"startup|resume|clear|compact\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node \\\"$(git rev-parse --show-toplevel)/node_modules/akmon/js/hooks/codex-hook.mjs\\\" session-start\",\n            \"statusMessage\": \"Loading akmon session reminders\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"

[run]
argv = ["sync"]

[expected]
exit = 0
stderr = ""
stdout = "updated: .codex/hooks.json\nupdated: .claude/settings.json\nok: CLAUDE.md\nok: .github/copilot-instructions.md\nok: GEMINI.md\nok: .codex/README.md\nok: .claude/skills/demo/SKILL.md\nok: .agents/skills/demo/SKILL.md\nok: _aitna/.akmon/guardrails/_common.md\nok: _aitna/.akmon/profiles/js.md\nok: _aitna/.akmon/profiles/python.md\nok: _aitna/.akmon.toml\n"
[expected.files]
".claude/settings.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node tools/own-hook.mjs\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR git-commit-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Edit|Write|MultiEdit\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR role-on-code}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR analysis-guard}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Task|Agent\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-log}}\"\n          }\n        ]\n      },\n      {\n        \"matcher\": \"Bash|Edit|Write|MultiEdit|Task|Agent|Read|Grep|Glob\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR delegation-nudge}}\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR session-start-agent}}\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR model-routing}}\"\n          }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $CLAUDE_PROJECT_DIR gate-audit}}\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
".codex/hooks.json" = "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash|apply_patch\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} role-on-code\",\n            \"statusMessage\": \"Checking akmon role switch\"\n          },\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} analysis-guard\",\n            \"statusMessage\": \"Checking analysis-before-mutation\"\n          }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"matcher\": \"startup|resume|clear|compact\",\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"{{hook $(git rev-parse --show-toplevel) codex-hook}} session-start\",\n            \"statusMessage\": \"Loading akmon session reminders\"\n          }\n        ]\n      }\n    ]\n  }\n}\n"
