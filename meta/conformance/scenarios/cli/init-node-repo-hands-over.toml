# C129: the Python init in a Node repository (package.json, no Python files) sets up no
# Python-run mount and runs no JavaScript: it prints the JavaScript implementation's command and exits
# 2 before touching anything (ADR 0009 decision 5, the C129 amendment of ADR 0020 D02).
id = "cli/init-node-repo-hands-over"
ecosystem = "python"
kind = "cli"
covers = ["command:init"]

[fixture]
attach = "none"
name = "base"
# src/app.py is Python (C129: a Python source makes a Python repository)
remove = ["_aitna", "AGENTS.md", "src"]
files = { "package.json" = "{\n  \"name\": \"demo\",\n  \"private\": true\n}\n" }

[run]
argv = ["init", "--mode", "vendored", "--project-root", "{{root}}", "--yes"]

[expected]
exit = 2
stderr = "akmon init: this project is a Node repository (package.json and no Python files), and the JavaScript implementation of akmon attaches it, with no Python needed; run it instead:\n    npx github:akumidv/ai_akmon#main init --mode vendored\n"
stdout = ""
