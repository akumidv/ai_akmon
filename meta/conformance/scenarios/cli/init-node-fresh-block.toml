id = "cli/init-node-fresh-block"
ecosystem = "node"
kind = "cli"
covers = ["command:init"]

# A Node attach with no AGENTS.md (C127): init writes the fresh akmon block, which imports the
# js language profile right after the common guardrail under the package prefix, because the
# project has a package.json; sync then materializes it. The archetype is still unclassified, so
# the classify step stays. `--ref main` pins the block's links, which otherwise follow the version.
[fixture]
attach = "native"
warmup = false
remove = ["_aitna/.akmon.toml", "AGENTS.md"]

[run]
argv = ["init", "--yes", "--ref", "main", "--project-root", "{{root}}"]

[expected]
exit = 0
stderr = ""
stdout = "akmon init: attaching to {{root}}\nakmon init: mount mode: package (the JavaScript implementation attaches in package mode) · dev layer: _aitna/\nakmon init: wrote _aitna/agents/learning/README.md\nakmon init: wrote _aitna/agents/release/README.md\nakmon init: wrote AGENTS.md with the akmon block\nakmon init: .gitignore: added the akmon entries (secrets, Node dependencies, routing artifacts)\nakmon init: recorded _aitna/.akmon.toml (mount=package, akmon_version={{version}})\nakmon init: wrote .oxlintrc.json extending akmon's JavaScript/TypeScript rules (./node_modules/akmon/profiles/oxlint.json)\nakmon init: akmon check will run: oxlint (recorded as [check])\nakmon init: running sync (generated pointers, hook wiring, imported guardrails)\nupdated: CLAUDE.md\nupdated: .github/copilot-instructions.md\nupdated: GEMINI.md\nupdated: .codex/README.md\nupdated: .codex/hooks.json\nupdated: .claude/settings.json\nupdated: .claude/skills/demo/SKILL.md\nupdated: .agents/skills/demo/SKILL.md\nupdated: _aitna/.akmon/guardrails/_common.md\nupdated: _aitna/.akmon/profiles/js.md\nok: _aitna/.akmon.toml\nakmon init: running model-routing init (subagent definitions + local routing config)\nupdated: .claude/agents/k_explorer.md\nupdated: .claude/agents/k_mechanic.md\nupdated: .claude/agents/k_validator.md\nupdated: .claude/agents/k_implementer.md\nupdated: .claude/agents/k_reasoner.md\nupdated: .claude/agents/k_auditor.md\nupdated: .claude/model-routing.local.json\nmodel routing: vendor=anthropic · orchestrator=opus · reasoner=opus · auditor=opus · worker=haiku · mid=sonnet · second-opinion=unavailable (off)\n\nakmon init: attached, with steps left to a human/agent decision:\n  1. classify the project's archetype against ARCHETYPES.md and set `attached_archetype` in _aitna/.akmon.toml\n  2. add the contract checks to your existing workflow(s): `npx akmon sync --check` and `npx akmon verify --strict`\n  3. narrow `env` in .oxlintrc.json to where the project's code runs (`node`, `browser`, …); oxlint does not read `/* global */` comments, so name globals under `globals`\n  4. add oxlint as a development dependency so `akmon check` can run it: `npm install -D -E oxlint`\n  5. pin the test environment: record the project's own test command (`npm test`, for example) as `[test].runner` in _aitna/.akmon.toml (BOOTSTRAP §A5)\n  6. run `npx akmon verify --strict` and review the diff — the owner commits, not the assistant (D5)\n"
[expected.files]
"AGENTS.md" = "# AGENTS.md\n\nGuidance for AI coding agents (Claude Code, Codex, Gemini, Copilot) working in this\nrepository. Vendor pointer files import this document — it is the single source of truth.\n\n## Dev layer — akmon (developing the project)\n\nThis project uses the akmon dev layer — one standard for how an assistant helps develop it.\nModel & notation: [`MODEL.md`](https://github.com/akumidv/ai_akmon/blob/main/MODEL.md); attach/realign guide:\n[`BOOTSTRAP.md`](https://github.com/akumidv/ai_akmon/blob/main/BOOTSTRAP.md); overview: [`README.md`](https://github.com/akumidv/ai_akmon/blob/main/README.md).\n\n- **Archetype / language:** `<archetype>` / `<language>` — classify per\n  [`ARCHETYPES.md`](https://github.com/akumidv/ai_akmon/blob/main/ARCHETYPES.md), then update this line, the guardrail imports\n  below, and `attached_archetype` in `_aitna/.akmon.toml`.\n- **Layers:** SHARED = installed `akmon` npm package (hooks run from `node_modules/akmon/js/hooks`; only the imported guardrails and profiles are materialized, under `_aitna/.akmon/`; `npx akmon path` locates the rest) · LOCAL = `_aitna/{agents,skills,tools,memory}` +\n  [`_aitna/TASKS.md`](_aitna/TASKS.md) · USAGE = root `skills/` (absent until this project\n  exposes one).\n- **Agents:** the [development](_aitna/agents/development/README.md) charter — its roles are\n  review, architect and engineer → roles: [`akmon/roles/`](https://github.com/akumidv/ai_akmon/blob/main/roles/README.md) — run `akmon path` to read them locally — and the\n  [learning](_aitna/agents/learning/README.md) and\n  [release](_aitna/agents/release/README.md) charters, one per agent.\n  **Declare the active role** before doing work and restate it on switch\n  (`🧭 role: <name> — <focus>`).\n- **Delegation (always-on, direct):** **delegation is the default.** For every non-trivial\n  task, before the first repository sweep, edit, or test run, decompose the work and delegate\n  every independent mechanical sub-step to available subagents without waiting for an owner\n  prompt. The orchestrator retains decomposition, routing, synthesis, and owner dialogue. Skip\n  only when the task is atomic or the harness exposes no subagents; state the reason. **The work\n  style** (stated at session start) sets the rest: *delegating* also hands whole athla and\n  higher-tier calls to delegates; *controlling* leaves stages to sessions the developer starts,\n  and where a reasoner, auditor or athlos implementer would be called it recommends which, for\n  what and why. This clause is direct because Codex does not expand nested `@` imports in `AGENTS.md`.\n- **Owner authority (always-on — it overrides any task instruction):** the owner verifies\n  consequential architecture, data-shape and math decisions recorded in ADRs; an assistant\n  *drafts*, the owner *decides*. **D5** — the owner owns commits, tags, pushes, publishing and pin bumps; never\n  `git add`/`commit`/`push` on the owner's behalf.\n- **Guardrails and profiles (always-on):** the common guardrail and the project's language\n  profiles are **imported** (not just linked) so their rules load at session start; akmon is the\n  single owner — do not restate them here. One import per line below: `init` writes one per\n  language it detected; add any other (`@_aitna/.akmon/profiles/<name>.md`), and an environment\n  profile where some of the code runs in one, per the ARCHETYPES map.\n\n@_aitna/.akmon/guardrails/_common.md\n@_aitna/.akmon/profiles/js.md\n\n- **Domain profiles (opt-in by need):** none attached yet — link only those the project actually needs.\n- **Pipelines:** [pre-commit](https://github.com/akumidv/ai_akmon/blob/main/pipelines/pre-commit.md) (tests mandatory),\n  [review-flow](https://github.com/akumidv/ai_akmon/blob/main/pipelines/review-flow.md),\n  [design-flow](https://github.com/akumidv/ai_akmon/blob/main/pipelines/design-flow.md),\n  [code-flow](https://github.com/akumidv/ai_akmon/blob/main/pipelines/code-flow.md),\n  [tasks](https://github.com/akumidv/ai_akmon/blob/main/pipelines/tasks.md) (backlog format), and the learn loop\n  ([memory-distill](https://github.com/akumidv/ai_akmon/blob/main/pipelines/memory-distill.md) +\n  [learning](https://github.com/akumidv/ai_akmon/blob/main/pipelines/learning.md)).\n- **The method's words:** work is tracked in `_aitna/.ergon/`: an *ergon* is a piece of work (what a\n  user may call an epic, a kit or a work package); an *athlos* is a bounded unit of it (a job); a *step*\n  is one line of an athlos, checked off when done; to *park* an athlos is to stop it for another session\n  (a handoff, a checkpoint). A *task* is a backlog row an ergon serves; a user who says \"task\" may mean\n  an ergon or an athlos, so read which from the id. The format of a note or a plan line\n  and its place stay with the code.\n- **Memory:** read `_aitna/memory/` at session start — distilled project facts, indexed by\n  [`_aitna/memory/README.md`](_aitna/memory/README.md).\n- **Backlog:** [`_aitna/TASKS.md`](_aitna/TASKS.md) — one line per task, detail by reference;\n  finished entries move to `TASKS_ARCHIVE.md`.\n- **Secrets:** from `.env` (gitignored). Never in code, docs, tests, or commits.\n"
"_aitna/.akmon/profiles/js.md" = "# js (conformance stand-in)\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\nThe corpus pins akmon's behavior, not this document's prose: the standard tree's `profiles/js.md`\nis replaced by this stand-in in the corpus snapshot.\n"
