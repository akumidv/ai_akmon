# A recorded run and two counted sessions: status reports them and the days since.
id = "cli/learn-status-counted"
ecosystem = "shared"
kind = "cli"
covers = ["command:learn"]

[fixture]
attach = "native"
files = { "_aitna/local/learning.json" = "{\n  \"last_run\": \"2999-01-01T00:00:00Z\",\n  \"since\": null,\n  \"sessions\": [\n    \"a\",\n    \"b\"\n  ]\n}\n" }

[env]
HOME = "{{tmp}}"

[run]
argv = ["learn", "status"]

[expected]
exit = 0
stderr = ""
stdout = "last run: 2999-01-01T00:00:00Z\ncounting since: no session recorded yet\nsessions since the last run: 2\ndays since the last run (or since counting began): 0\nreminder at 10 sessions or 7 days (from <dev root>/.akmon.toml [learning])\nstate: _aitna/local/learning.json\n"
