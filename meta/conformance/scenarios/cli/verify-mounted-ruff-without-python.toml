# C129: a mounted Node repository still holding the ruff.toml an earlier `akmon init` wrote —
# byte for byte akmon's template — with package.json and no Python files: verify warns that
# ruff has nothing to lint here, and (C129) that its Python mount needs Python a Node repository
# lacks (attach.mount-ecosystem). A Python mount; the Node twin is cli/verify-node-ruff-without-python.
id = "cli/verify-mounted-ruff-without-python"
ecosystem = "python"
kind = "cli"
covers = ["command:verify", "code:check.ruff-without-python"]

[fixture]
attach = "mount"
# src/app.py is Python (C129: a Python source makes a Python repository)
remove = ["src"]
warmup = true

[fixture.files]
"package.json" = "{\n  \"name\": \"demo\",\n  \"private\": true\n}\n"
"ruff.toml" = "# ruff with akmon's Python rules; adjust them here with extend-select, extend-ignore and\n# per-file-ignores.\nextend = \"_aitna/akmon/profiles/ruff.toml\"\n"

[run]
argv = ["verify"]

[expected]
exit = 0
stderr = ""
