id = "tools/park-athlos-refused-no-athlos"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An athlos number the plan does not list is refused: the plan lists C186.1 only, so `athlos --number 2` names
# no athlos line. Exit 1, one `error:` line naming the ergon and the athlos id; no athlos folder is created.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "2", "--step", "write it", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: ergon C186-holders-units has no athlos C186.2\n"
file_absent = ["_aitna/.ergon/C186-holders-units/2"]
