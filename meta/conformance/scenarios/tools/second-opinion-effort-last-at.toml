id = "tools/second-opinion-effort-last-at"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# The id is split at its LAST `@` (D17 point 1): `acme/m@x@max` is the model `acme/m@x` at the effort `max`.
# The `pi` row declares no family, so the run is disclosed `priors=unknown`.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "qwen", "--session-model", "q", "--provider", "pi:acme/m@x@max", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "pi -p --no-session --tools read,grep,find,ls --no-extensions --no-mcp --model acme/m@x --thinking max You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .pi/second-opinion/design-align-1.md\nprovider=pi priors=unknown carrier=harness repo=worktree model=acme/m@x@max kind=pinned\nwarning: the priors of 'pi' are unknown, so this run is not counted as diverse and is filed as kind=pinned\nskipped claude: carrier absent\nskipped codex: carrier absent\nskipped qwen: self\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
