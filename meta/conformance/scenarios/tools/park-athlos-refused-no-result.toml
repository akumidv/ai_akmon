id = "tools/park-athlos-refused-no-result"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An athlos line with no `result` has no next action for its `ATHLOS.md`: the result is the athlos's next action
# when the file is first written. `athlos` refuses the line (exit 1, one `error:` line naming the athlos and
# the ergon) before it creates the athlos folder.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: ergon C186-holders-units: athlos C186.1 has no result\n"
file_absent = ["_aitna/.ergon/C186-holders-units/1"]
