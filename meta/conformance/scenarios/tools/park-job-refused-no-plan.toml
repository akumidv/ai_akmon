id = "tools/park-job-refused-no-plan"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A job is written only from a plan: a kit with a note and no `PLAN.md` has no jobs to write, so `job`
# refuses it (exit 1, one `error:` line naming the kit) before it creates the jobs folder or takes a lease.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PARK.md" = "---\nid: C186\nname: holders-jobs\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Write the lease\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n# C186-holders-jobs\n\n## Goal\n\nHolders and jobs\n\n## Next action\n\nWrite the lease\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: kit C186-holders-jobs has no PLAN.md, so it has no jobs\n"
file_absent = ["_aitna/.ergon/C186-holders-jobs/jobs"]
