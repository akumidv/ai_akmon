id = "tools/park-hold-refused-anonymous"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Two holders that name no harness and no session cannot be told apart, so neither is taken for the other: an
# anonymous `hold` of a unit an anonymous session holds is refused with the holder named. The lease is left as it was.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: \nsession: \nmachine: laptop\nworktree: \nwritten: 2099-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["hold", "C183", "--machine", "laptop"]

[expected]
exit = 1
stderr = "error: C183-park-helper is held by ? ? laptop; a stale lease is taken over only on the owner's word (--takeover)\n"
stdout = ""

[expected.files]
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: \nsession: \nmachine: laptop\nworktree: \nwritten: 2099-01-01T00:00:00Z\n---\n"
