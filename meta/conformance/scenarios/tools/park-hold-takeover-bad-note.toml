id = "tools/park-hold-takeover-bad-note"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The note is read before the lease is replaced: a note that does not parse stops the takeover, and the lease is left as it was.
# The replaced holder's paths were already named, so they come first in the output.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "not a note\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree: \nwritten: 2000-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["hold", "C183", "--harness", "claude", "--session-id", "s1", "--machine", "laptop", "--takeover"]

[expected]
exit = 1
stderr = "error: C183-park-helper/PARK.md: no header between two '---' lines at the top of the note\n"
stdout = "the uncommitted paths of claude s2 laptop could not be read\n"

[expected.files]
"_aitna/.ergon/C183-park-helper/PARK.md" = "not a note\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree: \nwritten: 2000-01-01T00:00:00Z\n---\n"
