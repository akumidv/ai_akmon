id = "tools/second-opinion-dry-run"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# --dry-run of an explicitly chosen provider (`--provider claude`, so no carrier needs to be on
# PATH) from a session that names itself (`--session-provider codex`, no recorded config): the
# tool prints the full command with the provider's strongest declared model, the target report
# path (`<gate>-1.md` under the provider's own `.claude/second-opinion/`: no --task, no earlier
# report — C114, C163; nothing is created) and the report-header line, disclosed `kind=pinned`.
# The non-dry-run success path shells out to the external CLI and is out of the hermetic corpus.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"

[run]
tool = "model_routing/second_opinion"
argv = [
  "--gate",
  "design-align",
  "--gate-pack",
  "docs/gate-pack.md",
  "--session-provider",
  "codex",
  "--provider",
  "claude",
  "--dry-run",
]

[expected]
exit = 0
stderr = ""
stdout = "claude -p --output-format text --model opus You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .claude/second-opinion/design-align-1.md\nprovider=claude priors=claude carrier=harness repo=worktree model=opus kind=pinned\nskipped claude: carrier absent\nskipped codex: self\nskipped qwen: carrier absent\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
