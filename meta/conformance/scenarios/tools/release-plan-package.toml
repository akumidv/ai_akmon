id = "tools/release-plan-package"
ecosystem = "shared"
kind = "tool"
covers = ["tool:release/release_check"]

# --plan prints the owner-run commit/tag/push command set for the package subject. The tool
# never runs git itself (D5): the plan is stdout only.

[run]
tool = "release/release_check"
argv = ["--subject", "package", "--plan", "v1.2.3"]

[expected]
exit = 0
stderr = ""
stdout = "# Owner-run release plan (D5 — prepared by the release role, executed by the owner).\n# Stage files EXPLICITLY — never `git add -A` — so untracked noise\n# (e.g. __pycache__/) is not swept into the release commit.\n\n\n# 1. Bump the version to 1.2.3 in the version literals — one release bump is every\n#    carrier at once, and the tag records the reviewed state rather than producing the number:\n#      the project's own version literal(s), per _aitna/agents/release/README.md\n# 2. Cut CHANGELOG.md's `## Unreleased` section to `## v1.2.3`.\n# 3. Re-run --check: the version <-> changelog cross-check must be green before the tag.\n\ngit add CHANGELOG.md            # + the project's version literal(s) and reviewed edits\ngit status                      # confirm: no __pycache__/ or stray files staged\n\ngit commit -m \"release v1.2.3\"\ngit tag v1.2.3              # the tag points at THIS commit, not a prior HEAD\ngit push origin main --tags\n\n# package also: build + publish per _aitna/agents/release/README.md (owner-run).\n\n# 4. After the push, reopen the cycle: set both literals to the next development\n#    version (`<next>.dev0`) and add a fresh `## Unreleased` heading. Until then the\n#    tree is a released 1.2.3 whose tag exists, which --check reports as a re-release.\n\n# This tool does not run any of the above. The owner executes them.\n"
