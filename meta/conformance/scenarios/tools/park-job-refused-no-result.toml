id = "tools/park-job-refused-no-result"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A job line with no `result` has no next action for its `JOB.md`: the result is the job's next action
# when the file is first written. `job` refuses the line (exit 1, one `error:` line naming the job and
# the kit) before it creates the jobs folder.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: kit C186-holders-jobs: job C186.1 has no result\n"
file_absent = ["_aitna/.ergon/C186-holders-jobs/jobs"]
