id = "tools/park-write-name-conflict"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A kit with this id already exists under another name: a second kit for the same id is refused
# (exit 1, the error names the existing kit and the new name). The existing kit stays as it is and
# the new kit folder is not created.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-old-name/PARK.md" = "---\nstate: parked\nid: C183\nname: old-name\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\nnext: Twin it in JS\nsessions:\npeers:\norigin:\nreadiness:\n---\n\n# C183-old-name\n\n## Goal\n\nBuild the park helper\n\n## Approved scope and open questions\n\n_none_\n\n## Owner answers received\n\n_none_\n\n## Checks run\n\n_none_\n\n## Unverified\n\n_none_\n\n## Active agents and background processes\n\n_none_\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-old-name/RESUME.md" = "# Resume C183-old-name\n\nThis work was set aside on the owner's word. The kit holds everything needed to continue; no earlier conversation is required.\n\n1. Read `_aitna/.ergon/C183-old-name/PARK.md`.\n2. Run `akmon tool park/park unpark C183`.\n3. Continue from the next action below.\n\n## Next action\n\nTwin it in JS\n\n## Open decisions\n\nNone recorded.\n\n## Before you start\n\nTreat the previous holder's agents and processes as unverified: re-read the park note, check the checkout against it, and act only on what you can observe.\n\nThe holder that wrote this note is retired, not resumed. Start work only after its stop is observed and its children are accounted for; otherwise report a blocker. Where no stop can be observed, say so instead of assuming one.\n\nForcibly ending the previous holder is out of scope here (N15).\n"
"_aitna/.local/TASKS.md" = "# TASKS — local index\n\n- C183 · Build the park helper · parked · architect · Build the park helper · [park](../.ergon/C183-old-name/PARK.md)\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper", "--next", "Twin it in JS"]

[expected]
exit = 1
stderr = "error: kit C183-old-name already carries id C183; keep its name or retire it before writing park-helper\n"
stdout = ""
file_absent = ["_aitna/.ergon/C183-park-helper"]
