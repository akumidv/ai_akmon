id = "tools/park-write-name-conflict"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An ergon with this id already exists under another name: a second ergon for the same id is refused
# (exit 1, the error names the existing ergon and the new name). The existing ergon stays as it is and
# the new ergon folder is not created.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-old-name/PARK.md" = "---\nid: C183\nname: old-name\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-old-name\n\n## Goal\n\nOld name\n\n## Next action\n\nTwin it in JS\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper", "--next", "Twin it in JS"]

[expected]
exit = 1
stderr = "error: ergon C183-old-name already carries id C183; keep its name or retire it before writing park-helper\n"
stdout = ""
file_absent = ["_aitna/.ergon/C183-park-helper", "_aitna/.local/TASKS.md"]
