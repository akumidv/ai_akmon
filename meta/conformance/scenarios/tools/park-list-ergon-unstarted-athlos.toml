id = "tools/park-list-ergon-unstarted-athlos"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The ergon's state joins the athlos the plan lists, not only the folders that exist: C186.2 is listed by the
# plan and has no folder, so it has not started, and the ergon is not done although its one folder (C186.1)
# is done. The ergon has no lease and no note of its own, so it reads `not started`.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n- C186.2 · athlos file · tasks C186 · after C186.1 · result: the athlos file is written\n"
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n\ndone\n"

[run]
tool = "park/park"
argv = ["list"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-units | not started | - | - | 0 | - | -\n  C186.1 | 1 | done | C186 | - | - | 0d\n"
