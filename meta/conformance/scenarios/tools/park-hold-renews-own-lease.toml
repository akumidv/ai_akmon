id = "tools/park-hold-renews-own-lease"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The session that holds a lease renews it: the same harness, session and machine take the lease
# again, and the HOLDER file is rewritten with the time of this call and this worktree. No refusal.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["hold", "C183", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "C183-park-helper: claude s1 laptop {{root}}\n"

[expected.files]
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
