id = "tools/park-write-releases-lease"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Parking a unit by the session that holds its lease is allowed, and the park releases the lease: the
# note is written and the HOLDER file is gone. The holder is named by the same flags the lease was
# taken with.

[fixture]
attach = "none"
git = false

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper", "--next", "Twin it in JS", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C183-park-helper\n"
file_absent = ["_aitna/.ergon/C183-park-helper/HOLDER", "_aitna/.local/TASKS.md"]
