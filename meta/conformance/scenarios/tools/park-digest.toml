id = "tools/park-digest"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The digest of a note: the summary line (kit and state), the non-empty header facts, the goal
# (continuation lines indented), the next action, the open decisions and the owner answers. Under
# the default cap of 3000 characters nothing is cut and no overflow line is added.

