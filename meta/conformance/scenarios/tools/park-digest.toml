id = "tools/park-digest"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The digest of a note: the summary line (kit and its derived state: no lease, a note: parked), the
# non-empty header facts, the goal (continuation lines indented), the next action, the open decisions
# and the owner answers. The note's header carries no `state` and no `peers`; `written` is not printed.
# Under the default cap of 3000 characters nothing is cut and no overflow line is added.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow: C183\nbranch: _aitna/C183-park-helper\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness: ready for a successor\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\nso a successor can resume\n\n## Approved scope and open questions\n\n- D-C183-TWIN\n- D-C183-NAME\n\n## Owner answers received\n\n- owner: go\n- owner: keep the name\n\n## Checks run\n\n_none_\n\n## Unverified\n\n_none_\n\n## Active agents and background processes\n\n_none_\n\n## Next action\n\nTwin it in JS\n"

[run]
tool = "park/park"
argv = ["digest", "C183"]

[expected]
exit = 0
stderr = ""
stdout = "park C183-park-helper · parked\nplan: A59\nrow: C183\nbranch: _aitna/C183-park-helper\nreadiness: ready for a successor\nGoal: Build the park helper\n  so a successor can resume\nNext action: Twin it in JS\nOpen decisions:\n- D-C183-TWIN\n- D-C183-NAME\nOwner answers:\n- owner: go\n- owner: keep the name\n"
