id = "tools/park-job-write-new"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The first write of a job creates its folder `jobs/<n>-<slug of the job line's label>/`, its JOB.md
# (the header from the plan's job line: the kit, the plan, the job id, the job's tasks, its result as
# the next action, and the branch read from git, `main` in this repository) and its steps, and takes the
# lease of the job folder. The kit itself takes no lease. stdout is the job folder from the project root.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · job file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the job file is written\n- C186.3 · docs · tasks C186 · result: the docs say so\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "1", "--step", "create the file", "--step", "test a second session", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease\n"
file_absent = ["_aitna/.ergon/C186-holders-jobs/HOLDER"]

[expected.files]
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] create the file\n- [ ] test a second session\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
