id = "tools/park-hold-takeover-job"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A takeover of a job keeps the replaced holder in the job's own file `JOB.md`, among its sessions; the steps stay as they were.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree: \nwritten: 2000-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["hold", "C186", "--number", "1", "--harness", "claude", "--session-id", "s1", "--machine", "laptop", "--takeover"]

[expected]
exit = 0
stderr = ""
stdout = "the uncommitted paths of claude s2 laptop could not be read\n1-write-the-lease: claude s1 laptop {{root}}\n"

[expected.files]
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\n  - claude|s2|laptop\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
