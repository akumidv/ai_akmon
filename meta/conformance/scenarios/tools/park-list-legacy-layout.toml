id = "tools/park-list-legacy-layout"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An ergon written before the rename is read and translated, never rewritten (the layout's translation on read): its
# athlos live in `jobs/<n>-<label>/JOB.md` with a `job:` header key, and its plan lists them under `## Jobs`.
# `list` shows them as athlos with the same derived states as the new layout gives, each named by its old
# folder; nothing is written.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · athlos file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the job file is written\n- C186.3 · docs · tasks C186 · result: the docs say so\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n- [ ] test a second session\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"
"_aitna/.ergon/C186-holders-jobs/jobs/2-job-file/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.2\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the job file is written\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] write it\n"
"_aitna/.ergon/C186-holders-jobs/jobs/3-docs/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.3\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the docs say so\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] say so\n\ndone\n"

[run]
tool = "park/park"
argv = ["list", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-jobs | active | - | - | 0 | - | -\n  C186.1 | 1-write-the-lease | active | C186 | test a second session | - | 0d\n  C186.2 | 2-job-file | not started | C186 | write it | - | 0d\n  C186.3 | 3-docs | done | C186 | - | - | 0d\n"
