id = "tools/second-opinion-effort-default-model"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# `--default-model` drops the model pin and keeps the effort of the entry (D17 point 5): `shfx:small@low` lists as
# `(default)@low`, marked `pin=default`.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"
"_aitna/model-routing.json" = "{\n  \"providers\": {\n    \"shfx\": {\"argv\": [\"/bin/sh\", \"-m\", \"{model}\"], \"prompt\": \"stdin\", \"family\": \"gpt\", \"models\": [\"small\", \"big@high\"], \"efforts\": {\"flag\": \"--think {effort}\", \"levels\": [\"low\", \"high\"]}, \"report_dir\": \".shfx/second-opinion/\"}\n  },\n  \"second_opinion_policy\": {\"ladder\": [\"shfx:small@low\"]}\n}\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--list", "--default-model", "--session-provider", "claude", "--session-model", "opus"]

[expected]
exit = 0
stderr = ""
stdout = "session: provider=claude model=opus priors=claude\nrank 2: provider=shfx model=(default)@low priors=gpt repo=unknown pin=default\n"
