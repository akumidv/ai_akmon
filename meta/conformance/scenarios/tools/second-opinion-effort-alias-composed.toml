id = "tools/second-opinion-effort-alias-composed"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# An alias is resolved first (D16) and the effort follows the concrete id (D17): `codex:sol@high` sends
# `gpt-6.1-sol`, then codex's own config key `-c model_reasoning_effort="high"` as ONE argv element whose
# quotes are literal (a model's level is a config value for codex, M188).

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"
"_aitna/local/model-aliases.json" = "{\n  \"codex\": {\n    \"source\": \"~/.codex/models_cache.json (codex-models-cache)\",\n    \"client\": \"0.164.0\",\n    \"aliases\": {\n      \"luna\": \"gpt-6-luna\",\n      \"terra\": \"gpt-6.1-terra\",\n      \"sol\": \"gpt-6.1-sol\"\n    }\n  }\n}\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "qwen", "--session-model", "q", "--provider", "codex:sol@high", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "codex exec --model gpt-6.1-sol -c model_reasoning_effort=\"high\" You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .codex/second-opinion/design-align-1.md\nprovider=codex priors=gpt carrier=harness repo=worktree model=sol→gpt-6.1-sol@high kind=pinned\nskipped claude: carrier absent\nskipped codex: carrier absent\nskipped qwen: self\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
