id = "tools/second-opinion-alias-concrete-pin"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# A pin that is already a concrete id (not one of the row's aliases) passes through unchanged, with no
# alias file needed: `--provider codex:gpt-6.1-sol` keeps working.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "claude", "--session-model", "opus", "--provider", "codex:gpt-6.1-sol", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "codex exec --model gpt-6.1-sol You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .codex/second-opinion/design-align-1.md\nprovider=codex priors=gpt carrier=harness repo=worktree model=gpt-6.1-sol kind=pinned\nskipped claude: self\nskipped codex: carrier absent\nskipped qwen: carrier absent\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
