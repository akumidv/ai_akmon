id = "tools/second-opinion-unpinnable"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# The owner pins a concrete model (`codex:gpt-6.1-sol`, which passes the alias resolution of ADR 0024/D16
# unchanged), but the project overlay blanked the provider's model_flag (C97): an unpinned run would
# not be model-diverse, so the tool fails closed with the error line on stderr and exit 2 before
# shelling out.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"
"_aitna/model-routing.json" = """
{"providers": {"codex": {"model_flag": null}}}
"""
".claude/model-routing.local.json" = """
{"vendor": "anthropic", "orchestrator": "opus", "second_opinion": true}
"""

[run]
tool = "model_routing/second_opinion"
argv = [
  "--gate",
  "design-align",
  "--gate-pack",
  "docs/gate-pack.md",
  "--provider",
  "codex:gpt-6.1-sol",
]

[expected]
exit = 2
stderr = "second-opinion: second opinion needs model 'gpt-6.1-sol' on codex, but the providers table declares no model_flag for that provider — an unpinned run would not be model-diverse. Declare the measured flag in the provider's row, or route this gate another way.\n"
stdout = ""
