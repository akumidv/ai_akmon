id = "tools/second-opinion-effort-model"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# `carrier:model@effort` (ADR 0024 D17): the effort flag of the row (`claude --effort {effort}`, measured in M188)
# follows the model flag, and the header shows the effort after the model.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "qwen", "--session-model", "q", "--provider", "claude:opus@high", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "claude -p --output-format text --model opus --effort high You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .claude/second-opinion/design-align-1.md\nprovider=claude priors=claude carrier=harness repo=worktree model=opus@high kind=pinned\nskipped claude: carrier absent\nskipped codex: carrier absent\nskipped qwen: self\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
