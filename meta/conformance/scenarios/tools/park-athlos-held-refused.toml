id = "tools/park-athlos-held-refused"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A second session writing an athlos that a live session holds is refused, with the holder named: the athlos
# file and the holder's lease are left as they were.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "1", "--step", "test a second session", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stderr = "error: 1 is held by claude s2 laptop; a stale lease is taken over only on the owner's word (--takeover)\n"
stdout = ""

[expected.files]
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"
