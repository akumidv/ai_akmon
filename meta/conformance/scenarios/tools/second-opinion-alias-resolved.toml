id = "tools/second-opinion-alias-resolved"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# An alias pin of the shipped codex row (`aliases: true`) is replaced by the concrete id the local, generated
# `<dev root>/.local/model-aliases.json` maps it to (ADR 0024 D16): the command carries `gpt-6.1-sol` and the
# header records `sol→gpt-6.1-sol`, the concrete model run.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"
"_aitna/.local/model-aliases.json" = "{\n  \"codex\": {\n    \"source\": \"~/.codex/models_cache.json (codex-models-cache)\",\n    \"client\": \"0.164.0\",\n    \"aliases\": {\n      \"luna\": \"gpt-6-luna\",\n      \"terra\": \"gpt-6.1-terra\",\n      \"sol\": \"gpt-6.1-sol\"\n    }\n  }\n}\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "claude", "--session-model", "opus", "--provider", "codex", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "codex exec --model gpt-6.1-sol You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .codex/second-opinion/design-align-1.md\nprovider=codex priors=gpt carrier=harness repo=worktree model=sol→gpt-6.1-sol kind=pinned\nskipped claude: self\nskipped codex: carrier absent\nskipped qwen: carrier absent\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
