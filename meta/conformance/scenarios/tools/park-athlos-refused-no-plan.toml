id = "tools/park-athlos-refused-no-plan"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An athlos is written only from a plan: an ergon with a note and no `PLAN.md` has no athlos to write, so `athlos`
# refuses it (exit 1, one `error:` line naming the ergon) before it creates the athlos folder or takes a lease.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PARK.md" = "---\nid: C186\nname: holders-units\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Write the lease\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n# C186-holders-units\n\n## Goal\n\nHolders and units\n\n## Next action\n\nWrite the lease\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: ergon C186-holders-units has no PLAN.md, so it has no athlos\n"
file_absent = ["_aitna/.ergon/C186-holders-units/1"]
