id = "tools/park-unpark-never-parked"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A kit folder with no PARK.md and no RESUME.md was never parked: `unpark` refuses it at the resume
# prompt (exit 1, the error names the kit) and leaves no lease behind, so the folder holds only what
# was there before.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/NOTES.md" = "scratch\n"

[run]
tool = "park/park"
argv = ["unpark", "C183", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stderr = "error: kit C183-park-helper has no RESUME.md; write it again to regenerate it\n"
stdout = ""
file_absent = ["_aitna/.ergon/C183-park-helper/PARK.md", "_aitna/.ergon/C183-park-helper/HOLDER"]
