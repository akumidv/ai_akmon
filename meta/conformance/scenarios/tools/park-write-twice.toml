id = "tools/park-write-twice"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Parking a kit that was resumed: the kit holds a PARK.md at state `resumed` and its row is
# `active` with the helper's link. A second `write` regenerates the note and RESUME.md, sets the
# state back to `parked`, flips the row to `parked` and does not add a second link.

[fixture]
attach = "none"

