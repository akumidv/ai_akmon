id = "tools/park-write-twice"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Parking an ergon that was parked before: the ergon holds a PARK.md and a RESUME.md. A second `write`
# regenerates both from the new goal and next action; the note has no state to set (the derived state
# is read from the folder), and it does not add a second row or a second session.

[fixture]
attach = "none"
git = false

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow: C183\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/RESUME.md" = "# Resume C183-park-helper\n\nThis work was set aside on the owner's word.\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper, second pass", "--next", "Check the JS twin"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C183-park-helper\n"
file_absent = ["_aitna/.local/TASKS.md"]

[expected.files]
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan:\nathlos:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Check the JS twin\nsessions:\norigin:\nreadiness:\nwritten: {{ts}}\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper, second pass\n\n## Approved scope and open questions\n\n_none_\n\n## Owner answers received\n\n_none_\n\n## Checks run\n\n_none_\n\n## Unverified\n\n_none_\n\n## Active agents and background processes\n\n_none_\n\n## Next action\n\nCheck the JS twin\n"
"_aitna/.ergon/C183-park-helper/RESUME.md" = "# Resume C183-park-helper\n\nThis work was set aside on the owner's word. The ergon holds everything needed to continue; no earlier conversation is required.\n\n1. Read `_aitna/.ergon/C183-park-helper/PARK.md`.\n2. Run `{{tool park/park}} unpark C183`.\n3. Continue from the next action below.\n\n## Next action\n\nCheck the JS twin\n\n## Open decisions\n\nNone recorded.\n\n## Before you start\n\nTreat the previous holder's agents and processes as unverified: re-read the park note, check the checkout against it, and act only on what you can observe.\n\nThe holder that wrote this note is retired, not resumed. Start work only after its stop is observed and its children are accounted for; otherwise report a blocker. Where no stop can be observed, say so instead of assuming one.\n\nForcibly ending the previous holder is out of scope here (N15).\n"
