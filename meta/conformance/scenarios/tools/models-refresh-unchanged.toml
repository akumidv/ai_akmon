id = "tools/models-refresh-unchanged"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/models"]

# A second refresh over an unchanged catalog is idempotent: the file is already what a refresh would write, so
# nothing is rewritten and the tool says so.

[fixture]
tmp_files = { ".codex/models_cache.json" = "{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6.1-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-6.1-terra\",\"visibility\":\"list\",\"priority\":1},{\"slug\":\"gpt-6-astra\",\"visibility\":\"list\",\"priority\":3},{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":4},{\"slug\":\"gpt-reserve\",\"visibility\":\"hide\",\"priority\":4},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":5},{\"slug\":\"gpt-5.6-sol\",\"visibility\":\"list\",\"priority\":6},{\"slug\":\"gpt-5.6-terra\",\"visibility\":\"list\",\"priority\":7},{\"slug\":\"gpt-5.6-luna\",\"visibility\":\"list\",\"priority\":8},{\"slug\":\"codex-auto-review\",\"visibility\":\"hide\",\"priority\":43}]}" }

[fixture.files]
"_aitna/local/model-aliases.json" = "{\n  \"codex\": {\n    \"source\": \"~/.codex/models_cache.json (codex-models-cache)\",\n    \"client\": \"0.164.0\",\n    \"aliases\": {\n      \"luna\": \"gpt-6-luna\",\n      \"terra\": \"gpt-6.1-terra\",\n      \"sol\": \"gpt-6.1-sol\"\n    }\n  }\n}\n"

[env]
HOME = "{{tmp}}"

[run]
tool = "model_routing/models"
argv = ["--refresh"]

[expected]
exit = 0
stderr = ""
stdout = "catalog codex: source=~/.codex/models_cache.json (codex-models-cache) client=0.164.0\n  luna → gpt-6-luna\n  terra → gpt-6.1-terra\n  sol → gpt-6.1-sol\n_aitna/local/model-aliases.json unchanged\n"

[expected.files]
"_aitna/local/model-aliases.json" = "{\n  \"codex\": {\n    \"source\": \"~/.codex/models_cache.json (codex-models-cache)\",\n    \"client\": \"0.164.0\",\n    \"aliases\": {\n      \"luna\": \"gpt-6-luna\",\n      \"terra\": \"gpt-6.1-terra\",\n      \"sol\": \"gpt-6.1-sol\"\n    }\n  }\n}\n"
