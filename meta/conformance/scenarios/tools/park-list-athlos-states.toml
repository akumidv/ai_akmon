id = "tools/park-list-athlos-states"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Each athlos of an ergon is listed under it with its own derived state: `active` (a live lease on
# the athlos folder), `not started` (an athlos file, no lease, no note) and `done` (its ATHLOS.md carries the
# done marker, whoever held it). The ergon's state is joined from its athlos (ADR 0028 D08, D09): one athlos
# is held, so the ergon is `active` although it has no lease and no note of its own. An athlos's next action
# is its first step that is not done.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · athlos file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the athlos file is written\n- C186.3 · docs · tasks C186 · result: the docs say so\n"
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n- [ ] test a second session\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"
"_aitna/.ergon/C186-holders-units/2/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.2\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the athlos file is written\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] write it\n"
"_aitna/.ergon/C186-holders-units/3/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.3\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the docs say so\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] say so\n\ndone\n"

[run]
tool = "park/park"
argv = ["list", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-units | active | - | - | 0 | - | -\n  C186.1 | 1 | active | C186 | test a second session | - | 0d\n  C186.2 | 2 | not started | C186 | write it | - | 0d\n  C186.3 | 3 | done | C186 | - | - | 0d\n"
