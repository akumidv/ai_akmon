id = "tools/park-hold-takeover-athlos"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A takeover of an athlos keeps the replaced holder in the athlos's own file `ATHLOS.md`, among its sessions; the steps stay as they were.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s2\nmachine: laptop\nworktree: \nwritten: 2000-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["hold", "C186", "--number", "1", "--harness", "claude", "--session-id", "s1", "--machine", "laptop", "--takeover"]

[expected]
exit = 0
stderr = ""
stdout = "the uncommitted paths of claude s2 laptop could not be read\n1: claude s1 laptop {{root}}\n"

[expected.files]
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\n  - claude|s2|laptop\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
