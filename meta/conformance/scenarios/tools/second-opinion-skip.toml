id = "tools/second-opinion-skip"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# Nothing can run: the session is the bound vendor's own carrier, every carrier is hidden from
# PATH (the corpus runner hides them all), so the chain is empty and the disclosed last resort has
# no carrier to run on. The tool prints the skip notice with its reason and the skip ledger
# (every provider passed over, and why) and exits 0 without running any external CLI. The gate is
# refused, never downgraded to a same-model reviewer.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"
".claude/model-routing.local.json" = """
{"vendor": "anthropic", "orchestrator": "opus", "second_opinion": true}
"""

[run]
tool = "model_routing/second_opinion"
argv = [
  "--gate",
  "design-align",
  "--gate-pack",
  "docs/gate-pack.md",
]

[expected]
exit = 0
stderr = ""
stdout = "second-opinion: skipped at gate 'design-align' — no provider could be run for rank 2.\n  why: the session's own provider 'claude' is not on PATH, so the last resort has nothing to run.\n  not downgraded: a reviewer on the author's own weights repeats the author's systematic errors and agrees confidently, which is indistinguishable from a review.\n  what you can still run by hand: hand this gate pack to a subagent on this same model in a fresh context (no session history, no prior reasoning).\n  its limits, to record with any result: it removes anchoring on the author's own output; it does not remove shared model priors. It is a self-check, not a second opinion, and must not be filed as one.\nskipped claude: self\nskipped codex: carrier absent\nskipped qwen: carrier absent\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
