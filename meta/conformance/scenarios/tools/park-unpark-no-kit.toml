id = "tools/park-unpark-no-kit"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An id no kit carries is refused: exit 1, the error line names the id, the kit folder it looked
# in and the kits that exist. No lease is taken on the kit that does exist.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"

[run]
tool = "park/park"
argv = ["unpark", "C999", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stderr = "error: no kit with id C999 under _aitna/.ergon; kits: C183-park-helper\n"
stdout = ""
file_absent = ["_aitna/.ergon/C183-park-helper/HOLDER"]
