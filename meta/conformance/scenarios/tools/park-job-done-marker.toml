id = "tools/park-job-done-marker"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `job --done` writes the done marker into the job's own file, after its steps. The marker is what
# makes the job `done` in `park list`; it is written once and kept by a later write.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n- [x] test a second session\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "1", "--done", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease\n"

[expected.files]
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n- [x] test a second session\n\ndone\n"
