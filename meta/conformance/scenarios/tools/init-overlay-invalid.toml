id = "tools/init-overlay-invalid"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/init"]

# A developer-local routing overlay whose top level is not a JSON object is refused by name
# (OverlayError): one `error:` line on stderr quoting the file, exit 2, and nothing is written.

[fixture.files]
"_aitna/.local/model-routing.json" = "[1, 2]"

[run]
tool = "model_routing/init"
argv = []

[expected]
exit = 2
stderr = "error: the routing overlay _aitna/.local/model-routing.json is not a valid JSON object; repair or delete it (it is hand-owned, so akmon never rewrites it)\n"
stdout = ""
file_absent = [".claude/model-routing.local.json"]
