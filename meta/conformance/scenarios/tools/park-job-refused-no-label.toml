id = "tools/park-job-refused-no-label"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A job line with no label names no folder: the folder is `<n>-<slug of the label>`, and an empty label
# has no slug. `job` refuses the line (exit 1, one `error:` line naming the job id) before it creates
# anything, so the jobs folder is not made.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 ·  · tasks C186 · result: the lease is created exclusively\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: job C186.1 has no label, so its folder has no name\n"
file_absent = ["_aitna/.ergon/C186-holders-jobs/jobs"]
