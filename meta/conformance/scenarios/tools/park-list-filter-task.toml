id = "tools/park-list-filter-task"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `--task C186` keeps the ergons that carry the task in any of three places: the plan header's `tasks`
# (C186-by-plan), an athlos line of the plan (C187-by-line) or an athlos's own file (C188-by-file, whose athlos
# line is listed under it). C190 carries another task and is left out.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-by-plan/PLAN.md" = "---\nid: C186\nname: by-plan\ntitle: Ergon with the task in its plan header\ntasks: C186\n---\n\n# C186-by-plan\n\n## Athlos\n\n"
"_aitna/.ergon/C187-by-line/PLAN.md" = "---\nid: C187\nname: by-line\ntitle: Ergon with the task on an athlos line\n---\n\n# C187-by-line\n\n## Athlos\n\n- C187.1 · the line · tasks C186\n"
"_aitna/.ergon/C188-by-file/PLAN.md" = "---\nid: C188\nname: by-file\ntitle: Ergon with the task in an athlos file\n---\n\n# C188-by-file\n\n## Athlos\n\n- C188.1 · the file\n"
"_aitna/.ergon/C188-by-file/1/ATHLOS.md" = "---\nid: C188\nname: by-file\nplan:\nathlos: C188.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: Write the file\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n_none_\n"
"_aitna/.ergon/C190-other/PLAN.md" = "---\nid: C190\nname: other\ntitle: Another task\ntasks: C191\n---\n\n# C190-other\n\n## Athlos\n\n"

[run]
tool = "park/park"
argv = ["list", "--task", "C186"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | by-plan | not started | - | - | 0 | - | -\nC187 | by-line | not started | - | - | 0 | - | -\nC188 | by-file | not started | - | - | 0 | - | -\n  C188.1 | 1 | not started | C186 | - | - | 0d\n"
