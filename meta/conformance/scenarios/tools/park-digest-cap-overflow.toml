id = "tools/park-digest-cap-overflow"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `--cap 68` is exactly the size, in characters, of the first lines up to and including the goal
# line, and that goal line carries an astral character (🚀): characters are counted as code points,
# not UTF-16 units, so the line is kept and the cut falls on the whole line after it. The summary's
# state is derived (no lease, a note: parked). The overflow line counts the lines left out and names
# the note's path from the project root; it is not counted in the cap.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nPark 🚀 résumé helper\n\n## Approved scope and open questions\n\n_none_\n\n## Owner answers received\n\n_none_\n\n## Checks run\n\n_none_\n\n## Unverified\n\n_none_\n\n## Active agents and background processes\n\n_none_\n\n## Next action\n\nTwin it in JS\n"

[run]
tool = "park/park"
argv = ["digest", "C183", "--cap", "68"]

[expected]
exit = 0
stderr = ""
stdout = "park C183-park-helper · parked\nplan: A59\nGoal: Park 🚀 résumé helper\n… 3 more lines in _aitna/.ergon/C183-park-helper/PARK.md\n"
