id = "tools/park-list-ergon-parked-by-athlos"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An ergon's state is joined from its athlos (ADR 0028 D08, D09): one athlos is done and the other is free with
# a `PARK.md` of its own (parked), so the ergon is `parked` although the ergon folder has no note and no
# lease. Done is the state of an ergon only when every athlos is done.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 \u00b7 write the lease \u00b7 tasks C186 \u00b7 result: the lease is created exclusively\n- C186.2 \u00b7 athlos file \u00b7 tasks C186 \u00b7 result: the athlos file is written\n"
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: step\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] step\n\ndone\n"
"_aitna/.ergon/C186-holders-units/2/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.2\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: step\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] step\n"
"_aitna/.ergon/C186-holders-units/2/PARK.md" = "---\nid: C186\nname: holders-units\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: n\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C186-holders-units\n\n## Goal\n\nGoal\n\n## Next action\n\nn\n"

[run]
tool = "park/park"
argv = ["list", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-units | parked | - | - | 0 | - | -\n  C186.1 | 1 | done | C186 | - | - | 0d\n  C186.2 | 2 | parked | C186 | step | - | 0d\n"
