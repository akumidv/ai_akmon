id = "tools/park-unpark"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Resuming a parked ergon takes its lease (the holder named by the flags, here this session on this
# machine) and prints RESUME.md, a blank line, then the capped digest. The digest's state is derived
# after the lease is taken: `active`. The note is not rewritten (no `state` to change any more); the
# lease file HOLDER is the only file the resume writes. RESUME.md itself is unchanged.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch: _aitna/C183-park-helper\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Approved scope and open questions\n\n- D-C183-TWIN\n\n## Owner answers received\n\n- owner: go\n\n## Checks run\n\n_none_\n\n## Unverified\n\n_none_\n\n## Active agents and background processes\n\n_none_\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/RESUME.md" = "# Resume C183-park-helper\n\nThis work was set aside on the owner's word. The ergon holds everything needed to continue; no earlier conversation is required.\n\n1. Read `_aitna/.ergon/C183-park-helper/PARK.md`.\n2. Run `akmon tool park/park unpark C183`.\n3. Continue from the next action below.\n\n## Next action\n\nTwin it in JS\n\n## Open decisions\n\n- D-C183-TWIN\n\n## Before you start\n\nTreat the previous holder's agents and processes as unverified: re-read the park note, check the checkout against it, and act only on what you can observe.\n\nThe holder that wrote this note is retired, not resumed. Start work only after its stop is observed and its children are accounted for; otherwise report a blocker. Where no stop can be observed, say so instead of assuming one.\n\nForcibly ending the previous holder is out of scope here (N15).\n"

[run]
tool = "park/park"
argv = ["unpark", "C183", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "# Resume C183-park-helper\n\nThis work was set aside on the owner's word. The ergon holds everything needed to continue; no earlier conversation is required.\n\n1. Read `_aitna/.ergon/C183-park-helper/PARK.md`.\n2. Run `{{tool park/park}} unpark C183`.\n3. Continue from the next action below.\n\n## Next action\n\nTwin it in JS\n\n## Open decisions\n\n- D-C183-TWIN\n\n## Before you start\n\nTreat the previous holder's agents and processes as unverified: re-read the park note, check the checkout against it, and act only on what you can observe.\n\nThe holder that wrote this note is retired, not resumed. Start work only after its stop is observed and its children are accounted for; otherwise report a blocker. Where no stop can be observed, say so instead of assuming one.\n\nForcibly ending the previous holder is out of scope here (N15).\n\npark C183-park-helper · active\nplan: A59\nbranch: _aitna/C183-park-helper\nGoal: Build the park helper\nNext action: Twin it in JS\nOpen decisions:\n- D-C183-TWIN\nOwner answers:\n- owner: go\n"
file_absent = ["_aitna/.local/TASKS.md"]

[expected.files]
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
