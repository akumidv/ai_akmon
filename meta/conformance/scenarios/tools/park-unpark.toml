id = "tools/park-unpark"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# Resuming a parked kit prints RESUME.md, a blank line, then the capped digest; the note's header
# state becomes `resumed` (the body is kept byte for byte) and the local index row goes back to
# `active`. RESUME.md itself is unchanged.

