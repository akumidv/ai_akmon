id = "tools/park-list-kit-done"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A kit is `done` when every one of its jobs is done (each JOB.md carries the done marker): the kit
# line says so, and each job line says so too. The kit has no note of its own here.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n- C186.2 · job file · tasks C186 · result: the job file is written\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] create the file\n- [x] test a second session\n\ndone\n"
"_aitna/.ergon/C186-holders-jobs/jobs/2-job-file/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.2\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the job file is written\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] write it\n\ndone\n"

[run]
tool = "park/park"
argv = ["list"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-jobs | done | - | - | 0 | - | -\n  C186.1 | 1-write-the-lease | done | C186 | - | - | 0d\n  C186.2 | 2-job-file | done | C186 | - | - | 0d\n"
