id = "tools/park-export-leaves-leases-out"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `export` writes the ergon's files to one bundle file, in path order, each under a `--- file:` line and
# closed by `--- end`. The leases are left out: the HOLDER file of the ergon is not in the bundle, whoever
# holds it. The bundle is plain text.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C183-park-helper/PARK.md" = "---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n"
"_aitna/.ergon/C183-park-helper/RESUME.md" = "# Resume C183-park-helper\n\nShort resume.\n"
"_aitna/.ergon/C183-park-helper/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree:\nwritten: 2099-01-01T00:00:00Z\n---\n"

[run]
tool = "park/park"
argv = ["export", "C183", "--out", "bundle.md"]

[expected]
exit = 0
stderr = ""
stdout = "bundle.md\n"

[expected.files]
"bundle.md" = "# akmon ergon bundle: C183-park-helper\n\n--- file: PARK.md\n---\nid: C183\nname: park-helper\nplan: A59\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: Twin it in JS\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C183-park-helper\n\n## Goal\n\nBuild the park helper\n\n## Next action\n\nTwin it in JS\n--- end\n\n--- file: RESUME.md\n# Resume C183-park-helper\n\nShort resume.\n--- end\n"
