id = "tools/second-opinion-default-token"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/second_opinion"]

# The reserved token `default` in `carrier:default` is the carrier's own configured model (ADR 0024 D16): no
# pin flag in the command, no alias resolution, no catalog or alias file needed, and the header says
# `model=(default)`.

[fixture.files]
"docs/gate-pack.md" = "Gate material: findings A and B, against yardstick Y.\n"

[run]
tool = "model_routing/second_opinion"
argv = ["--gate", "design-align", "--gate-pack", "docs/gate-pack.md", "--session-provider", "claude", "--session-model", "opus", "--provider", "codex:default", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "codex exec You are an independent second-opinion reviewer for a akmon verify gate.\n\nGate: design-align\n\nRules:\n- Review only; do not edit files, run commands, commit, push, or approve on behalf of the owner.\n- Return: verdict, key disagreements or risks, missing verification, and concrete file/line references when available.\n- Treat the result as advisory input to owner verification, not a sign-off.\n\nMaterial to review:\nGate material: findings A and B, against yardstick Y.\n\n\nreport: .codex/second-opinion/design-align-1.md\nprovider=codex priors=gpt carrier=harness repo=worktree model=(default) kind=pinned\nskipped claude: self\nskipped codex: carrier absent\nskipped qwen: carrier absent\nskipped opencode: carrier absent\nskipped pi: carrier absent\n"
