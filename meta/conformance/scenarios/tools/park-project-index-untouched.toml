id = "tools/park-project-index-untouched"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `write` keeps its row in the local index only: a project index (`_aitna/TASKS.md`) that carries a
# row for the same id is left byte for byte as it was, while the local index gains the parked row.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/TASKS.md" = "# Tasks\n\n- C183 · Park helper · active · engineer · project row\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper", "--next", "Twin it in JS"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C183-park-helper\n"
[expected.files]
"_aitna/TASKS.md" = "# Tasks\n\n- C183 · Park helper · active · engineer · project row\n"
"_aitna/.local/TASKS.md" = "# TASKS — local index\n\n- C183 · Build the park helper · parked · architect · Build the park helper · [park](../.ergon/C183-park-helper/PARK.md)\n"
