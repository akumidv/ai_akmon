id = "tools/park-project-index-untouched"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# `write` writes the kit and nothing else: no local index is written (ADR 0028 D12 retired it, so
# `_aitna/.local/TASKS.md` never appears), and a project index (`_aitna/TASKS.md`) that carries a row
# for the same id is left byte for byte as it was. `park list` is the index.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/TASKS.md" = "# Tasks\n\n- C183 · Park helper · active · engineer · project row\n"

[run]
tool = "park/park"
argv = ["write", "C183", "--name", "park-helper", "--goal", "Build the park helper", "--next", "Twin it in JS"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C183-park-helper\n"
file_absent = ["_aitna/.local/TASKS.md"]

[expected.files]
"_aitna/TASKS.md" = "# Tasks\n\n- C183 · Park helper · active · engineer · project row\n"
