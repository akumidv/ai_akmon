id = "tools/park-athlos-write-new"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# The first write of an athlos creates its folder `<n>/`, the number of its id, and its ATHLOS.md
# (the header from the plan's athlos line: the ergon, the plan, the athlos id, the athlos's tasks, its result as
# the next action, and the branch read from git, `main` in this repository) and its steps, and takes the
# lease of the athlos folder. The ergon itself takes no lease. stdout is the athlos folder from the project root.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · athlos file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the athlos file is written\n- C186.3 · docs · tasks C186 · result: the docs say so\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "1", "--step", "create the file", "--step", "test a second session", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "_aitna/.ergon/C186-holders-units/1\n"
file_absent = ["_aitna/.ergon/C186-holders-units/HOLDER"]

[expected.files]
"_aitna/.ergon/C186-holders-units/1/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.1\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the lease is created exclusively\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] create the file\n- [ ] test a second session\n"
"_aitna/.ergon/C186-holders-units/1/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
