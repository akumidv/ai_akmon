id = "tools/park-athlos-refused-no-label"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An athlos line with no label is not a unit: the label stays on the plan line and names the athlos in
# every listing, so an empty one has nothing to say. `athlos` refuses the line (exit 1, one `error:` line naming the athlos id) before it creates
# anything, so the athlos folder is not made.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 ·  · tasks C186 · result: the lease is created exclusively\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "1", "--step", "create the file", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: athlos C186.1 has no label on its plan line\n"
file_absent = ["_aitna/.ergon/C186-holders-units/1"]
