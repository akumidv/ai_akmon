id = "tools/park-list-kit-parked-by-job"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A kit's state is joined from its jobs (ADR 0028 D08, D09): one job is done and the other is free with
# a `PARK.md` of its own (parked), so the kit is `parked` although the kit folder has no note and no
# lease. Done is the state of a kit only when every job is done.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 \u00b7 write the lease \u00b7 tasks C186 \u00b7 result: the lease is created exclusively\n- C186.2 \u00b7 job file \u00b7 tasks C186 \u00b7 result: the job file is written\n"
"_aitna/.ergon/C186-holders-jobs/jobs/1-write-the-lease/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.1\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: step\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [x] step\n\ndone\n"
"_aitna/.ergon/C186-holders-jobs/jobs/2-job-file/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.2\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: step\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] step\n"
"_aitna/.ergon/C186-holders-jobs/jobs/2-job-file/PARK.md" = "---\nid: C186\nname: holders-jobs\nplan:\nrow:\nbranch:\nrevisions:\nowned_paths:\ntasks:\nnext: n\nsessions:\norigin:\nreadiness:\nwritten: 2000-01-01T00:00:00Z\n---\n\n# C186-holders-jobs\n\n## Goal\n\nGoal\n\n## Next action\n\nn\n"

[run]
tool = "park/park"
argv = ["list", "--machine", "laptop"]

[expected]
exit = 0
stderr = ""
stdout = "C186 | holders-jobs | parked | - | - | 0 | - | -\n  C186.1 | 1-write-the-lease | done | C186 | - | - | 0d\n  C186.2 | 2-job-file | parked | C186 | step | - | 0d\n"
