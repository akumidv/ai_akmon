id = "tools/park-athlos-shared-path-warning"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# An athlos write names the plan's shared paths on stderr; stdout keeps the athlos folder alone. C186.2 waits
# for C186.1, so the pair shares no warning (they cannot run at once), and C186.1 with C186.3, and
# C186.2 with C186.3, may run at once and forecast the same path. Each warning names the two athlos and
# the path, in the plan's order. The forecast is advice: nothing else is written for it.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-units/PLAN.md" = "---\nid: C186\nname: holders-units\ntitle: Holders and units\ntasks: C186\n---\n\n# C186-holders-units\n\n## Athlos\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · athlos file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the athlos file is written\n- C186.3 · docs · tasks C186 · paths tools/park/park.py · result: the docs say so\n"

[run]
tool = "park/park"
argv = ["athlos", "C186", "--number", "3", "--step", "say so", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stdout = "_aitna/.ergon/C186-holders-units/3\n"
stderr = "warning: athlos C186.1 C186.3 may run at once and share path tools/park/park.py\nwarning: athlos C186.2 C186.3 may run at once and share path tools/park/park.py\n"

[expected.files]
"_aitna/.ergon/C186-holders-units/3/ATHLOS.md" = "---\nid: C186\nname: holders-units\nplan: C186\nathlos: C186.3\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the docs say so\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] say so\n"
"_aitna/.ergon/C186-holders-units/3/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
