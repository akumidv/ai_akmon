id = "tools/park-job-refused-no-job"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A job number the plan does not list is refused: the plan lists C186.1 only, so `job --number 2` names
# no job line. Exit 1, one `error:` line naming the kit and the job id; no jobs folder is created.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · result: the lease is created exclusively\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "2", "--step", "write it", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 1
stdout = ""
stderr = "error: kit C186-holders-jobs has no job C186.2\n"
file_absent = ["_aitna/.ergon/C186-holders-jobs/jobs"]
