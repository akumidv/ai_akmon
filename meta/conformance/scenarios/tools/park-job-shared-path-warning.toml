id = "tools/park-job-shared-path-warning"
ecosystem = "shared"
kind = "tool"
covers = ["tool:park/park"]

# A job write names the plan's shared paths on stderr; stdout keeps the job folder alone. C186.2 waits
# for C186.1, so the pair shares no warning (they cannot run at once), and C186.1 with C186.3, and
# C186.2 with C186.3, may run at once and forecast the same path. Each warning names the two jobs and
# the path, in the plan's order. The forecast is advice: nothing else is written for it.

[fixture]
attach = "none"

[fixture.files]
"_aitna/.akmon.toml" = ""
"_aitna/.ergon/C186-holders-jobs/PLAN.md" = "---\nid: C186\nname: holders-jobs\ntitle: Holders and jobs\ntasks: C186\n---\n\n# C186-holders-jobs\n\n## Jobs\n\n- C186.1 · write the lease · tasks C186 · paths tools/park/park.py · result: the lease is created exclusively\n- C186.2 · job file · tasks C186 · after C186.1 · paths tools/park/park.py · result: the job file is written\n- C186.3 · docs · tasks C186 · paths tools/park/park.py · result: the docs say so\n"

[run]
tool = "park/park"
argv = ["job", "C186", "--number", "3", "--step", "say so", "--harness", "claude", "--session-id", "s1", "--machine", "laptop"]

[expected]
exit = 0
stdout = "_aitna/.ergon/C186-holders-jobs/jobs/3-docs\n"
stderr = "warning: jobs C186.1 C186.3 may run at once and share path tools/park/park.py\nwarning: jobs C186.2 C186.3 may run at once and share path tools/park/park.py\n"

[expected.files]
"_aitna/.ergon/C186-holders-jobs/jobs/3-docs/JOB.md" = "---\nid: C186\nname: holders-jobs\nplan: C186\njob: C186.3\nrow:\nbranch: main\nrevisions:\nowned_paths:\ntasks:\n  - C186\nnext: the docs say so\nsessions:\norigin:\nreadiness:\nwritten:\n---\n\n## Steps\n\n- [ ] say so\n"
"_aitna/.ergon/C186-holders-jobs/jobs/3-docs/HOLDER" = "---\nharness: claude\nsession: s1\nmachine: laptop\nworktree: {{root}}\nwritten: {{ts}}\n---\n"
