id = "tools/models-refresh-dry-run"
ecosystem = "shared"
kind = "tool"
covers = ["tool:model_routing/models"]

# `--refresh --dry-run` plans from the catalog and writes nothing: the file stays absent.

[fixture]
tmp_files = { ".codex/models_cache.json" = "{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6.1-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-6.1-terra\",\"visibility\":\"list\",\"priority\":1},{\"slug\":\"gpt-6-astra\",\"visibility\":\"list\",\"priority\":3},{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":4},{\"slug\":\"gpt-reserve\",\"visibility\":\"hide\",\"priority\":4},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":5},{\"slug\":\"gpt-5.6-sol\",\"visibility\":\"list\",\"priority\":6},{\"slug\":\"gpt-5.6-terra\",\"visibility\":\"list\",\"priority\":7},{\"slug\":\"gpt-5.6-luna\",\"visibility\":\"list\",\"priority\":8},{\"slug\":\"codex-auto-review\",\"visibility\":\"hide\",\"priority\":43}]}" }

[env]
HOME = "{{tmp}}"

[run]
tool = "model_routing/models"
argv = ["--refresh", "--dry-run"]

[expected]
exit = 0
stderr = ""
stdout = "catalog codex: source=~/.codex/models_cache.json (codex-models-cache) client=0.164.0\n  luna → gpt-6-luna\n  terra → gpt-6.1-terra\n  sol → gpt-6.1-sol\nwould write _aitna/.local/model-aliases.json\n"
file_absent = ["_aitna/.local/model-aliases.json"]
