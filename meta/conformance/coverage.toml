# The coverage gate's exceptions (design §5, gate 2). The population itself is DERIVED by
# coverage.py from the source of the tree under test — commands from cli.py `_COMMANDS`, hooks
# and tools from their `__main__` blocks, unit tables from units/, and `code:<code>:<severity>`
# from every literal emission site — so nothing here lists what akmon ships. This file holds
# only the facts the source cannot say. An entry that names nothing derived is stale and fails
# the gate (`conformance.coverage-stale`).
#
# Item names: command:<name>, hook:<name>, tool:<path under tools/>, unit:<name>,
# code:<code>:<ok|warn|error>.

# [ecosystem] — items one ecosystem owns (ADR 0020 D02). Such an item is covered by `shared`
# scenarios or that ecosystem's own; every item NOT listed here is shared and only a `shared`
# scenario covers it (a python-tagged scenario is invisible to the Node port).
#   "code:<code>:<severity>" = { ecosystem = "python" | "node", reason = "…" }
# A whole-code key, "code:<code>", owns every severity of the code: its finding lines name the
# ecosystem's own carrier, so a shared scenario's `findings` leave them out and only that
# ecosystem's scenarios pin them. When the Node carrier lands (C105) a code both ecosystems
# emit with their own lines gets a node-side entry of its own.
[ecosystem]
"code:layout.standard-path" = { ecosystem = "python", reason = "lists the Python tree's files (bin/*.py, hooks/*.py); the JS tree is laid out under js/ and names a package tree `standard tree:`, a Node mount's paths under the mount (cli/verify-node-mount-healthy)" }
"code:package.dev-pin" = { ecosystem = "python", reason = "reads the pin from pyproject.toml; Node reads package.json devDependencies (ADR 0020 D05)" }
"code:hooks.launcher" = { ecosystem = "python", reason = "names the .venv/bin/akmon launcher; Node wiring calls node on node_modules/akmon/js/hooks (ADR 0020 D05) or the mount's js/hooks (C129) directly, pinned by the node scenarios" }
"code:gitignore.akmon-pycache" = { ecosystem = "python", reason = "the Python bytecode cache a Python-run mount writes; a Node mount runs no Python, so nothing produces it and the JS verify does not check it (C129)" }
"code:changelog.unreleased" = { ecosystem = "python", reason = "a mounted mode's check of the mount's CHANGELOG.md, whose path names the mount; package mode reports changelog.package-mode instead. The Node mount's side is cli/verify-node-mount-healthy (C129)" }
"code:layout.vendored-leftover" = { ecosystem = "python", reason = "a vendored mount's leftover members, which differ per carrier fixture; the Node mount's side is cli/verify-node-vendored-leftover (C129)" }
"code:check.ruff-without-python" = { ecosystem = "python", reason = "fires only with package.json and no Python files, which the Python native attach (a pyproject.toml pin) can never be; the mounted scenario covers it, cli/verify-node-ruff-without-python pins the Node side" }
"code:attach.mount-ecosystem" = { ecosystem = "python", reason = "a mount the Python implementation runs in a project with no Python files (C129); the JavaScript verify refuses every Python record, so only the Python side emits it" }
"code:agents.language-profile" = { ecosystem = "python", reason = "the profile a project calls for follows its carrier's manifest (pyproject.toml: python.md; package.json: js.md), so the same fixture names a different profile per ecosystem; the node scenarios pin the js.md side" }

# [exempt] — items no hermetic scenario can reach; each reason says why and where the item is
# covered instead. An exempt item needs no scenario.
[exempt]
"code:codex.host-trust:warn" = "needs a live Codex install; the corpus hides codex from PATH, N10 probes it"

# [dynamic] — emission sites that pass a non-literal severity or code (`<path>::<qualname>`).
# Their codes cannot be derived at the site, so each is listed with the reason it hides none;
# an unlisted dynamic site fails the gate (`conformance.population-dynamic`).
[dynamic]
"bin/verify.py::Verifier.ok" = "the ok severity wrapper; every caller passes a literal code to self.ok and is derived there"
"bin/verify.py::Verifier.warn" = "the warn severity wrapper; every caller passes a literal code to self.warn and is derived there"
"bin/verify.py::Verifier.error" = "the error severity wrapper; every caller passes a literal code to self.error and is derived there"
"tools/release/release_check.py::_finding" = "the line-safe Finding factory; every caller passes a literal severity and code and is derived there"
