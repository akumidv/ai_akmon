modes = { "bin/git" = "755" }
env = { "PATH" = "{{dir}}/bin" }
expected_json = '"main"'

[[case]]
id = "branch/detached-head-word"
fn = "current_git_branch"
args_json = '[]'
files = { "bin/git" = "#!/bin/sh\necho HEAD\n" }
modes = { "bin/git" = "755" }
env = { "PATH" = "{{dir}}/bin" }
expected_json = '"HEAD"'

[[case]]
id = "branch/empty-output"
