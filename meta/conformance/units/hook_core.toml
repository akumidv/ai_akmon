# Unit table: the vendor-neutral hook decisions (hooks/hook_core.py; JS mirror js/hooks/hook_core.mjs,
# ADR 0020 D01, C104 pass 2). Data files, all read from the tree under test: hooks/hook_core.json
# (path tables, delegation policy, reminder texts), hooks/vocabulary.json (neutral tool kinds) and
# common/markers.json (marker and state-file names). The Python module opens them beside itself; the
# JS mouth hands the module `lazyHookData(tree)` -- hook_data.mjs's bundle -- as the FIRST argument of
# every export the contract marks as taking `data`.
#
# Why this table exists: every answer here is a string or a decision a hook prints, and the two
# implementations reach it through different stdlibs. Python's `pathlib`/`os.path.normpath` collapse
# a path lexically (`//x`, `///x`, trailing slash, `..` through a link); `str.lower()` handles a final
# sigma and a dotted capital I; `int()` accepts whitespace of every script, a sign, underscores and
# every script's decimal digits; `f"{x:g}"` rounds half to even on the binary value; `repr()` of a
# permission mode quotes and escapes; `str.strip()`/`sorted()` work on code points; and the command
# guards use `\b`, which is ASCII on both sides by decision (`re.ASCII` on the Python side), so a
# neighbour such as `é` or `β` is a boundary. A JS port gets none of this for free. The table is
# the spec: every expected value was produced by running the Python and then read against the
# function's docstring.
#
# The mouth is the generic one of `routing.toml` (the row format is the block comment above
# `probe_routing` in probe.py): a row is `{id, fn, args_json, expected_json}` plus world keys. What
# the hook modules add, all documented there: `{{tree}}` (the tree under test), `$float` and `$exc`
# argument constructors, the world keys `dirs`, `links` and `cwd`, `steps_json` (a sequence whose
# answers are the row's answer -- a counter file survives from step to step), `class_only` (a raise
# answers its class alone: the message is the language's), and the `{{core:<key>}}` tokens for the
# long prose of hook_core.json, so a reword does not move this table while the placement of the
# pieces and every filled-in value (the dev-layer name, the branch, the score, the quoted mode) stay
# pinned. `$path` arguments must be spelled as `str(Path)` spells them (no `//`, no trailing slash):
# the JS side receives the string as is. A row that passes `kwargs_json` passes the branch of
# `git_commit_guard_result` explicitly (`null` asks git), because the JS export takes its options
# object after it. Every row runs in its own scratch directory, which is also TMPDIR (so the marker
# and counter files are the row's own); `AITNA_ROOT` and the three AKMON_DELEGATION_* variables are
# unset unless the row sets them; `{{dir}}` is the scratch directory, `tree` lists the files a row
# leaves (a file that is there but unreadable shows as `{"unreadable": true}`).
#
# Families (the `id` prefix): `root` -- the tree the hook runs from and how to spell it for an
# agent (the mount is the runtime tree only when it links to it); `fail` -- the two crash lines name
# the class and never the message; `kind` -- the neutral tool-kind tokens and a miss; `branch` --
# current_git_branch against a stand-in `git` the row writes onto PATH (arguments, strip, stdout of
# a failing git, the 5 s timeout, a missing binary); `sudo` and `git` -- the two command guards
# (word boundaries, the trailer deny, push/tag/merge, a commit on main/master/detached, the
# unattended ask->deny escalation with `repr(permission_mode)`, a branch asked of git); `agents` --
# the charter roster; `stale` and `session` -- the package-run freshness notice and the SessionStart
# result; `classify`, `code`, `planning` -- the path predicates; `message` -- the two reminder texts
# with the configured root; `role` and `analysis` -- once-per-session claims, as sequences over one
# scratch directory; `grace`, `nudge-threshold`, `ask-threshold` -- the environment overrides read
# with int(); `nudge-message`, `ask-message` -- the `:g` spelling of the score and the grace; `nudge`
# -- delegation_nudge_result as sequences (counter, weights, soft nudge once, hard ask once, a read
# never asks, a subagent is exempt, a delegation resets, a counter file the previous rule or a
# crash left); `result` -- HookResult; `reexport` -- the root helpers hook_core re-exports.
#
# Deliberate non-pins: `report_unclassified_shell_route` (it writes stderr and a marker; the hook
# corpus pins its line), a TMPDIR that is missing or unwritable (the stdlib then falls back to a
# system directory the row does not own: the markers table owns temp-directory choice), a
# `branch`/`file_path`/`permission_mode` that is not a string and a HookResult built without its
# event name (typed contracts, not behaviors), the value of `delegation_grace` beyond 2**53 (a JS
# number cannot hold it; the nudge message pins the whole integer instead) and a raise's message
# when the message is the OS's or the interpreter's. The rows have been run on Python 3.11 through
# 3.14; one that differed (a trailing-dot suffix, a symlink loop) was left out.

# --- root: the tree the hook runs from, and how to spell it ------------------------------------------

[[case]]
id = "root/runtime-root"
fn = "akmon_runtime_root"
args_json = '[{"$path": "{{dir}}/proj"}]'
expected_json = '"{{tree}}"'

[[case]]
id = "root/display-no-mount"
fn = "runtime_root_display"
args_json = '[{"$path": "{{dir}}/proj"}]'
expected_json = '"$(akmon path)"'

[[case]]
id = "root/display-mount-is-tree"
fn = "runtime_root_display"
args_json = '[{"$path": "{{dir}}/proj"}]'
dirs = ["proj/_aitna"]
links = { "proj/_aitna/akmon" = "{{tree}}" }
expected_json = '"_aitna/akmon"'

[[case]]
id = "root/display-mount-other-tree"
fn = "runtime_root_display"
args_json = '[{"$path": "{{dir}}/proj"}]'
files = { "proj/_aitna/akmon/README.md" = "x" }
expected_json = '"$(akmon path)"'

[[case]]
id = "root/display-mount-link-elsewhere"
