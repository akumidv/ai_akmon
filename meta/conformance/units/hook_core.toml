args_json = '[{"$path": "{{dir}}/proj"}]'
files = { "other/README.md" = "x" }
links = { "proj/_aitna/akmon" = "{{dir}}/other" }
expected_json = '"$(akmon path)"'

[[case]]
id = "root/display-mount-dangling"
fn = "runtime_root_display"
args_json = '[{"$path": "{{dir}}/proj"}]'
links = { "proj/_aitna/akmon" = "{{dir}}/missing" }
expected_json = '"$(akmon path)"'

[[case]]
id = "root/display-custom-root"
fn = "runtime_root_display"
args_json = '[{"$path": "{{dir}}/proj"}]'
env = { "AITNA_ROOT" = "tools/ai" }
links = { "proj/tools/ai/akmon" = "{{tree}}" }
expected_json = '"tools/ai/akmon"'

[[case]]
