# --- branch: current_git_branch asks `git rev-parse --abbrev-ref HEAD` and strips --------------------
# A `git` the row writes into a scratch bin/ and puts alone on PATH stands in for the real one.

[[case]]
id = "branch/plain"
fn = "current_git_branch"
args_json = '[]'
files = { "bin/git" = "#!/bin/sh\necho feature/x\n" }
modes = { "bin/git" = "755" }
env = { "PATH" = "{{dir}}/bin" }
expected_json = '"feature/x"'

[[case]]
id = "branch/stripped"
fn = "current_git_branch"
args_json = '[]'
files = { "bin/git" = "#!/bin/sh\nprintf '  feature/x \\t\\n\\n'\n" }
modes = { "bin/git" = "755" }
env = { "PATH" = "{{dir}}/bin" }
expected_json = '"feature/x"'

[[case]]
id = "branch/no-newline"
fn = "current_git_branch"
args_json = '[]'
