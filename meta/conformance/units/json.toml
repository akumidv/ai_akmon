# Unit table: the JSON writer. Three canonical forms the implementations emit (the corpus's
# pinned spec — Python's json.dumps answers below are the reference):
#   hook      — a hook's stdout document: one line, default separators
#             — hooks/claude_adapter.py::render_result, hooks/claude_adapter.py::run_guarded
#               (the crash-open systemMessage), hooks/codex_adapter.py::print_result
#   wiring    — generated wiring files (.claude/settings.json, .codex/hooks.json): indent=2 + trailing newline
#             — bin/sync.py::_claude_settings, bin/sync.py::_codex_hooks_text,
#               tools/model_routing/routing.py::binding_artifacts (local config)
#   canonical — the registry content hash: sort_keys, compact separators
#             — tools/model_routing/routing.py::registry_hash
#
# The cases below past the first block pin the JSON *writer's* stdlib semantics generically
# (ensure_ascii escaping, key order, number spelling) rather than one call site's payload
# shape, because a JS mirror using `JSON.stringify` diverges from every one of these by
# default: it never escapes non-ASCII (Python's ensure_ascii=True does, including astral
# chars as escaped UTF-16 surrogate pairs and, surprisingly, DEL — see below), a plain JS
# object with all-integer-like keys reorders them ahead of string keys during construction
# (a Python dict/`json.dumps` never reorders), and it spells `null` only for `undefined`-free
# values, which the `null_keys` field below exists to test since TOML itself has no null.
#
# No call site currently dumps a float (payloads above are ints/strings/bools/lists/dicts
# only); the float cases below pin the spelling rule itself, so that the day one is added the
# mirror already agrees — `json.dumps` prints `repr(float)`, and both whole and fractional
# forms are carried.

[[case]]
form = "hook"
value = { hookSpecificOutput = { hookEventName = "PreToolUse", additionalContext = "note" }, systemMessage = "x" }
expected = '{"hookSpecificOutput": {"hookEventName": "PreToolUse", "additionalContext": "note"}, "systemMessage": "x"}'

[[case]]
form = "hook"
value = { warning = "⚠ owner-only" }
expected = '{"warning": "\u26a0 owner-only"}'

[[case]]
form = "hook"
value = {}
expected = '{}'

[[case]]
form = "hook"
value = { quote = 'a "b" \ c' }
expected = '{"quote": "a \"b\" \\ c"}'

[[case]]
form = "wiring"
value = { a = 1, b = [1, 2] }
expected = '''
{
  "a": 1,
  "b": [
    1,
    2
  ]
}
'''

[[case]]
form = "wiring"
value = { hooks = [] }
expected = '''
{
  "hooks": []
}
'''

[[case]]
form = "canonical"
value = { b = 1, a = { z = true, y = "" } }
expected = '{"a":{"y":"","z":true},"b":1}'

[[case]]
form = "canonical"
value = { name = "é" }
expected = "{\"name\":\"\\u00e9\"}"

[[case]]
# Astral char: Python's ensure_ascii=True escapes it as a lowercase UTF-16 surrogate pair.
# `JSON.stringify` in JS never escapes non-ASCII by default, so it would emit the raw 4-byte
# UTF-8 character instead — a real divergence the JS mirror must reproduce deliberately.
form = "hook"
value = { note = "𝄞" }
expected = '{"note": "\ud834\udd1e"}'

[[case]]
# Control chars \n \t \u0001 \u001f \u007f. DEL (0x7f) is NOT one of JSON's own named escapes
# (\b \f \n \r \t) or its <0x20 control-char rule — it is escaped anyway, because Python's
# ensure_ascii treats anything outside the printable ASCII range 0x20-0x7e as needing a \u
# escape, not just non-ASCII bytes. `JSON.stringify` has no such rule and leaves DEL as a raw
# byte, so this is a real divergence (surprising: the DEL exception assumed going in was
# backwards — Python escapes it, JS does not).
form = "hook"
value = { s = "\n\t\u0001\u001f\u007f" }
expected = '{"s": "\n\t\u0001\u001f\u007f"}'

[[case]]
# U+2028/U+2029 (line/paragraph separator): Python's ensure_ascii escapes both. Bare
# `JSON.stringify` in JS does not — historically a real interop hazard (a U+2028 inside a
# `<script>`-embedded JSON literal used to break JS parsers before engines special-cased it).
form = "hook"
value = { s = "\u2028\u2029" }
expected = '{"s": "\u2028\u2029"}'

[[case]]
# "/" is never escaped by json.dumps (unlike some JSON encoders' default). JS's
# JSON.stringify agrees, but this pins the shared expectation explicitly.
form = "hook"
value = { s = "a/b" }
expected = '{"s": "a/b"}'

[[case]]
# Integer-like keys keep Python dict insertion order under plain json.dumps. A JS mirror that
# builds a plain object literal to hold these key/value pairs would NOT reproduce this: a JS
# engine enumerates all-integer-like own keys in ascending numeric order ahead of any string
# keys, regardless of assignment order, so {b:1, "10":2, "2":3} would iterate/stringify as
# "10", "2", "b" — a real divergence the JS mirror must avoid (e.g. by using a Map).
form = "hook"
value = { b = 1, 10 = 2, 2 = 3 }
expected = '{"b": 1, "10": 2, "2": 3}'

[[case]]
# Same value, canonical form: sort_keys sorts keys as strings, so "10" < "2" < "b" (character
# by character, not numeric) — the JS mirror must sort as strings too, not as numbers.
form = "canonical"
value = { b = 1, 10 = 2, 2 = 3 }
expected = '{"10":2,"2":3,"b":1}'

[[case]]
# No call site dumps a float today; this pins that a float keeps its ".0" rather than
# collapsing to an integer spelling, if one is ever added to a dumped value.
form = "hook"
value = { x = 1.0 }
expected = '{"x": 1.0}'

# Number spelling, which is where a JS writer and `json.dumps` part company if the writer is
# built on `JSON.stringify` (it drops the `.0`) or on `toFixed` (it spells the *binary* value:
# `0.1` through 20 places is `0.10000000000000000555`). Python prints `repr(float)` — the
# shortest digits that read back exactly — and chooses fixed or exponential by where the
# decimal point sits: exponential below `1e-4` and above `1e16`, with the exponent padded to
# two digits. `1.5e16` is the case that catches a writer taking the digits from `String()`
# instead, which pads them out to `15000000000000000`.

[[case]]
form = "hook"
value = { a = 0.1, b = 123.456, c = 3.0 }
expected = '{"a": 0.1, "b": 123.456, "c": 3.0}'

[[case]]
form = "hook"
value = { a = 1e16, b = 1.5e16, c = 1e21 }
expected = '{"a": 1e+16, "b": 1.5e+16, "c": 1e+21}'

[[case]]
# `5e15` sits one step under the exponential cut and keeps the long fixed form with its `.0`.
form = "hook"
value = { a = 5e15, b = 1e-4, c = 1e-5 }
expected = '{"a": 5000000000000000.0, "b": 0.0001, "c": 1e-05}'

[[case]]
form = "hook"
value = { a = -0.0, b = 0.0, c = 1e-7 }
expected = '{"a": -0.0, "b": 0.0, "c": 1e-07}'

[[case]]
# TOML spells integers in forms a JS number cannot tell from a float by value alone: the hex
# `0xE` carries an `e` that belongs to the digits, and `1_000` carries an underscore. Both are
# integers, and both must come out as integers — a floatness test that only looks for `.`/`e`
# marks the first one a float and writes `14.0`.
form = "hook"
value = { a = 0xE, b = 1_000, c = 0o17, d = 0b1011 }
expected = '{"a": 14, "b": 1000, "c": 15, "d": 11}'

[[case]]
# A whole float in the canonical form: sort_keys and the compact separators, still `3.0`.
form = "canonical"
value = { b = 1.0, a = 2.5 }
expected = '{"a":2.5,"b":1.0}'

[[case]]
# true/false/null. TOML has no null, so `null_keys` names top-level keys of `value` the probe
# replaces with Python `None` before dumping (probe.py's only way to pin json.dumps's "null").
form = "hook"
value = { a = true, b = false, c = false }
null_keys = ["c"]
expected = '{"a": true, "b": false, "c": null}'

[[case]]
# Nested empty containers under the wiring form's indent=2: an empty dict/list stays inline
# ("{}" / "[]") rather than expanding onto its own indented lines.
form = "wiring"
value = { a = {}, b = [] }
expected = '''
{
  "a": {},
  "b": []
}
'''
