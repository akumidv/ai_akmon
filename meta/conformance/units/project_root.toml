# Unit table: the project-root owner (common/project_root.py; JS mirror js/common/project_root.mjs,
# ADR 0020 D01, ADR 0022 D09). Where the project root is, and what its dev layer is called: the dev root
# is declared by a one-line file at the project root, `.aitna-root` (a project-root-relative POSIX path),
# an absent file means `_aitna`, and the `AITNA_ROOT` environment variable is read nowhere.
#
# Generic rows over the same mouth as the hook tables (the row format is the block comment above
# `probe_routing` in probe.py): a row names the Python public name, its JSON arguments and the world it
# runs in. The row's project is its scratch directory (`{{dir}}`, or a subdirectory of it); the declaration
# is a `files` entry named `.aitna-root`; a `DevRoot` answers as `{path, origin}`; `resolve_project_root`
# answers `[root, notice]` on both sides (the JS mouth hands its `{root, notice}` back as the pair). A
# refusal is `{"error": "ValueError", "message": ...}` and its message names the declared value.
#
# Families (the `id` prefix): `dev` -- dev_root: the pointer read, the default, no project root and the
# refusals; `validated` -- validated_dev_root_name, the shared check (also the `akmon init --aitna-root`
# one); `name` -- aitna_root_name, aitna_root and akmon_mount over the same declarations; `local`, `ergon`
# and `legacy` -- local_root, ergon_root and legacy_local_root (ADR 0028 D01), the dotted folders and the
# pre-0028 `local` under that root; `is` --
# is_project_root's markers (AGENTS.md beside the pointer, the record, or the mount); `locate` --
# locate_project_root, the walk that answers None where find_project_root guesses; `find` -- the
# fallback; `resolve` -- the root a command works in and the notice it prints when it had to guess;
# `repo` -- the two layouts the pointer exists to tell apart (akmon's own, `.aitna-root` = `meta`, and a
# project that merely owns a `meta/` directory).

[[case]]
# The declared path, anchored at the project root.
id = "dev/pointer"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "tools/ai" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
# The file as an editor writes it: one line and a newline.
id = "dev/pointer-trailing-newline"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "tools/ai\n" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
# Surrounding whitespace is stripped.
id = "dev/pointer-padded"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "  tools/ai  \n\n" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
# A trailing slash is stripped from the value; the path is spelled as a POSIX path.
id = "dev/pointer-trailing-slash"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "tools/ai/" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
# An inner `//` collapses in the answer's path.
id = "dev/pointer-inner-double-slash"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "tools//ai" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
id = "dev/pointer-unicode"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "é/中" }
expected_json = '{"path": "{{dir}}/é/中", "origin": "pointer"}'

[[case]]
# Case is kept (the classifiers lowercase for matching, the name is as declared).
id = "dev/pointer-uppercase"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "Tools/AI" }
expected_json = '{"path": "{{dir}}/Tools/AI", "origin": "pointer"}'

[[case]]
id = "dev/pointer-single-segment"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "meta" }
expected_json = '{"path": "{{dir}}/meta", "origin": "pointer"}'

[[case]]
# No declaration: `_aitna`, found by default.
id = "dev/default-no-file"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
expected_json = '{"path": "{{dir}}/_aitna", "origin": "default"}'

[[case]]
# Nothing but the file declares a root: a `meta/` directory beside the default changes nothing.
id = "dev/default-no-file-other-files"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { "meta/TASKS.md" = "x", "_aitna/.akmon.toml" = "" }
expected_json = '{"path": "{{dir}}/_aitna", "origin": "default"}'

[[case]]
# No project root was found: the bare default, for reading only.
id = "dev/no-project-root"
fn = "dev_root"
args_json = '[null]'
expected_json = '{"path": "_aitna", "origin": "no-project-root"}'

[[case]]
# The retired AITNA_ROOT variable moves nothing.
id = "dev/env-ignored"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
env = { AITNA_ROOT = "elsewhere" }
expected_json = '{"path": "{{dir}}/_aitna", "origin": "default"}'

[[case]]
id = "dev/env-does-not-override-pointer"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
env = { AITNA_ROOT = "elsewhere" }
files = { ".aitna-root" = "tools/ai" }
expected_json = '{"path": "{{dir}}/tools/ai", "origin": "pointer"}'

[[case]]
# An absolute path is refused as written, not stripped to a relative one.
id = "dev/refuses-absolute"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "/etc/akmon" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: '/etc/akmon'"}'''

[[case]]
id = "dev/refuses-only-slashes"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "///" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: '///'"}'''

[[case]]
id = "dev/refuses-parent"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "../outside" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: '../outside'"}'''

