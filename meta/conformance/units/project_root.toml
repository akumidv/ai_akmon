[[case]]
id = "validated/empty"
fn = "validated_dev_root_name"
args_json = '["", {"$path": "{{dir}}"}, "--aitna-root"]'
expected_json = '{"error": "ValueError", "message": "--aitna-root cannot be empty"}'

[[case]]
id = "validated/only-slashes-is-absolute"
