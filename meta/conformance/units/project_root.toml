args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "a/../../b" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: 'a/../../b'"}'''

[[case]]
id = "dev/refuses-dotdot-alone"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = ".." }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: '..'"}'''

[[case]]
# `.` is the project root itself, not a dev layer inside it.
id = "dev/refuses-dot"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "." }
expected_json = '{"error": "ValueError", "message": ".aitna-root resolves outside the project root: {{dir}}"}'

[[case]]
id = "dev/refuses-empty"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "" }
expected_json = '{"error": "ValueError", "message": ".aitna-root cannot be empty"}'

[[case]]
id = "dev/refuses-blank"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = " \n" }
expected_json = '{"error": "ValueError", "message": ".aitna-root cannot be empty"}'

[[case]]
# One line only; the message quotes the whole text.
id = "dev/refuses-several-lines"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "tools/ai\nmore\n" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must hold one line, a project-root-relative path: 'tools/ai\\nmore'"}'''

[[case]]
# A symlinked segment can leave the project without a `..`: refused by resolution.
id = "dev/refuses-symlink-escape"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}/proj"}]'
files = { "proj/.aitna-root" = "esc/dev", "out/keep" = "" }
links = { "proj/esc" = "{{dir}}/out" }
expected_json = '{"error": "ValueError", "message": ".aitna-root resolves outside the project root: {{dir}}/out/dev"}'

[[case]]
# A link that stays inside the project is fine; the answer keeps the declared spelling.
id = "dev/symlink-inside-ok"
fn = "dev_root"
args_json = '[{"$path": "{{dir}}/proj"}]'
files = { "proj/.aitna-root" = "lnk/dev", "proj/real/keep" = "" }
links = { "proj/lnk" = "{{dir}}/proj/real" }
expected_json = '{"path": "{{dir}}/proj/lnk/dev", "origin": "pointer"}'

[[case]]
id = "validated/relative"
