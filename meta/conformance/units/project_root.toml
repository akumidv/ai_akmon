args_json = '[{"$path": "{{dir}}"}]'
files = { "AGENTS.md" = "", "meta/TASKS.md" = "x", "meta/notes.md" = "x", "_aitna/.akmon.toml" = "" }
expected_json = '"_aitna"'

[[case]]
id = "repo/own-meta-dir-mount"
fn = "akmon_mount"
args_json = '[{"$path": "{{dir}}"}]'
files = { "AGENTS.md" = "", "meta/TASKS.md" = "x", "meta/notes.md" = "x", "_aitna/.akmon.toml" = "" }
expected_json = '"{{dir}}/_aitna/akmon"'

[[case]]
# Without a declaration or a record under `_aitna`, a `meta/` directory marks nothing.
id = "repo/own-meta-dir-no-record-not-a-project"
fn = "is_project_root"
args_json = '[{"$path": "{{dir}}"}]'
files = { "AGENTS.md" = "", "meta/TASKS.md" = "x" }
expected_json = 'false'
