# Unit table: the pure half of the Codex adapter (hooks/codex_adapter.py; JS mirror
# js/hooks/codex_adapter.mjs, ADR 0020 D01, C104 pass 2). Data files, read from the tree under
# test: hooks/vocabulary.json (the Codex tool names and the payload key spellings),
# hooks/codex_hook.json (the payload-shape template) and common/markers.json (the unidentified
# session). The JS mouth hands the modules hook_data.mjs's lazy bundle as the first argument of every
# export that reads one of them; `is_apply_patch_command` reads none.
#
# Why this table exists. `is_apply_patch_command` decides, from a shell command string, whether a
# Bash call is the one effect akmon can path-classify: a quote-and-escape walker, three regular
# expressions and a heredoc opener. Python's `re` and JS's differ exactly where this reads text --
# `\s`/`\S`/`\b` (Unicode in Python unless `re.ASCII`, which the Python side now sets and the JS side
# spells as explicit ASCII classes), `^`/`$` under MULTILINE (Python sees only `\n`; JS also sees
# `\r`, U+2028 and U+2029), and `.` (Python excludes only `\n`) -- so the rows put CRLF, a lone CR,
# U+2028/2029, NEL, NBSP and the control separators U+001C-U+001F next to every pattern. The payload
# accessors are Python `dict.get` + `isinstance` + truthiness over arbitrary JSON: `tool_name`
# returns an empty string at once, `command` reads `tool_input.get(k) or payload.get(k)` (so a
# non-string input value *blocks* the top-level value of the same key and a falsy one *defers* to
# it), `session_id`/`cwd`/`tool_use_id` skip an empty string. `file_paths` strips the patch paths with
# `str.strip()` (Unicode whitespace incl. U+2028, NEL and U+001C-U+001F), de-duplicates comparing
# `\` as `/`, and keeps an empty path a name of only U+2028 leaves. `payload_shape` sorts keys by code
# point (an astral key after U+E000 and U+FF5E; UTF-16 order would differ). The table is the spec:
# every expected value was produced by running the Python and then read against the docstring.
#
# The mouth is the generic one of `routing.toml` (row format: the block comment above `probe_routing`
# in probe.py); `class_only` answers the exception class alone (a payload that is not an object is an
# AttributeError at `.get`, a null payload to `payload_shape` a TypeError at the iteration).
#
# Families (the `id` prefix): `patch` -- is_apply_patch_command: the heredoc forms, the envelope
# lines, the path line, the command position (separators, `{ `, `$(`, `command`, a path prefix,
# a `-c` wrapper), the quote walker, non-ASCII whitespace and letters; `tool` and `kind` --
# normalize_tool and tool_kind (a shell call carrying a patch acts as an edit; a missing tool name is
# apply_patch); `tool_name`, `session_id`, `tool_use_id`, `cwd`, `command` -- every key spelling in
# priority order and every wrong type; `paths` and `unmeasured` -- file_paths and
# unmeasured_path_source (rename `Move to`, guessed keys kept apart, dedupe, strip, CRLF, U+2028);
# `shape` -- payload_shape.
#
# Deliberate non-pins: `load_payload` and `print_result` (stdin and stdout), `report_failure` (stderr
# and the exit code) -- the hook corpus pins them -- and a `HookResult` rendered by print_result.

# --- patch: is_apply_patch_command -- a command-position apply_patch directly opening a complete inline envelope ----
# The shell is read by a narrow walker (quotes and escapes), not parsed; the classes are ASCII on both sides.

[[case]]
id = "patch/plain"
fn = "is_apply_patch_command"
args_json = '["apply_patch <<\u0027EOF\u0027\n*** Begin Patch\n*** Add File: a.txt\n+x\n*** End Patch\nEOF\n"]'
expected_json = 'true'

