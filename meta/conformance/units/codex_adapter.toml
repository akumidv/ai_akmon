expected_json = 'true'

[[case]]
id = "unmeasured/guessed-list-only"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"files": ["a.py"]}}]'
expected_json = 'true'

[[case]]
id = "unmeasured/guessed-top-level-only"
fn = "unmeasured_path_source"
args_json = '[{"path": "a.py"}]'
expected_json = 'true'

[[case]]
id = "unmeasured/guessed-and-patch"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"file_path": "a.py", "command": "*** Begin Patch\n*** Add File: b.txt\n*** End Patch\n"}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-and-patch-with-no-paths"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"file_path": "a.py", "command": "ls"}}]'
expected_json = 'true'

[[case]]
id = "unmeasured/guessed-and-empty-patch-name"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"file_path": "a.py", "command": "*** Begin Patch\n*** Add File: \u2028\n*** End Patch\n"}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-and-raw-patch"
fn = "unmeasured_path_source"
args_json = '[{"file_path": "a.py", "raw": "*** Begin Patch\n*** Add File: b.txt\n*** End Patch\n"}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-empty-string"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"file_path": ""}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-empty-list"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"files": []}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-list-without-strings"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"files": [1, null, ""]}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/guessed-wrong-type"
fn = "unmeasured_path_source"
args_json = '[{"tool_input": {"file_path": 5}}]'
expected_json = 'false'

[[case]]
id = "unmeasured/command-is-not-a-path"
