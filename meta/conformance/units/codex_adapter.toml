# --- paths: file_paths / unmeasured_path_source -- the patch body's path lines, plus guessed keys kept apart ----
# Order is guessed keys (tool_input, then payload; string keys, then list keys) and then the patch body; the stable de-duplication
# compares with `\` as `/` and keeps the first spelling; the patch paths are stripped with Python's str.strip().

[[case]]
id = "paths/add"
fn = "file_paths"
