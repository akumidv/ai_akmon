# --- shape: payload_shape -- the key names of the payload and its tool input, sorted by code point ----

[[case]]
id = "shape/empty"
fn = "payload_shape"
args_json = '[{}]'
expected_json = '"tool_input keys: <none>; payload keys: <none>"'

[[case]]
id = "shape/top-only"
fn = "payload_shape"
args_json = '[{"b": 1, "a": 2}]'
expected_json = '"tool_input keys: <none>; payload keys: a, b"'

[[case]]
id = "shape/tool-input-only"
fn = "payload_shape"
args_json = '[{"tool_input": {"z": 1, "y": 2}}]'
expected_json = '"tool_input keys: y, z; payload keys: tool_input"'

[[case]]
id = "shape/both"
fn = "payload_shape"
args_json = '[{"session_id": "s", "tool_name": "Bash", "tool_input": {"command": "ls"}}]'
expected_json = '"tool_input keys: command; payload keys: session_id, tool_input, tool_name"'

[[case]]
id = "shape/tool-input-empty-dict"
fn = "payload_shape"
args_json = '[{"tool_input": {}}]'
expected_json = '"tool_input keys: <none>; payload keys: tool_input"'

[[case]]
id = "shape/tool-input-not-a-dict"
fn = "payload_shape"
args_json = '[{"tool_input": "ls", "b": 1}]'
expected_json = '"tool_input keys: <none>; payload keys: b, tool_input"'

[[case]]
id = "shape/other-input-spelling"
fn = "payload_shape"
args_json = '[{"input": {"command": "ls"}}]'
expected_json = '"tool_input keys: command; payload keys: input"'

[[case]]
id = "shape/two-input-spellings-first-dict-wins"
fn = "payload_shape"
args_json = '[{"params": {"p": 1}, "tool_input": {"t": 1}}]'
expected_json = '"tool_input keys: t; payload keys: params, tool_input"'

[[case]]
id = "shape/uppercase-before-lowercase"
fn = "payload_shape"
args_json = '[{"b": 1, "B": 2, "a": 3, "A": 4}]'
expected_json = '"tool_input keys: <none>; payload keys: A, B, a, b"'

[[case]]
id = "shape/digits-before-letters"
fn = "payload_shape"
args_json = '[{"b": 1, "1": 2, "10": 3, "2": 4}]'
expected_json = '"tool_input keys: <none>; payload keys: 1, 10, 2, b"'

[[case]]
id = "shape/underscore-between"
fn = "payload_shape"
args_json = '[{"a": 1, "_": 2, "Z": 3}]'
expected_json = '"tool_input keys: <none>; payload keys: Z, _, a"'

[[case]]
id = "shape/non-ascii-after-ascii"
fn = "payload_shape"
args_json = '[{"z": 1, "é": 2, "a": 3}]'
expected_json = '"tool_input keys: <none>; payload keys: a, z, é"'

[[case]]
id = "shape/astral-after-bmp-high"
fn = "payload_shape"
args_json = '[{"～": 1, "𝒜": 2, "\ue000": 3, "z": 4}]'
expected_json = '"tool_input keys: <none>; payload keys: z, \ue000, ～, 𝒜"'

[[case]]
id = "shape/astral-after-private-use"
fn = "payload_shape"
args_json = '[{"𝒜": 1, "\ue000": 2}]'
expected_json = '"tool_input keys: <none>; payload keys: \ue000, 𝒜"'

[[case]]
id = "shape/empty-key"
fn = "payload_shape"
args_json = '[{"": 1, "a": 2}]'
expected_json = '"tool_input keys: <none>; payload keys: , a"'

[[case]]
id = "shape/key-with-comma-and-space"
fn = "payload_shape"
args_json = '[{"a, b": 1, "c": 2}]'
expected_json = '"tool_input keys: <none>; payload keys: a, b, c"'

[[case]]
id = "shape/key-with-braces"
fn = "payload_shape"
args_json = '[{"{{x}}": 1, "a": 2}]'
expected_json = '"tool_input keys: <none>; payload keys: a, {{x}}"'

[[case]]
id = "shape/key-with-newline"
fn = "payload_shape"
args_json = '[{"a\nb": 1}]'
expected_json = '"tool_input keys: <none>; payload keys: a\nb"'

[[case]]
id = "shape/keys-with-prefix"
fn = "payload_shape"
args_json = '[{"ab": 1, "a": 2, "abc": 3}]'
expected_json = '"tool_input keys: <none>; payload keys: a, ab, abc"'

[[case]]
id = "shape/unicode-keys-tool-input"
fn = "payload_shape"
args_json = '[{"tool_input": {"中": 1, "é": 2, "𝒜": 3}}]'
expected_json = '"tool_input keys: é, 中, 𝒜; payload keys: tool_input"'

[[case]]
id = "shape/many-keys"
fn = "payload_shape"
args_json = '[{"k000": 0, "k001": 1, "k002": 2, "k003": 3, "k004": 4, "k005": 5, "k006": 6, "k007": 7, "k008": 8, "k009": 9, "k010": 10, "k011": 11, "k012": 12, "k013": 13, "k014": 14, "k015": 15, "k016": 16, "k017": 17, "k018": 18, "k019": 19, "k020": 20, "k021": 21, "k022": 22, "k023": 23, "k024": 24, "k025": 25, "k026": 26, "k027": 27, "k028": 28, "k029": 29, "k030": 30, "k031": 31, "k032": 32, "k033": 33, "k034": 34, "k035": 35, "k036": 36, "k037": 37, "k038": 38, "k039": 39}]'
expected_json = '"tool_input keys: <none>; payload keys: k000, k001, k002, k003, k004, k005, k006, k007, k008, k009, k010, k011, k012, k013, k014, k015, k016, k017, k018, k019, k020, k021, k022, k023, k024, k025, k026, k027, k028, k029, k030, k031, k032, k033, k034, k035, k036, k037, k038, k039"'

[[case]]
id = "shape/values-are-not-printed"
fn = "payload_shape"
args_json = '[{"tool_input": {"command": "SECRET"}, "api_key": "SECRET"}]'
expected_json = '"tool_input keys: command; payload keys: api_key, tool_input"'

[[case]]
id = "shape/payload-is-a-list"
fn = "payload_shape"
args_json = '[[]]'
class_only = true
expected_json = '{"error": "AttributeError"}'

[[case]]
id = "shape/payload-is-null"
fn = "payload_shape"
args_json = '[null]'
class_only = true
expected_json = '{"error": "TypeError"}'
