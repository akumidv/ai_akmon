# --- stale_materialized over a project and a tree (base 6000) -------------------------------
# `project` holds the copies (under <aitna_dir>/.akmon/), `tree` the standard tree they are
# compared with; `*_hex` are raw bytes, `*_dirs` directories, `*_chmod` file modes.

[[stale]]
# Everything current: a markdown copy and a TOML copy, both with the banner the tree implies.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n", "profiles/ruff.toml" = "# Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand.\n\nline-length = 120\n" }
tree = { "guardrails/a.md" = "# A\nbody\n", "profiles/ruff.toml" = "line-length = 120\n" }
expected = { value = [] }

[[stale]]
# The tree moved on and the copy did not: stale.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nold\n" }
tree = { "guardrails/a.md" = "# A\nnew\n" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A hand edit of the copy (its banner deleted) is stale though the body is the tree's.
project = { "guardrails/a.md" = "# A\nbody\n" }
tree = { "guardrails/a.md" = "# A\nbody\n" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A hand edit of a TOML copy.
project = { "profiles/ruff.toml" = "# Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand.\n\nline-length = 100\n" }
tree = { "profiles/ruff.toml" = "line-length = 120\n" }
expected = { value = ["profiles/ruff.toml"] }

[[stale]]
# A copy whose source is gone from the tree.
project = { "guardrails/gone.md" = "# G\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx\n" }
tree = {}
expected = { value = ["guardrails/gone.md"] }

[[stale]]
# No materialization at all: nothing to say, whatever the tree holds.
tree = { "guardrails/a.md" = "# A\n" }
expected = { value = [] }

[[stale]]
# The directory is there and empty.
project_dirs = ["guardrails", "profiles"]
tree = { "guardrails/a.md" = "# A\n" }
expected = { value = [] }

[[stale]]
# Only .md and .toml files are scanned; other names and a wrong-case suffix are not the standard's.
project = { "guardrails/notes.txt" = "x", "guardrails/README" = "x", "guardrails/A.MD" = "x", "guardrails/a.md.bak" = "x" }
tree = {}
expected = { value = [] }

[[stale]]
# Names are scanned in code-point order: an uppercase name before a lowercase one, and a
# character outside the BMP after a high BMP one (UTF-16 order would put it before).
project = { "guardrails/b.md" = "x", "guardrails/B.md" = "x", "guardrails/a.toml" = "x", "guardrails/é.md" = "x", "guardrails/😀.md" = "x", "guardrails/～.md" = "x" }
tree = {}
expected = { value = ["guardrails/B.md", "guardrails/a.toml", "guardrails/b.md", "guardrails/é.md", "guardrails/～.md", "guardrails/😀.md"] }

[[stale]]
# The imported directories come in their own order, not in name order.
project = { "profiles/a.md" = "x", "guardrails/z.md" = "x" }
tree = {}
expected = { value = ["guardrails/z.md", "profiles/a.md"] }

[[stale]]
# A directory the standard does not import is not looked at.
project = { "skills/a.md" = "x" }
tree = {}
expected = { value = [] }

[[stale]]
# The source's line endings do not matter: `read_text` reads \r\n as \n, so an LF copy is current.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "# A\r\nbody\r\n" }
expected = { value = [] }

[[stale]]
# ... and neither do the copy's: a CRLF copy reads the same.
project = { "guardrails/a.md" = "# A\r\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\r\n\r\nbody\r\n" }
tree = { "guardrails/a.md" = "# A\nbody\n" }
expected = { value = [] }

[[stale]]
# A lone \r is a newline to `read_text` too.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "# A\rbody\r" }
expected = { value = [] }

[[stale]]
# A byte-order mark is kept by the strict `utf-8` decode, so it is part of the text: here the
# first line is not a heading, and the banner goes on top.
project = { "guardrails/a.md" = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\ufeff# A\nbody\n" }
tree = { "guardrails/a.md" = "\ufeff# A\nbody\n" }
expected = { value = [] }

[[stale]]
# ... so a copy that lost it is stale.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "\ufeff# A\nbody\n" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A file named `.md` is scanned (the name ends in `.md`) and is markdown.
project = { "guardrails/.md" = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx\n" }
tree = { "guardrails/.md" = "x\n" }
expected = { value = [] }

[[stale]]
# A source that begins with a no-break-space heading: the banner follows that line.
project = { "guardrails/a.md" = "\u00a0# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "\u00a0# A\nbody\n" }
expected = { value = [] }

[[stale]]
# A copy that is not UTF-8 raises: it is not an unreadable file but an undecodable one.
project_hex = { "guardrails/a.md" = "fffe41" }
tree = { "guardrails/a.md" = "# A\n" }
expected = { raises = true }

[[stale]]
# ... so does a source that is not UTF-8, once the copy has been read.
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n" }
tree_hex = { "guardrails/a.md" = "c328" }
expected = { raises = true }

[[stale]]
# The source's existence is tested first: a bad copy with no source is stale, not an error.
project_hex = { "guardrails/a.md" = "fffe41" }
tree = {}
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A directory where the copy should be a file cannot be read: stale (the other files go on).
project_dirs = ["guardrails/x.md"]
project = { "guardrails/y.md" = "# Y\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n" }
tree = { "guardrails/x.md" = "# X\n", "guardrails/y.md" = "# Y\n" }
expected = { value = ["guardrails/x.md"] }

[[stale]]
# A directory where the source should be a file is not a source: stale.
project = { "guardrails/x.md" = "# X\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n" }
tree_dirs = ["guardrails/x.md"]
expected = { value = ["guardrails/x.md"] }

[[stale]]
# A copy the process may not read cannot be compared: stale, and the hook goes on.
nonroot = true
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n" }
project_chmod = { "guardrails/a.md" = "000" }
tree = { "guardrails/a.md" = "# A\n" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A source it may not read: the same.
nonroot = true
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n" }
tree = { "guardrails/a.md" = "# A\n" }
tree_chmod = { "guardrails/a.md" = "000" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# A directory of copies it may not list reads as empty — nothing is reported for it.
nonroot = true
project = { "guardrails/a.md" = "x" }
project_chmod = { "guardrails" = "000" }
tree = {}
expected = { value = [] }

[[stale]]
# The dev layer follows AITNA_ROOT, for the copies' place and for their banner.
aitna_root = "tools/ai/"
aitna_dir = "tools/ai"
project = { "guardrails/a.md" = "# A\n<!-- Generated by tools/ai/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "# A\nbody\n" }
expected = { value = [] }

[[stale]]
# A copy carrying the default root's banner under a configured root is stale: the banner is
# what `sync` would write now.
aitna_root = "tools/ai"
aitna_dir = "tools/ai"
project = { "guardrails/a.md" = "# A\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n" }
tree = { "guardrails/a.md" = "# A\nbody\n" }
expected = { value = ["guardrails/a.md"] }

[[stale]]
# Copies under a root the environment does not name are not looked at.
aitna_dir = "tools/ai"
project = { "guardrails/a.md" = "x" }
tree = {}
expected = { value = [] }
