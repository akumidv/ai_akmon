# Unit table: the package-mode materialization — its banner, its copy format, and whether a
# copy is current (common/materialization.py; JS mirror js/common/materialization.mjs, ADR 0020
# D01). Data file: common/materialization.json, read from the tree under test on both sides.
#
# Call sites: generated_marker / generated_banner / materialized_text / imported_dirs —
# bin/sync.py (it writes the copies; `sync --check` and `verify` compare what it would write);
# materialized_markdown — materialized_text, for a .md name; materialized_dir — stale_materialized,
# the one place the code asks where the copies live (sync spells the path itself); stale_materialized — hooks/hook_core.py
# (stale_guardrail_notice, at SessionStart), which says so when the installed standard has moved
# past the copies. One banner rule and one comparison, so the writer and the checker cannot
# disagree about the bytes. Like the markers table this one describes a world: the `stale` family
# has the probe build a project (the copies under `<aitna_dir>/.akmon/`) and a standard tree from
# the row's files, run the module over them and report the answer. `aitna_root` sets the
# AITNA_ROOT environment variable for the row (left out: unset — and `aitna_dir` names where that
# puts the dev layer, `_aitna` by default). Every copy below is written with the banner spelled
# out, because the exact bytes are the spec:
#
#   Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand.
#
# Families, each with the index base both mouths share: `marker` 0 — the prefix a generated file
# is recognised by; `banner` 1000 — the banner under the configured root; `markdown` 2000 — a
# source text with the banner inserted; `text` 3000 — the copy of one named file (markdown or
# TOML format by name); `dirs` 4000 — the imported directories, in order; `dir` 5000 — where the
# copies live; `stale` 6000 — the relative paths of the copies that no longer match, `{ value }`
# or `{ raises }`. A row marked `nonroot` relies on file modes and is left out when the probe
# runs as root.
#
# Why each family. `banner`: the root is the one dynamic part, taken from AITNA_ROOT *when asked*
# with its slashes stripped and the default for an empty one. `markdown` is where the twins can
# drift without a test noticing, because Python and JS disagree about three small things: where
# the first line ends (`str.splitlines` breaks at \v, \f, U+001C–U+001E, U+0085, U+2028 and
# U+2029 as well as \r\n, which a JS split on \n does not), what leading whitespace is
# (`str.lstrip` strips U+001C–U+001F, U+0085 and U+00A0 but not U+FEFF — the reverse of JS's
# `trim`), and that the heading line keeps its own ending, so a heading with none has the comment
# glued to it (`# T<!-- … -->`, pinned as it is). `text` pins that only a name ending in exactly
# `.md` gets the HTML-comment form. `stale` pins the freshness contract: a copy equal to what the
# tree would produce is current whatever the tree's version; a hand edit, a changed source, a
# missing source and a copy that cannot be read are stale; no materialization at all is silent;
# names are scanned in code-point order per imported directory, in the imported order; text is
# compared the way `Path.read_text` reads it (`\r\n` and `\r` become `\n`, a BOM is kept, invalid
# UTF-8 raises — and raises only once the source is known to exist, since the source check comes
# first).
#
# Observed, not changed: stale_materialized's docstring says unreadable files count as stale so
# "the caller never raises", but a file that is not UTF-8 raises (a ValueError, not an OSError).
# The rows pin what both twins do today; whether the hook should catch it is the owner's call.

# --- the recognition prefix (base 0) --------------------------------------------------------

[[marker]]
expected = "Generated by "

# --- the banner under the configured root (base 1000) ---------------------------------------

[[banner]]
expected = "Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
aitna_root = ""
expected = "Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
# Only slashes make a root empty.
aitna_root = "//"
expected = "Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
aitna_root = "tools/ai"
expected = "Generated by tools/ai/akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
# Leading and trailing slashes are stripped, inner ones and spaces are not.
aitna_root = "/tools//ai/"
expected = "Generated by tools//ai/akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
aitna_root = " dev layer "
expected = "Generated by  dev layer /akmon/bin/sync.py. Do not edit this file by hand."

[[banner]]
aitna_root = "слой"
expected = "Generated by слой/akmon/bin/sync.py. Do not edit this file by hand."

# --- markdown: the banner after a leading heading, else on top (base 2000) -------------------

[[markdown]]
input = "# T\nbody\n"
expected = "# T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n"

[[markdown]]
input = "body\n"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n"

[[markdown]]
# Empty source: no first line to follow, the comment stands alone.
input = ""
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n"

[[markdown]]
# CRLF: the heading keeps its \r\n, the comment and its blank line are \n, the rest is untouched.
input = "# T\r\nbody\r\n"
expected = "# T\r\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\r\n"

[[markdown]]
# A heading with no ending has the comment on its own line — the format's quirk, pinned.
input = "# T"
expected = "# T<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n"

[[markdown]]
input = "#\n"
expected = "#\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n"

[[markdown]]
# A `#` that is not on the first line is not a leading heading.
input = "x\n# T\n"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx\n# T\n"

[[markdown]]
# A blank first line is the first line: the heading under it is not leading.
input = "\n# T\n"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\n# T\n"

[[markdown]]
# Leading blanks are stripped before the `#` test, and the line is kept as it was.
input = "  # T\nx"
expected = "  # T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
input = "\t#\tT\nx"
expected = "\t#\tT\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
# `#!` and `#hashtag` start with `#` too: the rule is the first character, not a heading syntax.
input = "#!shebang\nx"
expected = "#!shebang\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
# A lone \r ends the first line (an old-Mac file).
input = "# T\rbody"
expected = "# T\r<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
# \v, \f, U+0085, U+2028 and U+2029 end a line for `splitlines` and not for a split on \n.
input = "# T\u000bbody"
expected = "# T\u000b<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
input = "# T\u000cbody"
expected = "# T\u000c<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
input = "# T\u0085body"
expected = "# T\u0085<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
input = "# T\u2028body"
expected = "# T\u2028<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
input = "# T\u2029body"
expected = "# T\u2029<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody"

[[markdown]]
# ... and a line that is only such a break is a blank first line, so no heading is leading.
input = "\u2028# T\nx"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\u2028# T\nx"

[[markdown]]
input = "\u0085# T\nx"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\u0085# T\nx"

[[markdown]]
# `lstrip()` strips a no-break space and U+001F (a Unicode space that is not a line break)...
input = "\u00a0# T\nx"
expected = "\u00a0# T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
input = "\u001f# T\nx"
expected = "\u001f# T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
input = "\u3000# T\nx"
expected = "\u3000# T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[markdown]]
# ... and does not strip a byte-order mark, which JS's `trim` does.
input = "\ufeff# T\nx"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\n\ufeff# T\nx"

[[markdown]]
# The banner tracks the configured root.
aitna_root = "tools/ai"
input = "# T\nbody\n"
expected = "# T\n<!-- Generated by tools/ai/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n"

# --- text: markdown or TOML form by name (base 3000) ----------------------------------------

[[text]]
name = "a.md"
input = "# T\nbody\n"
expected = "# T\n<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nbody\n"

