input = "# T\n"
expected = "# Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand.\n\n# T\n"

[[text]]
# The bare name `.md` ends in `.md`.
name = ".md"
input = "x"
expected = "<!-- Generated by _aitna/akmon/bin/sync.py. Do not edit this file by hand. -->\n\nx"

[[text]]
aitna_root = "tools/ai"
name = "ruff.toml"
input = "x"
expected = "# Generated by tools/ai/akmon/bin/sync.py. Do not edit this file by hand.\n\nx"

