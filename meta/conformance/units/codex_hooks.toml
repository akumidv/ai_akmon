# Unit table: the pure half of the Codex hook oracle (common/codex_hooks.py; JS mirror
# js/common/codex_hooks.mjs, ADR 0020 D01, C105). Data file: common/codex_hooks.json (the closed
# `protocol_failures` table, the event-name map and the trust vocabularies), read from the tree under
# test on both sides: the Python module opens the file beside itself, the JS mouth hands the parsed
# document to every export as its first argument (the error classes are built from it).
#
# Why this table exists: `verify` turns "codex resolved but is uninspectable" into a finding, and
# everything between the wire and that finding is a pure function of a JSON document -- but of a
# *Python* reading of it. `json.loads` accepts `NaN`, `Infinity` and `-Infinity` and refuses an
# integer of more than 4300 digits with a plain `ValueError` (a `JSON.parse` does neither); a JSON
# object is a `dict` and `isinstance(x, bool)` is not `isinstance(x, int)`; `2.0 == 2`; `x is True`
# is not truthiness; `repr()` of an event name picks its quote by what the name contains and escapes
# by its own rules; a tuple is a hashable identity and a list is not. The diagnostics are a closed
# table (design §7: no vendor text reaches an owner's screen), so each failure kind is also pinned
# by its fixed text. A JS port gets none of this for free. The table is the spec: every expected
# value was produced by running the Python and then read against the docstrings.
#
# The mouth is the generic one of `routing.toml` (the row format is the block comment above
# `probe_routing` in probe.py). A row names a public function -- or one of the four private parsers
# the Python spells with an underscore (`_delivery_state`, `_check_hook_metadata`,
# `_parse_hooks_list_message`, `_hooks_list_project_entry`; the JS exports drop it) -- and its JSON
# arguments. `hook_trust_problems` wants tuples as expected identities, which JSON cannot spell, so a
# row builds them with `{"$call": "expected_codex_hooks", "args": [wiring]}`, the function the
# production caller uses. A raise answers `{"error": <class>, "message": …}`; the message of a
# `CodexProtocolError` is always the table's fixed text, so a row that feeds a canary shows it is
# not echoed.
#
# Call sites: expected_codex_hooks, hook_trust_problems and query_hooks_list --
# bin/verify.py::check_codex_host_trust (and, on the JS side, js/bin/verify.mjs); the private parsers
# are query_hooks_list's, in this order: runner -> _parse_hooks_list_message ->
# _hooks_list_project_entry -> _check_hook_metadata per element.
#
# Families (the `id` prefix): `expected` -- the triples a wiring promises (matcher absent, null and
# empty, non-command hooks ignored whatever their shape, order, duplicates kept); `wiring-error` --
# every CodexWiringError in the order the checks run, with `repr()` of hostile event names;
# `trust` -- missing, disabled (only the boolean `true` is enabled), untrusted, modified,
# unrecognized (a vendor string is never a problem name), ambiguous (copies that disagree, in either
# order) and the skipped misshapen identities; `state` -- one entry's delivery state; `metadata` --
# each HookMetadata check in order; `parse` -- the response line: not JSON, not an object, the id
# (`2.0` equals 2, `true` does not), the error key, `NaN` and the integer-digit limit; `project` --
# the one `result.data` entry for this cwd.
#
# Deliberate non-pins: nesting deeper than the interpreter's recursion limit (a `RecursionError` at
# a depth that depends on the Python version, 9997 on 3.12.3, about 990 on 3.11), a `bytes` response
# (the JS runner returns a string), the iteration order of an event map whose keys are integer-like
# (insertion order in Python, ascending in JS), and `query_hooks_list` / `default_runner`
# themselves -- they await a runner and spawn a process: pytest (meta/tests/test_codex_hooks.py) and
# node:test (js/common/codex_hooks.test.mjs) pin them with an injected runner and a fake `codex`.

