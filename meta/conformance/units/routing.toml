fn = "overlay_path"
args_json = '[{"$path": "{{dir}}"}]'
expected_json = '"{{dir}}/_aitna/model-routing.json"'

[[case]]
# The dev root is read from the project's `.aitna-root` with its trailing slash stripped.
id = "reg/overlay-path-pointer"
fn = "overlay_path"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "dev/layer/" }
expected_json = '"{{dir}}/dev/layer/model-routing.json"'

[[case]]
# An absolute declaration is refused, not stripped to a relative one.
id = "reg/overlay-path-pointer-absolute"
fn = "overlay_path"
args_json = '[{"$path": "{{dir}}"}]'
files = { ".aitna-root" = "/dev/layer/" }
expected_json = '''{"error": "ValueError", "message": ".aitna-root must be relative to the project root and stay inside it: '/dev/layer/'"}'''

[[case]]
# The retired AITNA_ROOT variable moves nothing.
id = "reg/overlay-path-env-ignored"
fn = "overlay_path"
args_json = '[{"$path": "{{dir}}"}]'
