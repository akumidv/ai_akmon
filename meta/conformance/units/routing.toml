# Model aliases (ADR 0024 D16): the catalog parser, the resolution, the reserved `default` token, the generated file.

[[case]]
# Only `visibility == list` slugs that read <family>-<version>-<alias> count: gpt-reserve is hidden, codex-auto-review is listed but unversioned; a missing priority is null.
id = "alias/catalog-parse"
fn = "parse_catalog"
args_json = '["{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6.1-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-reserve\",\"visibility\":\"hide\",\"priority\":4},{\"slug\":\"codex-auto-review\",\"visibility\":\"list\",\"priority\":43},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":null}]}", "codex-models-cache"]'
expected_json = '{"client": "0.164.0", "models": [{"slug": "gpt-6.1-sol", "alias": "sol", "version": [6, 1], "priority": 0}, {"slug": "gpt-6-luna", "alias": "luna", "version": [6], "priority": null}]}'

[[case]]
# The host catalog of the owner's report: the highest version of each alias.
id = "alias/catalog-aliases-host"
fn = "catalog_aliases"
args_json = '[{"$call": "parse_catalog", "args": ["{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6.1-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-6.1-terra\",\"visibility\":\"list\",\"priority\":1},{\"slug\":\"gpt-6-astra\",\"visibility\":\"list\",\"priority\":3},{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":4},{\"slug\":\"gpt-reserve\",\"visibility\":\"hide\",\"priority\":4},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":5},{\"slug\":\"gpt-5.6-sol\",\"visibility\":\"list\",\"priority\":6},{\"slug\":\"gpt-5.6-terra\",\"visibility\":\"list\",\"priority\":7},{\"slug\":\"gpt-5.6-luna\",\"visibility\":\"list\",\"priority\":8},{\"slug\":\"codex-auto-review\",\"visibility\":\"hide\",\"priority\":43}]}", "codex-models-cache"]}, ["luna", "terra", "sol"]]'
expected_json = '{"luna": "gpt-6-luna", "terra": "gpt-6.1-terra", "sol": "gpt-6.1-sol"}'

[[case]]
# An alias the catalog does not list is absent (unmapped), never guessed.
id = "alias/catalog-aliases-unmatched"
fn = "catalog_aliases"
args_json = '[{"$call": "parse_catalog", "args": ["{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6.1-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-6.1-terra\",\"visibility\":\"list\",\"priority\":1},{\"slug\":\"gpt-6-astra\",\"visibility\":\"list\",\"priority\":3},{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":4},{\"slug\":\"gpt-reserve\",\"visibility\":\"hide\",\"priority\":4},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":5},{\"slug\":\"gpt-5.6-sol\",\"visibility\":\"list\",\"priority\":6},{\"slug\":\"gpt-5.6-terra\",\"visibility\":\"list\",\"priority\":7},{\"slug\":\"gpt-5.6-luna\",\"visibility\":\"list\",\"priority\":8},{\"slug\":\"codex-auto-review\",\"visibility\":\"hide\",\"priority\":43}]}", "codex-models-cache"]}, ["sol", "nova"]]'
expected_json = '{"sol": "gpt-6.1-sol"}'

[[case]]
# Equal versions: the lowest priority wins, then the first listed; a lone model with no priority still maps.
