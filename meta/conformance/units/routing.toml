# --- art: config, artifacts, obsolete agents, rebind --------------------------------------------

[[case]]
id = "art/local-config"
fn = "local_config"
args_json = '[{"$new": "Binding", "fields": {"vendor": "anthropic", "orchestrator": "large", "reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}}, {"$registry": {}}]'
kwargs_json = '{"second_opinion": true, "available": ["small", "medium", "large"]}'
expected_json = '{"vendor": "anthropic", "orchestrator": "large", "binding": {"reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}, "second_opinion": true, "available": ["small", "medium", "large"], "auditor_opt_in": null, "registry_hash": "{{registry_hash}}", "task_kind_floors": {}}'

[[case]]
# A single vendor writes the same config: neither a provider nor a fallback model is recorded (ADR 0024).
id = "art/local-config-single-vendor"
fn = "local_config"
args_json = '[{"$new": "Binding", "fields": {"vendor": "anthropic", "orchestrator": "large", "reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}}, {"$registry": {"drop": ["openai"]}}]'
kwargs_json = '{"second_opinion": false, "available": ["small", "medium", "large"]}'
expected_json = '{"vendor": "anthropic", "orchestrator": "large", "binding": {"reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}, "second_opinion": false, "available": ["small", "medium", "large"], "auditor_opt_in": null, "registry_hash": "{{registry_hash}}", "task_kind_floors": {}}'

[[case]]
# The `session` stanza is written when one is given and only then (ADR 0024): the harness the session runs on.
id = "art/local-config-session"
fn = "local_config"
args_json = '[{"$new": "Binding", "fields": {"vendor": "anthropic", "orchestrator": "large", "reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}}, {"$registry": {}}]'
kwargs_json = '{"second_opinion": false, "available": ["small", "medium", "large"], "session": {"provider": "qwen", "model": "q"}}'
expected_json = '{"vendor": "anthropic", "orchestrator": "large", "binding": {"reasoner": "large", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"]}, "second_opinion": false, "available": ["small", "medium", "large"], "auditor_opt_in": null, "registry_hash": "{{registry_hash}}", "task_kind_floors": {}, "session": {"provider": "qwen", "model": "q"}}'

[[case]]
# A rebind moves only the orchestrator: the recorded session stanza survives the rewrite.
id = "art/rebind-to-keeps-session"
fn = "rebind_to"
args_json = '[{"$path": "{{dir}}"}, {"$registry": {}}, {"available": ["small", "medium", "large"], "session": {"provider": "qwen", "model": "q"}}, "medium"]'
tree = ".claude"
