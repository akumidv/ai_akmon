expected_json = '["codex", "exec", "--model", "gpt-6.1-sol", "-c", "model_reasoning_effort=\"high\"", "p"]'

[[case]]
id = "effort/command-effort-only"
fn = "opinion_command"
args_json = '[{"$registry": {}}, "codex", null, {"$new": "OpinionRun", "fields": {"effort": "max", "prompt": "p"}}]'
expected_json = '["codex", "exec", "-c", "model_reasoning_effort=\"max\"", "p"]'

[[case]]
id = "effort/command-pi"
fn = "opinion_command"
args_json = '[{"$registry": {}}, "pi", null, {"$new": "OpinionRun", "fields": {"model": "x", "effort": "off", "prompt": "p"}}]'
expected_json = '["pi", "-p", "--no-session", "--tools", "read,grep,find,ls", "--no-extensions", "--no-mcp", "--model", "x", "--thinking", "off", "p"]'

[[case]]
# A declared argv takes the row's effort flag after its argv, before the prompt.
id = "effort/command-declared-argv"
fn = "opinion_command"
args_json = '[{"$registry": {"set": {"providers": {"d": {"argv": ["d-bin", "-m", "{model}"], "efforts": {"flag": "--think {effort}", "levels": ["low", "high"]}}}}}}, "d", null, {"$new": "OpinionRun", "fields": {"model": "m", "effort": "high", "prompt": "p"}}]'
expected_json = '["d-bin", "-m", "m", "--think", "high", "p"]'

[[case]]
id = "effort/command-unsupported"
fn = "opinion_command"
args_json = '[{"$registry": {}}, "opencode", null, {"$new": "OpinionRun", "fields": {"effort": "high", "prompt": "p"}}]'
expected_json = '''{"error": "EffortError", "message": "provider 'opencode' declares no `efforts`, so the effort 'high' cannot be sent to it; drop '@high', or declare providers.opencode.efforts (a flag holding {effort} and the levels, weakest first) in _aitna/local/model-routing.json (yours) or _aitna/model-routing.json (the team's)"}'''

[[case]]
# A ladder entry's effort travels into its target; the second `sh1` entry is skipped as the same family.
id = "effort/chain-carries-effort"
fn = "opinion_chain"
args_json = '[{"$registry": {"set": {"providers": {"sh1": {"argv": ["/bin/sh", "-m", "{model}"], "family": "gpt", "models": ["m1", "m1@high"], "report_dir": "r/sh1/", "efforts": {"flag": "--e {effort}", "levels": ["low", "high"]}}}, "second_opinion_policy": {"ladder": ["sh1:m1@low", "sh1"], "model_rule": "max"}}}}, {"$new": "SecondOpinionSession", "fields": {"provider": "claude", "family": "claude", "model": "opus"}}, null]'
expected_json = '[{"provider": "sh1", "model": "m1", "family": "gpt", "effort": "low"}]'

[[case]]
# No pin: the rule's strongest declared entry, `m1@high`, with its own effort.
id = "effort/chain-strongest-entry-effort"
fn = "opinion_chain"
args_json = '[{"$registry": {"set": {"providers": {"sh1": {"argv": ["/bin/sh", "-m", "{model}"], "family": "gpt", "models": ["m1", "m1@high"], "report_dir": "r/sh1/", "efforts": {"flag": "--e {effort}", "levels": ["low", "high"]}}}, "second_opinion_policy": {"ladder": ["sh1"], "model_rule": "max"}}}}, {"$new": "SecondOpinionSession", "fields": {"provider": "claude", "family": "claude", "model": "opus"}}, null]'
expected_json = '[{"provider": "sh1", "model": "m1", "family": "gpt", "effort": "high"}]'

[[case]]
id = "effort/ladder-pins-default-with-effort"
fn = "ladder_pins_default"
args_json = '[{"$registry": {"set": {"second_opinion_policy": {"ladder": ["codex:default@high"], "model_rule": "max"}}}}, "codex"]'
expected_json = 'true'
