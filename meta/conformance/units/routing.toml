# --- log: zones and the delegation log ----------------------------------------------------------

[[case]]
id = "log/zone-bracketed"
fn = "parse_zone"
args_json = '["  [zone:auth]  check tokens  "]'
expected_json = '["auth", "check tokens"]'

[[case]]
id = "log/zone-spaced-upper"
fn = "parse_zone"
args_json = '["[ ZONE : auth ] check\ntokens"]'
expected_json = '["auth", "check\ntokens"]'

[[case]]
id = "log/zone-empty-label"
fn = "parse_zone"
args_json = '["[zone:] empty"]'
expected_json = '[null, "empty"]'

[[case]]
id = "log/zone-bare"
fn = "parse_zone"
args_json = '["Zone:auth, check tokens"]'
expected_json = '["auth", "check tokens"]'

[[case]]
id = "log/zone-bare-only"
fn = "parse_zone"
args_json = '["zone:auth;:"]'
expected_json = '["auth", ""]'

[[case]]
id = "log/zone-bare-all-punctuation"
fn = "parse_zone"
args_json = '["zone:,; rest"]'
expected_json = '[null, "rest"]'

[[case]]
id = "log/zone-prose"
fn = "parse_zone"
args_json = '["zone: the auth module"]'
expected_json = '[null, "zone: the auth module"]'

[[case]]
id = "log/zone-mid-sentence"
fn = "parse_zone"
args_json = '["mid-sentence zone:auth stays prose"]'
expected_json = '[null, "mid-sentence zone:auth stays prose"]'

[[case]]
# The label stops at ASCII whitespace only: a no-break space stays inside it.
id = "log/zone-bare-nbsp"
fn = "parse_zone"
args_json = '["zone:a\u00a0b rest"]'
expected_json = '["a\u00a0b", "rest"]'

[[case]]
# Inside the brackets only ASCII whitespace is padding: a no-break space there is no marker.
id = "log/zone-nbsp-in-brackets"
fn = "parse_zone"
args_json = '["[\u00a0zone:x] ok"]'
expected_json = '[null, "[\u00a0zone:x] ok"]'

[[case]]
id = "log/line"
fn = "delegation_log_line"
args_json = '["Agent", {"subagent_type": "k_explorer", "model": "small", "description": "find  X"}, "T0", "sess-1"]'
expected_json = '"T0\tsess-1\tk_explorer\tsmall\t-\tfind X"'

[[case]]
id = "log/line-empty-task"
fn = "delegation_log_line"
args_json = '["Task", {}, "T0"]'
expected_json = '"T0\t-\t-\t-\t-\t"'

[[case]]
# The description's whitespace collapses (Unicode-wide) before the zone is parsed off.
id = "log/line-zone"
fn = "delegation_log_line"
args_json = '["Agent", {"subagent_type": "k_explorer", "description": "[zone:auth]\u2003 check\ttokens\u0085"}, "T0", "sess-1", "haiku"]'
expected_json = '"T0\tsess-1\tk_explorer\thaiku\tauth\tcheck tokens"'

[[case]]
# Python's whitespace, not JavaScript's: U+0085 and U+001C split words, U+FEFF does not.
id = "log/line-collapse-python-whitespace"
fn = "delegation_log_line"
args_json = '["Agent", {"description": "a\u0085b\u001cc\ufeffd"}, "T0"]'
expected_json = '"T0\t-\t-\t-\t-\ta b c\ufeffd"'

[[case]]
id = "log/line-override-wins"
fn = "delegation_log_line"
args_json = '["Agent", {"subagent_type": "k_explorer", "model": "opus", "description": "d"}, "T0", "s", "haiku"]'
expected_json = '"T0\ts\tk_explorer\topus\t-\td"'

[[case]]
# Falsy fields read as absent; a non-string one is str()-ed as Python spells it.
id = "log/line-falsy-and-numbers"
fn = "delegation_log_line"
args_json = '["Agent", {"subagent_type": "", "model": 0, "description": 1.5}, "T0", ""]'
expected_json = '"T0\t-\t-\t-\t-\t1.5"'

[[case]]
id = "log/line-other-tool"
fn = "delegation_log_line"
args_json = '["Bash", {"command": "ls"}, "T0"]'
expected_json = 'null'

[[case]]
id = "log/entries"
fn = "parse_delegation_entries"
args_json = '[["T0\tsess-1\tk_explorer\tsmall\tauth\tcheck tokens\n", "T1\tk_explorer\tsmall\tlegacy line", "too\tshort", "", "T2\t - \t k_x \t-\t \td\te\tf ", "T3\ts\ta\tm\tz\t"]]'
expected_json = '[{"timestamp": "T0", "session_id": "sess-1", "subagent": "k_explorer", "model": "small", "zone": "auth", "description": "check tokens"}, {"timestamp": "T1", "session_id": null, "subagent": "k_explorer", "model": "small", "zone": null, "description": "legacy line"}, {"timestamp": "T2", "session_id": null, "subagent": "k_x", "model": null, "zone": null, "description": "d\te\tf"}, {"timestamp": "T3", "session_id": "s", "subagent": "a", "model": "m", "zone": "z", "description": ""}]'

[[case]]
id = "log/unlabelled-warns"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "io", "description": "d"}}, {"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}, {"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "io", "description": "d"}}, {"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s2", "subagent": "k_explorer", "model": null, "zone": "x", "description": "d"}}], "s1", "k_mechanic", null]'
expected_json = '''"this k_mechanic delegation carries no zone label while this session's fan-out is zoned (auth, io) — the coverage map will count it as unlabelled; start the description with [zone:<label>]"'''

[[case]]
id = "log/unlabelled-other-session"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}], "s2", "k_explorer", null]'
expected_json = 'null'

[[case]]
id = "log/unlabelled-labelled-call"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}], "s1", "k_explorer", "auth"]'
expected_json = 'null'

[[case]]
id = "log/unlabelled-auditor"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}], "s1", "k_auditor", null]'
expected_json = 'null'

[[case]]
id = "log/unlabelled-host-builtin"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}], "s1", "general-purpose", null]'
expected_json = 'null'

[[case]]
id = "log/unlabelled-no-session"
fn = "unlabelled_fanout_warning"
args_json = '[[{"$new": "DelegationEntry", "fields": {"timestamp": "t", "session_id": "s1", "subagent": "k_explorer", "model": null, "zone": "auth", "description": "d"}}], null, "k_explorer", null]'
expected_json = 'null'

# --- gate: the C25 count, floor and request ------------------------------------------------------

[[case]]
id = "gate/count-findings-turn"
fn = "count_gate_items"
args_json = '["Here is the pass.\n\n## Findings\n\n- F1 · the thing is wrong\n  - a nested detail, part of F1\n- F2 · the other thing\n- F3 · and this\n\n## Next steps\n\n- not a finding\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
id = "gate/count-architect-reads-none"
fn = "count_gate_items"
args_json = '["## Findings\n\n- a\n- b\n", {"$call": "gate_rule_for", "args": ["architect"]}]'
expected_json = '0'

[[case]]
id = "gate/count-numbered"
fn = "count_gate_items"
args_json = '["## Findings\n\n1. one\n2) two\n3. three\n10.not an item\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
id = "gate/count-bold-heading"
fn = "count_gate_items"
args_json = '["**Findings**:\n\n- one\n+ two\n* three\n\n### Anything\n\n- outside\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
id = "gate/count-in-heading"
fn = "count_gate_items"
args_json = '["### 3 findings\n\n- one\n- two\n- three\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
# Header and separator are not rows; a blank line ends the table.
id = "gate/count-table"
fn = "count_gate_items"
args_json = '["## Findings\n\n| id | what |\n|:---|---:|\n| F1 | a |\n| F2 | b |\n\n| loose | row |\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '2'

[[case]]
id = "gate/count-prose"
fn = "count_gate_items"
args_json = '["## Findings\n\nProse only, no items.\n-not an item\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '0'

[[case]]
id = "gate/count-subsection-and-two-sections"
fn = "count_gate_items"
args_json = '["## Findings\n\n- one\n\n### Detail\n\n- still inside\n\n## Findings (second pass)\n\n- two\n\n# Top\n\n- outside\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
# The base indent is per section: a list wholly inside a numbered step counts its items.
id = "gate/count-indented-base"
fn = "count_gate_items"
args_json = '["## Options\n\n    - A\n      - detail\n    - B\n  - C shallower\n", {"$call": "gate_rule_for", "args": ["architect"]}]'
expected_json = '3'

[[case]]
# Words in any script; only the first three count, digits and punctuation are not words; a
# heading level 7 does not exist; CRLF and a lone CR split lines as splitlines() does.
id = "gate/count-unicode-heading"
fn = "count_gate_items"
args_json = '["## Находки — findings\r\n\r\n- a\r- b\n####### Findings\n- c\n## разбор находок по зонам finding\n- d\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
# splitlines() also breaks on U+2028, U+001E and U+0085; ASCII \s does not take them as indent.
id = "gate/count-unicode-line-breaks"
fn = "count_gate_items"
args_json = '["## Findings\u2028- a\u001e- b\u0085\u00a0- c\u000b- d\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
# A no-break space is no indent to the ASCII class: the line is prose, not the section's first item.
id = "gate/count-nbsp-first-item"
fn = "count_gate_items"
args_json = '["## Findings\n\u00a0- a\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '0'

[[case]]
id = "gate/count-arabic-indic-number"
fn = "count_gate_items"
args_json = '["## Findings\n\n١. one\n2. two\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '1'

[[case]]
# Each section takes its own base indent: a shallow first section does not make the second's
# deeper list into detail.
id = "gate/count-two-sections-own-base"
fn = "count_gate_items"
args_json = '["## Findings\n- a\n## Findings again\n    - b\n    - c\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '3'

[[case]]
# A rule's headings are lowercase prefixes of one of a heading's first three words.
id = "gate/count-synthetic-rule"
fn = "count_gate_items"
args_json = '["## Top RISKS\n- a\n## Low-risk notes\n- b\n## the other risky\n- c\n## one two three risk\n- d\n", {"$new": "GateRule", "fields": {"role": "r", "trigger": "t", "noun": "risks", "headings": ["risk"], "anchor": "x"}}]'
expected_json = '3'

