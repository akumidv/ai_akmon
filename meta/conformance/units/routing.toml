tree = ".claude"
expected_json = '''{"value": [{"vendor": "openai", "orchestrator": "medium", "reasoner": "medium", "worker": "small", "mid": "medium", "auditor": "large", "escalation": ["medium"], "semantic_fallback": false, "warning": "orchestrator=medium is below the orchestration floor (large) — decomposition/synthesis degrade everything downstream; consider /model up. Advisory: the auditor's level verdict is the authoritative check", "second_opinion_cli": "claude"}, ["{{dir}}/.claude/agents/k_explorer.md", "{{dir}}/.claude/agents/k_mechanic.md", "{{dir}}/.claude/agents/k_validator.md", "{{dir}}/.claude/agents/k_implementer.md", "{{dir}}/.claude/agents/k_reasoner.md", "{{dir}}/.claude/agents/k_auditor.md", "{{dir}}/.claude/model-routing.local.json"]], "tree": {"agents/k_auditor.md": "---\nname: k_auditor\ndescription: >-\n  Auditor tier — task kind `audit`. Clean-context audit of a whole gate's collected\n  material (a gate-pack): contradictions between independently-correct findings, uncovered\n  seams between zones, re-ranking deltas, a level verdict. Pinned to the maximal available\n  model; drafts and audits, never edits.\ntools: Read, Grep, Glob, Bash\nmodel: large\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_auditor}}\n", "agents/k_explorer.md": "---\nname: k_explorer\ndescription: >-\n  Worker tier — task kinds `explore-search` and `summarize`. Use for read-only fan-out:\n  find where something lives in code/docs, sweep many files, condense files/logs/docs into\n  a brief. Returns conclusions, not file dumps. In a zoned fan-out, start each call's\n  description with [zone:<label>].\ntools: Read, Grep, Glob, Bash\nmodel: small\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_explorer}}\n", "agents/k_implementer.md": "---\nname: k_implementer\ndescription: >-\n  Worker tier, mid rung — task kind `implement-under-spec`. Use to write code against a\n  decided contract/design: the signatures, data shapes, and structure are already fixed;\n  no open design decisions remain. Ships the change with its tests. In a zoned fan-out,\n  start each call's description with [zone:<label>].\nmodel: medium\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_implementer}}\n", "agents/k_mechanic.md": "---\nname: k_mechanic\ndescription: >-\n  Worker tier — task kinds `mech-edit`, `test-scaffold`, `doc-sync`. Use for mechanical,\n  behaviour-preserving work from an explicit spec: renames, sweeps, formatting, moving\n  code without reshaping it, test skeletons/fixtures from a stated spec, propagating an\n  already-decided fact across docs. In a zoned fan-out, start each call's description with\n  [zone:<label>].\nmodel: small\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_mechanic}}\n", "agents/k_reasoner.md": "---\nname: k_reasoner\ndescription: >-\n  Reasoner tier — task kinds `debug-deep`, `design-fork`, `quant-derivation`,\n  `plan-draft`. Use for load-bearing thinking: multi-cause/cross-boundary failure\n  analysis, drafting options for a contested design fork, deriving pricing/quant math,\n  drafting a decomposition/zone plan for the orchestrator. Returns a structured report; it\n  drafts, it never decides or edits. In a zoned fan-out, start each call's description\n  with [zone:<label>].\ntools: Read, Grep, Glob, Bash\nmodel: medium\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_reasoner}}\n", "agents/k_validator.md": "---\nname: k_validator\ndescription: >-\n  Worker tier — task kind `validate-loop`. Use to drive project gates to green: run\n  tests/lint/verification tools, parse the output, apply minimal mechanical fixes, re-run\n  until green — or stop with a diagnosis when the failure is not mechanical. In a zoned\n  fan-out, start each call's description with [zone:<label>].\nmodel: small\n---\n\n<!-- Generated by akmon tools/model_routing/init.py from registry.json — edit the registry or the project overlay, not this file. -->\n\n{{body:k_validator}}\n", "agents/mine.md": "mine\n", "model-routing.local.json": "{\n  \"vendor\": \"openai\",\n  \"orchestrator\": \"medium\",\n  \"binding\": {\n    \"reasoner\": \"medium\",\n    \"worker\": \"small\",\n    \"mid\": \"medium\",\n    \"auditor\": \"large\",\n    \"escalation\": [\n      \"medium\"\n    ]\n  },\n  \"second_opinion\": true,\n  \"second_opinion_provider\": \"anthropic\",\n  \"available\": [\n    \"small\",\n    \"medium\",\n    \"large\"\n  ],\n  \"registry_hash\": \"{{registry_hash}}\",\n  \"task_kind_floors\": {\n    \"quant-derivation\": \"large\"\n  }\n}\n"}}'''

