[[case]]
id = "gate/request-below-floor"
fn = "gate_audit_request"
args_json = '[{"gate_triggers": {"review_min_findings": 3}}, {}, "review", "## Findings\n\n- a\n- b\n"]'
expected_json = 'null'

[[case]]
id = "gate/request-role-without-gate"
fn = "gate_audit_request"
args_json = '[{"gate_triggers": {"review_min_findings": 1}}, {}, "engineer", "## Findings\n\n- a\n"]'
expected_json = 'null'

[[case]]
id = "gate/request-no-floor"
fn = "gate_audit_request"
args_json = '[{"gate_triggers": {"review_min_findings": 0}}, {}, "review", "## Findings\n\n- a\n"]'
expected_json = 'null'
