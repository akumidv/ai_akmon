[[case]]
# Deep merge: a nested object merges key by key, a list or scalar is replaced, a new key lands.
id = "reg/load-overlay-deep-merge"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": {"b": 1, "c": {"d": 1, "e": 2}}, "x": [1, 2], "y": {"z": 1}}', "_aitna/model-routing.json" = '{"a": {"c": {"e": 5}, "n": true}, "x": [3], "y": 0, "briefs": {"k_explorer": "note"}}' }
