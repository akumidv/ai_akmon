# --- so: the second-opinion spec, ladder and command -------------------------------------------

[[case]]
id = "so/opposite-vendor"
fn = "opposite_vendor"
args_json = '[{"$registry": {}}, "anthropic"]'
expected_json = '"openai"'

[[case]]
id = "so/opposite-vendor-single"
fn = "opposite_vendor"
args_json = '[{"$registry": {"drop": ["openai"]}}, "anthropic"]'
expected_json = '"anthropic"'

[[case]]
# A routing vendor without a usable spec is passed over for the next one in recorded order.
id = "so/opposite-vendor-skips-unusable"
fn = "opposite_vendor"
args_json = '[{"first": {"selection_policy": {}}, "second": {"selection_policy": {}, "second_opinion": {"harness": "h", "operation": "o", "report_dir": "r"}}}, "third"]'
expected_json = '"second"'

[[case]]
id = "so/opposite-vendor-none-usable"
fn = "opposite_vendor"
args_json = '[{"first": {"selection_policy": {}}}, "third"]'
expected_json = '"third"'

[[case]]
id = "so/spec-required"
fn = "second_opinion_spec"
args_json = '[{"$registry": {}}, "openai"]'
expected_json = '{"harness": "codex", "operation": "review", "model_flag": "--model {model}", "report_dir": ".claude/second-opinion/"}'

[[case]]
id = "so/spec-missing-required"
fn = "second_opinion_spec"
args_json = '[{"$registry": {}}, "nope"]'
expected_json = '''{"error": "KeyError", "message": "second-opinion provider 'nope' has no usable harness/operation/report_dir spec"}'''

[[case]]
id = "so/spec-missing-optional"
fn = "second_opinion_spec"
args_json = '[{"$registry": {}}, "nope"]'
kwargs_json = '{"required": false}'
expected_json = '{}'

[[case]]
# A spec without report_dir is not usable.
id = "so/spec-incomplete-optional"
fn = "second_opinion_spec"
args_json = '[{"v": {"second_opinion": {"harness": "h", "operation": "o", "report_dir": ""}}}, "v"]'
kwargs_json = '{"required": false}'
expected_json = '{}'

[[case]]
# A retired key raises even on the optional call, and names every retired key in data order.
id = "so/spec-retired-optional"
fn = "second_opinion_spec"
args_json = '[{"$registry": {"merge": {"openai": {"second_opinion": {"invoke": "x", "cli": "codex"}}}}}, "openai"]'
kwargs_json = '{"required": false}'
expected_json = '''{"error": "KeyError", "message": "second-opinion provider 'openai' still carries the retired key(s) cli, invoke; the executable and its argv moved into common/runtime.py (C57). Delete only those keys from the hand-owned project overlay and leave the rest of the object alone: the overlay is deep-merged over the shipped registry, so harness/operation/report_dir are inherited unless the overlay deliberately overrides one. The initializer reads this file and will not rewrite it; re-run it afterwards to refresh the generated config."}'''

[[case]]
id = "so/fallback-top-orchestrator"
fn = "second_opinion_fallback_model"
args_json = '[["small", "medium", "large"], "large", "large"]'
expected_json = '"medium"'

[[case]]
id = "so/fallback-mid-orchestrator"
fn = "second_opinion_fallback_model"
args_json = '[["small", "medium", "large"], "medium", "large"]'
expected_json = '"small"'

[[case]]
id = "so/fallback-single-rung"
fn = "second_opinion_fallback_model"
args_json = '[["only"], "only", "only"]'
expected_json = 'null'

[[case]]
id = "so/command-default-model"
fn = "second_opinion_command"
args_json = '[{"harness": "claude", "operation": "review"}, "review this"]'
expected_json = '["claude", "-p", "--output-format", "text", "review this"]'

[[case]]
# The model flag is a format string split as a shell would split it, before the prompt.
id = "so/command-pinned-model"
fn = "second_opinion_command"
args_json = '''[{"harness": "codex", "operation": "review", "model_flag": "-c model=\"{model}\" --tag ' a b'"}, "p", "gpt x"]'''
expected_json = '["codex", "exec", "-c", "model=gpt x", "--tag", " a b", "p"]'

[[case]]
# The C97 refusal: the model is named by repr (a quote inside switches Python's quote style).
id = "so/command-unpinnable"
fn = "second_opinion_command"
args_json = '''[{"harness": "claude", "operation": "review"}, "p", "o'x"]'''
expected_json = '''{"error": "UnpinnableModelError", "message": "second opinion needs model \"o'x\" on claude, but the registry declares no model_flag for that vendor — an unpinned run would not be model-diverse. Declare the measured flag in the vendor's second_opinion block, or route this gate another way."}'''

[[case]]
id = "so/command-unknown-harness"
fn = "second_opinion_command"
args_json = '[{"harness": "nope", "operation": "review"}, "p"]'
expected_json = '''{"error": "ValueError", "message": "unknown harness 'nope'; known: claude, codex"}'''

[[case]]
id = "so/resolve-other-vendor"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {}}, {"orchestrator": "large", "binding": {"auditor": "large"}}, "openai"]'
expected_json = '{"provider": "anthropic", "model": null}'

[[case]]
# Configured == the orchestrating vendor skips other-vendor and pins a different model.
id = "so/resolve-pinned-same-vendor"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {}}, {"orchestrator": "large", "binding": {"auditor": "large"}, "second_opinion_provider": "anthropic", "available": ["small", "medium", "large"]}, "anthropic"]'
expected_json = '{"provider": "anthropic", "model": "medium"}'

[[case]]
# A recorded fallback model wins over the ladder walk.
id = "so/resolve-recorded-fallback"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {"drop": ["openai"]}}, {"orchestrator": "large", "second_opinion_fallback_model": "tiny", "available": ["small", "large"]}, "anthropic"]'
expected_json = '{"provider": "anthropic", "model": "tiny"}'

[[case]]
# Without `available` the semantic rungs are walked: worker, mid, strongest.
id = "so/resolve-semantic-rungs"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {"drop": ["openai"]}}, {"orchestrator": "strongest", "binding": {"auditor": "strongest"}}, "anthropic"]'
expected_json = '{"provider": "anthropic", "model": "mid"}'

[[case]]
id = "so/resolve-exhausted"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {"drop": ["openai"]}}, {"orchestrator": "only", "binding": {"auditor": "only"}, "available": ["only"]}, "anthropic"]'
expected_json = 'null'

[[case]]
# A ladder without the same-vendor step ends at an unusable other vendor.
id = "so/resolve-ladder-other-only"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {"drop": ["openai"], "set": {"second_opinion_policy": {"diversity_ladder": ["other-vendor"]}}}}, {"orchestrator": "large", "available": ["small", "large"]}, "anthropic"]'
expected_json = 'null'

[[case]]
# A configured other vendor is honoured even when it is not the recorded-order opposite.
id = "so/resolve-configured-other"
fn = "resolve_second_opinion"
args_json = '[{"$registry": {"set": {"third": {"selection_policy": {}, "second_opinion": {"harness": "h", "operation": "o", "report_dir": "r"}}}}}, {"second_opinion_provider": "third"}, "anthropic"]'
expected_json = '{"provider": "third", "model": null}'

[[case]]
id = "so/unavailability-other-usable"
fn = "second_opinion_unavailability"
args_json = '[{"$registry": {}}, {"orchestrator": "large", "binding": {"auditor": "large"}, "available": ["small", "large"]}, "anthropic"]'
expected_json = '''"other-vendor: openai configured with a usable spec; same-vendor-other-model: on 'anthropic' the rungs ['small', 'large'] against the orchestrator 'large' and the auditor 'large'"'''

[[case]]
id = "so/unavailability-none-no-diverse"
fn = "second_opinion_unavailability"
args_json = '[{"$registry": {"drop": ["openai"]}}, {"orchestrator": "only", "binding": {"auditor": "only"}, "available": ["only"]}, "anthropic"]'
expected_json = '''"other-vendor: no other vendor is configured with a usable second-opinion spec; same-vendor-other-model: on 'anthropic' the rungs ['only'] hold none that differs from both the orchestrator 'only' and the auditor 'only'"'''

[[case]]
# The rungs are shown as Python's list repr, a quote inside switching the element's quotes.
id = "so/unavailability-pinned-repr"
fn = "second_opinion_unavailability"
args_json = '''[{"$registry": {}}, {"second_opinion_provider": "anthropic", "available": ["it's", "b"]}, "anthropic"]'''
expected_json = '''"other-vendor: skipped because second_opinion_provider pins 'anthropic', the orchestrating vendor, though openai is configured; same-vendor-other-model: on 'anthropic' the rungs [\"it's\", 'b'] against the orchestrator '?' and the auditor '?'"'''

[[case]]
id = "so/unavailability-no-diverse-repr"
fn = "second_opinion_unavailability"
args_json = '''[{"$registry": {"drop": ["openai"]}}, {"orchestrator": "it's", "binding": {"auditor": "it's"}, "available": ["it's"]}, "anthropic"]'''
expected_json = '''"other-vendor: no other vendor is configured with a usable second-opinion spec; same-vendor-other-model: on 'anthropic' the rungs [\"it's\"] hold none that differs from both the orchestrator 'it's' and the auditor 'it's'"'''

[[case]]
id = "so/unavailability-ladder-absent"
fn = "second_opinion_unavailability"
args_json = '[{"$registry": {"set": {"second_opinion_policy": {"diversity_ladder": ["nothing"]}}}}, {}, "anthropic"]'
expected_json = '"other-vendor: not attempted, it is absent from the configured ladder; same-vendor-other-model: not attempted, it is absent from the configured ladder"'

