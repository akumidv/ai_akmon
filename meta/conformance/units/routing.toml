expected_json = '"{{dir}}/meta/local/model-routing.json"'

[[case]]
# The developer-local overlay is the strongest layer: it merges over the project overlay key by key, and a list (a ladder) is replaced whole, not extended.
id = "reg/load-local-overlay-strongest"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": {"b": 1, "c": 2}, "ladder": ["x", "y", "z"], "k": 0}', "_aitna/model-routing.json" = '{"a": {"c": 3, "d": 4}, "ladder": ["p", "q"], "k": 1}', "_aitna/local/model-routing.json" = '{"a": {"c": 5}, "ladder": ["q"], "n": true}' }
expected_json = '{"a": {"b": 1, "c": 5, "d": 4}, "ladder": ["q"], "k": 1, "n": true}'

[[case]]
id = "reg/load-local-overlay-alone"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1, "b": 1}', "_aitna/local/model-routing.json" = '{"b": 2}' }
expected_json = '{"a": 1, "b": 2}'

[[case]]
# The local overlay is found under the declared dev root, not under the default.
id = "reg/load-local-overlay-under-declared-root"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { ".aitna-root" = "dev", "akmon/tools/model_routing/registry.json" = '{"a": 1}', "dev/local/model-routing.json" = '{"a": 2}', "_aitna/local/model-routing.json" = '{"a": 3}' }
expected_json = '{"a": 2}'

[[case]]
# A local overlay path that is a directory is no overlay.
id = "reg/load-local-overlay-is-dir"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}', "_aitna/local/model-routing.json/inner" = "x" }
expected_json = '{"a": 1}'

[[case]]
# An overlay that does not parse is refused by name; the parser's own words are not part of the message (the cause is chained).
id = "reg/load-local-overlay-invalid"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}', "_aitna/local/model-routing.json" = '{ not json' }
expected_json = '{"error": "OverlayError", "message": "the routing overlay _aitna/local/model-routing.json is not a valid JSON object; repair or delete it (it is hand-owned, so akmon never rewrites it)"}'

[[case]]
id = "reg/load-project-overlay-invalid"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}', "_aitna/model-routing.json" = '{ not json' }
expected_json = '{"error": "OverlayError", "message": "the routing overlay _aitna/model-routing.json is not a valid JSON object; repair or delete it (it is hand-owned, so akmon never rewrites it)"}'

[[case]]
# An overlay whose top level is not an object is the same named error, not a merge crash.
id = "reg/load-local-overlay-not-an-object"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}', "_aitna/local/model-routing.json" = '[1, 2]' }
expected_json = '{"error": "OverlayError", "message": "the routing overlay _aitna/local/model-routing.json is not a valid JSON object; repair or delete it (it is hand-owned, so akmon never rewrites it)"}'

[[case]]
id = "reg/load-without-project"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": {"b": 1, "c": 2}, "x": [1]}', "_aitna/model-routing.json" = '{"x": 9}' }
expected_json = '{"a": {"b": 1, "c": 2}, "x": [1]}'

[[case]]
# Deep merge: a nested object merges key by key, a list or scalar is replaced, a new key lands.
id = "reg/load-overlay-deep-merge"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": {"b": 1, "c": {"d": 1, "e": 2}}, "x": [1, 2], "y": {"z": 1}}', "_aitna/model-routing.json" = '{"a": {"c": {"e": 5}, "n": true}, "x": [3], "y": 0, "briefs": {"k_explorer": "note"}}' }
expected_json = '{"a": {"b": 1, "c": {"d": 1, "e": 5}, "n": true}, "x": [3], "y": 0, "briefs": {"k_explorer": "note"}}'

[[case]]
id = "reg/load-no-overlay"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}' }
expected_json = '{"a": 1}'

[[case]]
# The overlay is found under the declared dev root, not under the default.
id = "reg/load-overlay-under-declared-root"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { ".aitna-root" = "dev", "akmon/tools/model_routing/registry.json" = '{"a": 1}', "dev/model-routing.json" = '{"a": 2}', "_aitna/model-routing.json" = '{"a": 3}' }
