d report; it drafts, it never decides or edits.", "tools": "Read, Grep, Glob, Bash", "body": "{{body:k_reasoner}}", "kinds": ["debug-deep", "design-fork", "quant-derivation", "plan-draft"]}, {"name": "k_auditor", "tier": "auditor", "description": "Auditor tier — task kind `audit`. Clean-context audit of a whole gate's collected material (a gate-pack): contradictions between independently-correct findings, uncovered seams between zones, re-ranking deltas, a level verdict. Pinned to the maximal available model; drafts and audits, never edits.", "tools": "Read, Grep, Glob, Bash", "body": "{{body:k_auditor}}", "kinds": ["audit"]}]'''

