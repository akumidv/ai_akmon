# Unit table: the model-routing core (tools/model_routing/routing.py; JS mirror
# js/tools/model_routing/routing.mjs, ADR 0020 D01). Data files: tools/model_routing/agents.json
# and gate.json (texts, the agent roster, the gate rules), common/runtime.json (the second-opinion
# argv) and common/markers.json (the throttle markers), all read from the tree under test — the
# Python module opens them beside itself, the JS mouth hands the same documents to the module at
# its entry point. The registry is the run's input, not shared data: a row passes the tree's
# shipped tools/model_routing/registry.json (`$registry`, with any synthetic overlay the row
# names) or a small literal one.
#
# The module is ninety-odd definitions, so this table is generic where the C103 ones are per
# family: a row is `{id, fn, args_json, expected_json}` — `fn` the Python public name, the JS mouth
# calling its camelCase export — plus the world keys probe.py documents above `probe_routing`
# (`files`, `files_parts`, `mtimes`, `modes`, `env`, `setup_json`, `kwargs_json`, `tree`,
# `tree_modes`, `ordered`, `nonroot`) and the argument constructors (`$path`, `$registry`, `$call`,
# `$new`). Answers are JSON: a dataclass an object keyed by its snake_case fields, a tuple an
# array, a path its POSIX string, a raise `{"error": <class>, "message": <first argument>}`.
# Strings come back with `{{dir}}` for the row's scratch directory, `{{body:<agent>}}` for an agent
# body of agents.json and `{{registry_hash}}` for a `$registry` argument's canonical hash (the
# probe's own hashlib oracle computes it, so the hashing stays pinned while a registry edit does
# not move the table). Expected values were derived by running the Python and then read against
# each function's docstring; a row's comment says what it pins when the id does not.
#
# Families (the `id` prefix): `data` — the agents.json/gate.json accessors and the roster; `reg` —
# paths, overlay loading, the canonical hash; `bind` — compute_binding's ladder, corridor and
# semantic fallback; `so` — the second-opinion spec, ladder, command and its refusal texts; `gen` —
# generated agent files, the description wrap and the overlay briefs; `mark` — the two marker
# throttles (suppressed rebind, gate audit) with their file effects; `tx` — the transcript tail
# readers over synthetic JSONL; `ctx` — context fill, the recommended maximum and the pressure
# notice; `art` — config, artifacts, obsolete agents and rebind with their file effects; `stat` —
# the status, rebind and init lines, floor gaps, bound models and the role matrix; `log` — zone
# parsing and the delegation log; `gate` — the C25 item count, floor and request.
#
# Why generic rows rather than families of fields: every answer here is owner-visible text or a
# file a hook writes, so a row pins the whole answer — the text byte for byte, the file tree a call
# leaves — rather than one property of it. The twin traps are pinned where they live: Python
# truthiness of `[]`/`{}`, `str.split()`/`strip()` on Unicode whitespace, `len()` in code points
# (the description wrap), `repr()` of a list or a quoted string inside a message, `type(x).__name__`
# in the brief refusal, `int()` of an environment value (`" 7 "`, `1_000`, Arabic-Indic digits),
# `f"{x:.0%}"` rounding half to even, `json.dumps` escaping in the hash, a dict key a JS object
# would answer by inheritance (`constructor`), and the transcript tail read: block edges, CRLF split
# across them, a lone CR, a multi-byte character cut by a block edge, a BOM, invalid UTF-8.
#
# Deliberate non-pins: a malformed or missing registry/overlay file (the parser's and the OS's
# words are the implementation's, as normalization rule 3 says), `MainTurn` (a type alias, no
# runtime value), a marker exactly at its age-out (it races the clock), and `context_fill_ratio`'s
# float beyond the binary value both languages compute from the same division.

