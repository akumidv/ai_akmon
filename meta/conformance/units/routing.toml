fn = "catalog_aliases"
args_json = '[{"$call": "parse_catalog", "args": ["{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":9},{\"slug\":\"acme-6-sol\",\"visibility\":\"list\",\"priority\":2},{\"slug\":\"zed-6-sol\",\"visibility\":\"list\",\"priority\":2},{\"slug\":\"gpt-6-luna\",\"visibility\":\"list\",\"priority\":null}]}", "codex-models-cache"]}, ["sol", "luna"]]'
expected_json = '{"sol": "acme-6-sol", "luna": "gpt-6-luna"}'

[[case]]
