# --- mark: the two marker throttles and the files they leave ------------------------------------
# Marker names are `akmon-<kind>-<20 hex of sha256(session)>`; `e8bc163c82eee1873328` is "s1".
# The rebind kind folds sha256("<model>\0<warning>")[:16] in: a3f7ce58a7c72a4f is ("opus",
# "⚠ bad brief A"), 5ade6fdfb278f1b9 is ("opus", "⚠ bad brief B").

[[case]]
id = "mark/rebind-first-claims"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", "opus", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
tree_modes = true
expected_json = '{"value": ["⚠ bad brief A"], "tree": {".keep": {"text": "", "mode": "644"}, "akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328": {"text": "", "mode": "600"}}}'

[[case]]
id = "mark/rebind-already-claimed"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", "opus", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": [], "tree": {"akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328": ""}}'

[[case]]
# A new condition claims and releases the session's other rebind markers, not another session's.
id = "mark/rebind-new-condition-releases"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief B", "opus", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = "", "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-0000000000000000000a" = "", "m/akmon-gate-audit-review-3-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": ["⚠ bad brief B"], "tree": {"akmon-gate-audit-review-3-e8bc163c82eee1873328": "", "akmon-suppressed-rebind-5ade6fdfb278f1b9-e8bc163c82eee1873328": "", "akmon-suppressed-rebind-a3f7ce58a7c72a4f-0000000000000000000a": ""}}'

[[case]]
# The condition cleared: the session's rebind markers go, nothing speaks.
id = "mark/rebind-cleared"
fn = "suppressed_rebind_warning"
args_json = '[null, "opus", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": [], "tree": {}}'

[[case]]
# A marker past the day's age-out is reclaimed: the notice speaks again.
id = "mark/rebind-stale-reclaimed"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", "opus", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = "" }
mtimes = { "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = 90000 }
tree = "m"
expected_json = '{"value": ["⚠ bad brief A"], "tree": {"akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328": ""}}'

[[case]]
# No session: repeat, never write a shared marker.
id = "mark/rebind-no-session"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", "opus", null]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
expected_json = '{"value": ["⚠ bad brief A"], "tree": {".keep": ""}}'

[[case]]
id = "mark/rebind-no-session-no-model"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", null, ""]'
expected_json = '[]'

[[case]]
# Without marker_dir the marker lands in the temp dir (TMPDIR is the scratch directory).
id = "mark/rebind-default-dir"
fn = "suppressed_rebind_warning"
args_json = '["⚠ bad brief A", "opus", "s1"]'
tree = ""
expected_json = '{"value": ["⚠ bad brief A"], "tree": {"akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328": ""}}'

[[case]]
# The kind is the role and a digest of the counted material, not its count (C25 review).
id = "mark/gate-kind"
fn = "gate_audit_marker_kind"
args_json = '["## Options\n\n- A\n- B\n", {"$call": "gate_rule_for", "args": ["architect"]}]'
expected_json = '"gate-audit-architect-b939469b575affee"'

[[case]]
# Headings, blank lines and the prose around the sections stay out of the digest: same material, same kind.
id = "mark/gate-kind-same-material"
fn = "gate_audit_marker_kind"
args_json = '["Intro.\n\n### 3 findings\n- a\n\n- b\n- c\n\n## Next\n- q\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '"gate-audit-review-cdc81b42e33453e9"'

[[case]]
id = "mark/gate-section-text"
fn = "gate_section_text"
args_json = '["Intro.\n\n## Findings\n\n- a\n  - detail\n\n### Sub\n\n| x |\n\n## Next\n\n- q\n\n**Findings**\n- b\n", {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = '"- a\n  - detail\n| x |\n- b"'

[[case]]
id = "mark/gate-once-claims"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- a\n- b\n- c\n", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
tree_modes = true
expected_json = '{"value": true, "tree": {".keep": {"text": "", "mode": "644"}, "akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328": {"text": "", "mode": "600"}}}'

[[case]]
id = "mark/gate-once-already"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- a\n- b\n- c\n", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": false, "tree": {"akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328": ""}}'

[[case]]
# Different material is a new gate and is claimed; the session's other markers are kept, so a
# return to material already held (3 → 4 → 3) stays silent.
id = "mark/gate-once-new-material"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- a\n- b\n- c\n- d\n", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328" = "", "m/akmon-gate-audit-architect-b939469b575affee-e8bc163c82eee1873328" = "", "m/akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": true, "tree": {"akmon-gate-audit-architect-b939469b575affee-e8bc163c82eee1873328": "", "akmon-gate-audit-review-03c305fe1d7cffc4-e8bc163c82eee1873328": "", "akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328": "", "akmon-suppressed-rebind-a3f7ce58a7c72a4f-e8bc163c82eee1873328": ""}}'

[[case]]
# The same count over different material is a different gate: held again.
id = "mark/gate-once-same-count-new-material"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- x\n- y\n- z\n", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328" = "" }
tree = "m"
expected_json = '{"value": true, "tree": {"akmon-gate-audit-review-34c59679a71a2495-e8bc163c82eee1873328": "", "akmon-gate-audit-review-cdc81b42e33453e9-e8bc163c82eee1873328": ""}}'

[[case]]
id = "mark/gate-once-no-session"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- a\n", null]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
expected_json = '{"value": true, "tree": {".keep": ""}}'

[[case]]
# The unidentified spelling is no identity either.
id = "mark/gate-once-nosession-literal"
fn = "gate_audit_once"
args_json = '["review", "## Findings\n\n- a\n", "nosession"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
expected_json = '{"value": true, "tree": {".keep": ""}}'

[[case]]
id = "mark/gate-once-no-rule"
fn = "gate_audit_once"
args_json = '["engineer", "## Findings\n\n- a\n", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
tree = "m"
expected_json = '{"value": false, "tree": {".keep": ""}}'

# --- tx: the transcript tail readers over synthetic JSONL ---------------------------------------
# The emoji is written \u-escaped (as json.dumps writes it) unless a row needs its raw bytes.

[[case]]
id = "tx/role-last-declaration-wins"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": [{"type": "text", "text": "\ud83e\udded agent: review \u2014 analysis"}]}}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engineer \u2014 build it"}}', "\n"] }
expected_json = '"engineer"'

[[case]]
id = "tx/role-missing-file"
fn = "active_role"
args_json = '["{{dir}}/missing.jsonl"]'
expected_json = 'null'

[[case]]
id = "tx/role-null-path"
fn = "active_role"
args_json = '[null]'
expected_json = 'null'

[[case]]
id = "tx/role-empty-path"
fn = "active_role"
args_json = '[""]'
expected_json = 'null'

[[case]]
id = "tx/role-directory"
fn = "active_role"
args_json = '["{{dir}}/d"]'
files = { "d/x" = "" }
expected_json = 'null'

[[case]]
id = "tx/role-unreadable"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
nonroot = true
files = { "t.jsonl" = "{\"type\": \"assistant\", \"message\": {\"content\": \"\\ud83e\\udded agent: review\"}}\n" }
modes = { "t.jsonl" = "000" }
expected_json = 'null'

[[case]]
# Only first-position declarations count: whitespace and newlines may precede, nothing else.
id = "tx/role-first-position-only"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "  \n\ud83e\udded agent: review \u2014 analysis\nLater: `\ud83e\udded agent: engineer \u2014 example`"}}', "\n",
  '{"type": "assistant", "message": {"content": "Quoted: `\ud83e\udded agent: engineer \u2014 code/tests`"}}', "\n",
  '{"type": "assistant", "message": {"content": "- **Format:** put `\ud83e\udded agent: engineer` first"}}', "\n",
  '{"type": "assistant", "message": {"content": "```text\n\ud83e\udded agent: architect\n```"}}', "\n",
  '{"type": "assistant", "message": {"content": "> \ud83e\udded agent: engineer \u2014 quoted"}}', "\n",
] }
expected_json = '"review"'

[[case]]
# The text blocks of a list join with one space; a non-text block before them is skipped, so a
# declaration in the first text block is still first; one in a later block is not.
id = "tx/role-blocks"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": [{"type": "tool_use", "text": "x"}, {"type": "text", "text": "\ud83e\udded agent: Learn_2-x"}]}}', "\n",
  '{"type": "assistant", "message": {"content": [{"type": "text", "text": "intro"}, {"type": "text", "text": "\ud83e\udded agent: engineer"}]}}', "\n",
] }
expected_json = '"learn_2-x"'

[[case]]
# Case-folded; the name is ASCII-word only (a Cyrillic letter ends it); no space is needed.
id = "tx/role-ascii-name"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭\tagent:REv\u0435iew"}}', "\n"] }
expected_json = '"rev"'

[[case]]
# A non-ASCII space before the marker is not whitespace to the ASCII class: no declaration.
id = "tx/role-nbsp-prefix"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n", '{"type": "assistant", "message": {"content": "\u00a0\ud83e\udded agent: engineer"}}', "\n"] }
expected_json = '"review"'

[[case]]
# Sidechain turns, user turns, a non-object line, a malformed line and a torn last line are
# skipped; the raw (unescaped) emoji reads the same as the escaped one.
id = "tx/role-skips"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\n",
  '{"type": "assistant", "isSidechain": true, "message": {"content": "\ud83e\udded agent: engineer"}}', "\n",
  '{"type": "user", "message": {"content": "\ud83e\udded agent: engineer"}}', "\n",
  '["agent:", {"type": "assistant"}]', "\n",
  'not json agent: engineer', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engin',
] }
expected_json = '"review"'

[[case]]
id = "tx/role-sidechain-only"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "isSidechain": true, "message": {"content": "\ud83e\udded agent: review"}}', "\n"] }
expected_json = 'null'

[[case]]
# A lone CR separates lines as a forward text read does; CRLF too.
id = "tx/role-lone-cr"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\r", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: architect"}}', "\r\n", '{"type": "user"}', "\r"] }
expected_json = '"architect"'

[[case]]
# A line that is not UTF-8 is skipped, not fatal: the earlier declaration answers.
id = "tx/role-invalid-utf8-line"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engineer ', { hex = "ff" }, '"}}', "\n"] }
expected_json = '"review"'

[[case]]
# A BOM before the only line makes it unreadable JSON (the codec is utf-8, not utf-8-sig).
id = "tx/role-bom"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [{ hex = "efbbbf" }, '{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n"] }
expected_json = 'null'

[[case]]
# One declaration line longer than two 64 KiB blocks is assembled across them (a line before it
# puts a break in the earliest block, so the carried pieces join the line that break ends).
id = "tx/role-line-spans-blocks"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: release ', { repeat = "x", times = 140000 }, '"}}', "\n", '{"type": "user"}', "\n"] }
expected_json = '"release"'

[[case]]
# The block edge falls between the two bytes of an "é" of the declaring line; the user line
# before it puts a break in the earlier block, so the carry must join the right piece.
id = "tx/role-multibyte-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type": "assistant", "message": {"content": "🧭 agent: engineer ', { repeat = "é", times = 40 }, '"}}', "\n", '{"type":"user","pad":"', { repeat = "y", times = 65428 }, '"}', "\n"] }
expected_json = '"engineer"'

[[case]]
# The block edge cuts the raw compass emoji itself, between its second and third byte.
id = "tx/role-emoji-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type":"assistant","message":{"content":"🧭 agent: engineer"}}', "\n", '{"type":"user","pad":"', { repeat = "y", times = 65489 }, '"}', "\n"] }
expected_json = '"engineer"'

[[case]]
# A CRLF split by the block edge (CR closes the earlier block, LF opens the later one) is one
# break: the later, padded declaration answers.
id = "tx/role-crlf-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\r\n", '{"type": "assistant", "message": {"content": "🧭 agent: learn ', { repeat = "z", times = 65466 }, '"}}', "\r\n"] }
expected_json = '"learn"'

[[case]]
# The same file with the later line a sidechain: the earlier line, ended by the split CRLF,
# still reads whole.
id = "tx/role-crlf-split-earlier-line"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\r\n", '{"type": "assistant", "isSidechain": 1, "message": {"content": "🧭 agent: learn ', { repeat = "z", times = 65448 }, '"}}', "\r\n"] }
expected_json = '"review"'

[[case]]
# ADR 0027/D03: `🧭 role:` is the declaration; every tx/role-* case above spells it with the
# `🧭 agent:` alias, which is read the same way for one release. The cases below pin the new
# spelling, and the two spellings together.
id = "tx/role-new-form"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded role: Review \u2014 analysis"}}', "\n"] }
expected_json = '"review"'

[[case]]
# The last qualifying declaration wins whichever spelling it uses.
id = "tx/role-new-form-and-alias-last-wins"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded role: engineer"}}', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded agent: architect"}}', "\n",
] }
expected_json = '"architect"'

[[case]]
id = "tx/role-new-form-alias-then-role"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "\ud83e\udded agent: architect"}}', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded role: Engineer"}}', "\n",
] }
expected_json = '"engineer"'

[[case]]
# Sidechain turns, user turns, a non-object line, a malformed line and a torn last line are
# skipped under the new spelling too.
id = "tx/role-new-form-skips"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "🧭 role: review"}}', "\n",
  '{"type": "assistant", "isSidechain": true, "message": {"content": "\ud83e\udded role: engineer"}}', "\n",
  '{"type": "user", "message": {"content": "\ud83e\udded role: engineer"}}', "\n",
  '["role:", {"type": "assistant"}]', "\n",
  'not json role: engineer', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded role: engin',
] }
expected_json = '"review"'

[[case]]
# No space after the colon and a tab before the keyword; the name stops at the first non-ASCII letter.
id = "tx/role-new-form-tab-no-space"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭\trole:REv\u0435iew"}}', "\n"] }
expected_json = '"rev"'

[[case]]
# The CRLF block-edge case of tx/role-crlf-split-at-edge, spelled `role:` (one byte shorter, so one more pad byte).
id = "tx/role-new-form-crlf-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭 role: review"}}', "\r\n", '{"type": "assistant", "message": {"content": "🧭 role: learn ', { repeat = "z", times = 65467 }, '"}}', "\r\n"] }
expected_json = '"learn"'

[[case]]
id = "tx/turn-last-main-chain"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "user", "message": {"role": "user"}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "claude-fable-5", "usage": {"input_tokens": 1}}}', "\n",
  '{"type": "assistant", "isSidechain": true, "message": {"model": "claude-haiku-4-5"}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "claude-opus-4-8", "usage": {"input_tokens": 5, "output_tokens": 2}}}', "\n",
] }
expected_json = '["claude-opus-4-8", {"input_tokens": 5, "output_tokens": 2}]'

[[case]]
# A synthetic model, an empty one, a non-string one are skipped; a non-object usage is null.
id = "tx/turn-skips-synthetic"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"model": "claude-fable-5", "usage": [1, 2]}}', "\n",
  '{"type": "assistant", "message": {"model": 7}}', "\n",
  '{"type": "assistant", "message": {"model": ""}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "<synthetic>"}}', "\n",
] }
expected_json = '["claude-fable-5", null]'

[[case]]
# The pre-filter is the literal bytes "model" in quotes: a key spelled with a JSON escape is
# valid JSON the reader never parses.
id = "tx/turn-escaped-key-unseen"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-opus-4-8"}}', "\n", '{"type": "assistant", "message": {"\u006dodel": "claude-haiku-4-5"}}', "\n"] }
expected_json = '["claude-opus-4-8", null]'

[[case]]
id = "tx/turn-empty-file"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files = { "t.jsonl" = "" }
expected_json = '[null, null]'

[[case]]
id = "tx/turn-junk"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files = { "t.jsonl" = "not json but has \"model\" text\n" }
expected_json = '[null, null]'

[[case]]
id = "tx/detect-orchestrator"
fn = "detect_orchestrator"
args_json = '["{{dir}}/t.jsonl", ["haiku", "sonnet", "opus", "fable"]]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5"}}', "\n", '{"type": "assistant", "isSidechain": true, "message": {"model": "claude-haiku-4-5"}}', "\n"] }
expected_json = '"fable"'

[[case]]
# A turn already read is used, and the transcript is not read at all.
id = "tx/detect-orchestrator-turn"
fn = "detect_orchestrator"
args_json = '["{{dir}}/missing.jsonl", ["haiku", "opus"]]'
kwargs_json = '{"turn": ["claude-OPUS-4-8", null]}'
expected_json = '"opus"'

[[case]]
id = "tx/detect-orchestrator-unknown"
fn = "detect_orchestrator"
args_json = '[null, ["haiku"]]'
kwargs_json = '{"turn": ["gpt-5", null]}'
expected_json = 'null'

[[case]]
id = "tx/fill-ratio"
fn = "context_fill_ratio"
args_json = '[{"$registry": {"set": {"context_pressure": {"recommended_max": 100000}}}}, "{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5", "usage": {"input_tokens": 4, "cache_read_input_tokens": 84996, "cache_creation_input_tokens": 1000, "output_tokens": 500}}}', "\n"] }
expected_json = '0.86'

[[case]]
id = "tx/fill-ratio-malformed"
fn = "context_fill_ratio"
args_json = '[{"$registry": {}}, "{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "m", "usage": {"input_tokens": 200000, "cache_read_input_tokens": "bad", "cache_creation_input_tokens": null}}}', "\n"] }
expected_json = 'null'

[[case]]
# The notice reads the transcript itself when no turn is given (86% of 200k: the info level).
id = "tx/pressure-from-transcript"
fn = "context_pressure_notice"
args_json = '[{"$registry": {}}, "{{dir}}/t.jsonl", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5", "usage": {"input_tokens": 4, "cache_read_input_tokens": 170996, "cache_creation_input_tokens": 1000}}}', "\n"] }
tree = "m"
expected_json = '{"value": ["ℹ context pressure: ~86% of the recommended 200k budget — /compact"], "tree": {".keep": "", "akmon-context-pressure-s1": "0"}}'

