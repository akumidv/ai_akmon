args_json = '[{"$registry": {}}, {"$call": "gate_rule_for", "args": ["architect"]}]'
expected_json = '2'

[[case]]
id = "gate/threshold-absent"
fn = "gate_threshold"
args_json = '[{"gate_triggers": {}}, {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = 'null'

[[case]]
id = "gate/threshold-zero"
fn = "gate_threshold"
args_json = '[{"gate_triggers": {"review_min_findings": 0}}, {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = 'null'

[[case]]
id = "gate/threshold-bool"
fn = "gate_threshold"
args_json = '[{"gate_triggers": {"review_min_findings": true}}, {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = 'null'

[[case]]
id = "gate/threshold-float"
fn = "gate_threshold"
args_json = '[{"gate_triggers": {"review_min_findings": 3.0}}, {"$call": "gate_rule_for", "args": ["review"]}]'
expected_json = 'null'

[[case]]
id = "gate/request-at-floor"
fn = "gate_audit_request"
args_json = '[{"gate_triggers": {"review_min_findings": 3}}, {"binding": {"auditor": "big"}, "available": ["small", "big"]}, "review", "## Findings\n\n- a\n- b\n- c\n"]'
expected_json = '"[akmon gate] This turn carries 3 findings as the review role, at or above the `review_min_findings` floor of 3 — review-flow step 4 (Calibrate) routes an `audit` pass here. Before handing off: either delegate `k_auditor` (model=big) over the gate-pack (`tools/model_routing/gate_pack.py`) and fold its verdict in, or state in one line that you are skipping the audit and why. The floor is advisory; passing it in silence is not."'

