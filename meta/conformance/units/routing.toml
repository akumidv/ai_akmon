[[case]]
# An overlay path that is a directory is no overlay.
id = "reg/load-overlay-is-dir"
fn = "load_registry"
args_json = '[{"$path": "{{dir}}/akmon"}, {"$path": "{{dir}}"}]'
files = { "akmon/tools/model_routing/registry.json" = '{"a": 1}', "_aitna/model-routing.json/inner" = "x" }
expected_json = '{"a": 1}'

[[case]]
id = "reg/hash-empty"
fn = "registry_hash"
args_json = '[{}]'
expected_json = '"44136fa355b3678a"'

[[case]]
# The canonical form: sorted keys at every depth, compact separators, ASCII escapes (an astral
# character as a surrogate pair), a float as Python spells it.
id = "reg/hash-canonical"
fn = "registry_hash"
args_json = '[{"b": {"z": 1, "a": [2.5, "é", "🧭", null, true]}, "a": "x\"y"}]'
