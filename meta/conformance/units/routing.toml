# --- tx: the transcript tail readers over synthetic JSONL ---------------------------------------
# The emoji is written \u-escaped (as json.dumps writes it) unless a row needs its raw bytes.

[[case]]
id = "tx/role-last-declaration-wins"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": [{"type": "text", "text": "\ud83e\udded agent: review \u2014 analysis"}]}}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engineer \u2014 build it"}}', "\n"] }
expected_json = '"engineer"'

[[case]]
id = "tx/role-missing-file"
fn = "active_role"
args_json = '["{{dir}}/missing.jsonl"]'
expected_json = 'null'

[[case]]
id = "tx/role-null-path"
fn = "active_role"
args_json = '[null]'
expected_json = 'null'

[[case]]
id = "tx/role-empty-path"
fn = "active_role"
args_json = '[""]'
expected_json = 'null'

[[case]]
id = "tx/role-directory"
fn = "active_role"
args_json = '["{{dir}}/d"]'
files = { "d/x" = "" }
expected_json = 'null'

[[case]]
id = "tx/role-unreadable"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
nonroot = true
files = { "t.jsonl" = "{\"type\": \"assistant\", \"message\": {\"content\": \"\\ud83e\\udded agent: review\"}}\n" }
modes = { "t.jsonl" = "000" }
expected_json = 'null'

[[case]]
# Only first-position declarations count: whitespace and newlines may precede, nothing else.
id = "tx/role-first-position-only"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "  \n\ud83e\udded agent: review \u2014 analysis\nLater: `\ud83e\udded agent: engineer \u2014 example`"}}', "\n",
  '{"type": "assistant", "message": {"content": "Quoted: `\ud83e\udded agent: engineer \u2014 code/tests`"}}', "\n",
  '{"type": "assistant", "message": {"content": "- **Format:** put `\ud83e\udded agent: engineer` first"}}', "\n",
  '{"type": "assistant", "message": {"content": "```text\n\ud83e\udded agent: architect\n```"}}', "\n",
  '{"type": "assistant", "message": {"content": "> \ud83e\udded agent: engineer \u2014 quoted"}}', "\n",
] }
expected_json = '"review"'

[[case]]
# The text blocks of a list join with one space; a non-text block before them is skipped, so a
# declaration in the first text block is still first; one in a later block is not.
id = "tx/role-blocks"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": [{"type": "tool_use", "text": "x"}, {"type": "text", "text": "\ud83e\udded agent: Learn_2-x"}]}}', "\n",
  '{"type": "assistant", "message": {"content": [{"type": "text", "text": "intro"}, {"type": "text", "text": "\ud83e\udded agent: engineer"}]}}', "\n",
] }
expected_json = '"learn_2-x"'

[[case]]
# Case-folded; the name is ASCII-word only (a Cyrillic letter ends it); no space is needed.
id = "tx/role-ascii-name"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭\tagent:REv\u0435iew"}}', "\n"] }
expected_json = '"rev"'

[[case]]
# A non-ASCII space before the marker is not whitespace to the ASCII class: no declaration.
id = "tx/role-nbsp-prefix"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n", '{"type": "assistant", "message": {"content": "\u00a0\ud83e\udded agent: engineer"}}', "\n"] }
expected_json = '"review"'

[[case]]
# Sidechain turns, user turns, a non-object line, a malformed line and a torn last line are
# skipped; the raw (unescaped) emoji reads the same as the escaped one.
id = "tx/role-skips"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\n",
  '{"type": "assistant", "isSidechain": true, "message": {"content": "\ud83e\udded agent: engineer"}}', "\n",
  '{"type": "user", "message": {"content": "\ud83e\udded agent: engineer"}}', "\n",
  '["agent:", {"type": "assistant"}]', "\n",
  'not json agent: engineer', "\n",
  '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engin',
] }
expected_json = '"review"'

[[case]]
id = "tx/role-sidechain-only"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "isSidechain": true, "message": {"content": "\ud83e\udded agent: review"}}', "\n"] }
expected_json = 'null'

[[case]]
# A lone CR separates lines as a forward text read does; CRLF too.
id = "tx/role-lone-cr"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\r", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: architect"}}', "\r\n", '{"type": "user"}', "\r"] }
expected_json = '"architect"'

[[case]]
# A line that is not UTF-8 is skipped, not fatal: the earlier declaration answers.
id = "tx/role-invalid-utf8-line"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: engineer ', { hex = "ff" }, '"}}', "\n"] }
expected_json = '"review"'

[[case]]
# A BOM before the only line makes it unreadable JSON (the codec is utf-8, not utf-8-sig).
id = "tx/role-bom"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [{ hex = "efbbbf" }, '{"type": "assistant", "message": {"content": "\ud83e\udded agent: review"}}', "\n"] }
expected_json = 'null'

[[case]]
# One declaration line longer than two 64 KiB blocks is assembled across them (a line before it
# puts a break in the earliest block, so the carried pieces join the line that break ends).
id = "tx/role-line-spans-blocks"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type": "assistant", "message": {"content": "\ud83e\udded agent: release ', { repeat = "x", times = 140000 }, '"}}', "\n", '{"type": "user"}', "\n"] }
expected_json = '"release"'

[[case]]
# The block edge falls between the two bytes of an "é" of the declaring line; the user line
# before it puts a break in the earlier block, so the carry must join the right piece.
id = "tx/role-multibyte-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type": "assistant", "message": {"content": "🧭 agent: engineer ', { repeat = "é", times = 40 }, '"}}', "\n", '{"type":"user","pad":"', { repeat = "y", times = 65428 }, '"}', "\n"] }
expected_json = '"engineer"'

[[case]]
# The block edge cuts the raw compass emoji itself, between its second and third byte.
id = "tx/role-emoji-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "user"}', "\n", '{"type":"assistant","message":{"content":"🧭 agent: engineer"}}', "\n", '{"type":"user","pad":"', { repeat = "y", times = 65489 }, '"}', "\n"] }
expected_json = '"engineer"'

[[case]]
# A CRLF split by the block edge (CR closes the earlier block, LF opens the later one) is one
# break: the later, padded declaration answers.
id = "tx/role-crlf-split-at-edge"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\r\n", '{"type": "assistant", "message": {"content": "🧭 agent: learn ', { repeat = "z", times = 65466 }, '"}}', "\r\n"] }
expected_json = '"learn"'

[[case]]
# The same file with the later line a sidechain: the earlier line, ended by the split CRLF,
# still reads whole.
id = "tx/role-crlf-split-earlier-line"
fn = "active_role"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"content": "🧭 agent: review"}}', "\r\n", '{"type": "assistant", "isSidechain": 1, "message": {"content": "🧭 agent: learn ', { repeat = "z", times = 65448 }, '"}}', "\r\n"] }
expected_json = '"review"'

[[case]]
id = "tx/turn-last-main-chain"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "user", "message": {"role": "user"}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "claude-fable-5", "usage": {"input_tokens": 1}}}', "\n",
  '{"type": "assistant", "isSidechain": true, "message": {"model": "claude-haiku-4-5"}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "claude-opus-4-8", "usage": {"input_tokens": 5, "output_tokens": 2}}}', "\n",
] }
expected_json = '["claude-opus-4-8", {"input_tokens": 5, "output_tokens": 2}]'

[[case]]
# A synthetic model, an empty one, a non-string one are skipped; a non-object usage is null.
id = "tx/turn-skips-synthetic"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = [
  '{"type": "assistant", "message": {"model": "claude-fable-5", "usage": [1, 2]}}', "\n",
  '{"type": "assistant", "message": {"model": 7}}', "\n",
  '{"type": "assistant", "message": {"model": ""}}', "\n",
  '{"type": "assistant", "isSidechain": false, "message": {"model": "<synthetic>"}}', "\n",
] }
expected_json = '["claude-fable-5", null]'

[[case]]
# The pre-filter is the literal bytes "model" in quotes: a key spelled with a JSON escape is
# valid JSON the reader never parses.
id = "tx/turn-escaped-key-unseen"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-opus-4-8"}}', "\n", '{"type": "assistant", "message": {"\u006dodel": "claude-haiku-4-5"}}', "\n"] }
expected_json = '["claude-opus-4-8", null]'

[[case]]
id = "tx/turn-empty-file"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files = { "t.jsonl" = "" }
expected_json = '[null, null]'

[[case]]
id = "tx/turn-junk"
fn = "last_main_turn"
args_json = '["{{dir}}/t.jsonl"]'
files = { "t.jsonl" = "not json but has \"model\" text\n" }
expected_json = '[null, null]'

[[case]]
id = "tx/detect-orchestrator"
fn = "detect_orchestrator"
args_json = '["{{dir}}/t.jsonl", ["haiku", "sonnet", "opus", "fable"]]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5"}}', "\n", '{"type": "assistant", "isSidechain": true, "message": {"model": "claude-haiku-4-5"}}', "\n"] }
expected_json = '"fable"'

[[case]]
# A turn already read is used, and the transcript is not read at all.
id = "tx/detect-orchestrator-turn"
fn = "detect_orchestrator"
args_json = '["{{dir}}/missing.jsonl", ["haiku", "opus"]]'
kwargs_json = '{"turn": ["claude-OPUS-4-8", null]}'
expected_json = '"opus"'

[[case]]
id = "tx/detect-orchestrator-unknown"
fn = "detect_orchestrator"
args_json = '[null, ["haiku"]]'
kwargs_json = '{"turn": ["gpt-5", null]}'
expected_json = 'null'

[[case]]
id = "tx/fill-ratio"
fn = "context_fill_ratio"
args_json = '[{"$registry": {"set": {"context_pressure": {"recommended_max": 100000}}}}, "{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5", "usage": {"input_tokens": 4, "cache_read_input_tokens": 84996, "cache_creation_input_tokens": 1000, "output_tokens": 500}}}', "\n"] }
expected_json = '0.86'

[[case]]
id = "tx/fill-ratio-malformed"
fn = "context_fill_ratio"
args_json = '[{"$registry": {}}, "{{dir}}/t.jsonl"]'
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "m", "usage": {"input_tokens": 200000, "cache_read_input_tokens": "bad", "cache_creation_input_tokens": null}}}', "\n"] }
expected_json = 'null'

[[case]]
# The notice reads the transcript itself when no turn is given (86% of 200k: the info level).
id = "tx/pressure-from-transcript"
fn = "context_pressure_notice"
args_json = '[{"$registry": {}}, "{{dir}}/t.jsonl", "s1"]'
kwargs_json = '{"marker_dir": {"$path": "{{dir}}/m"}}'
files = { "m/.keep" = "" }
files_parts = { "t.jsonl" = ['{"type": "assistant", "message": {"model": "claude-fable-5", "usage": {"input_tokens": 4, "cache_read_input_tokens": 170996, "cache_creation_input_tokens": 1000}}}', "\n"] }
tree = "m"
expected_json = '{"value": ["ℹ context pressure: ~86% of the recommended 200k budget — /compact"], "tree": {".keep": "", "akmon-context-pressure-s1": "0"}}'

