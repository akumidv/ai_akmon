fn = "catalog_aliases"
args_json = '[{"$call": "parse_catalog", "args": ["{\"client_version\":\"0.164.0\",\"models\":[{\"slug\":\"gpt-6-sol\",\"visibility\":\"list\",\"priority\":0},{\"slug\":\"gpt-6.0.1-sol\",\"visibility\":\"list\",\"priority\":5}]}", "codex-models-cache"]}, ["sol"]]'
expected_json = '{"sol": "gpt-6.0.1-sol"}'

