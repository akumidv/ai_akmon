# Unit table: the shared finding envelope (common/findings.py; JS mirror js/common/findings.mjs,
# ADR 0020 D01, C105). One data file, read from the tree under test: common/findings.json (the
# severity vocabulary, the retired-code record, the render skeleton). The Python module opens it
# beside itself; the JS module reads it at `../../common/findings.json` of its own file.
#
# Why this table exists: every answer here is the text an owner reads on a failing check, and the
# two implementations reach it through different stdlibs. Python's `repr()` quotes a string,
# escapes a control character and writes `None`/`True`/`1.0` where JavaScript writes `null`/`true`/
# `1`; `str.strip()` strips every Unicode space (`\x1c`-`\x1f`, `\x85`, `\xa0`, `\u3000`) and a
# JS `trim()` strips others (a BOM); `str.splitlines` names ten line separators where a JS regex
# has to be told each; `\s` is Unicode in Python until `re.ASCII` (the Python side is `re.ASCII`, by
# decision, so a no-break space after a full stop is text, not a boundary, in both);
# `frozenset` answers sorted here. A JS port gets none of this for free. The table is the spec, held
# to the Python reference row by row: `runner.py --impl python` runs it as scenario `units/findings`
# in the conformance leg of `meta/self_ci.py`, and every expected value was read against the
# docstrings.
#
# The mouth is the generic one of `routing.toml` (the row format is the block comment above
# `probe_routing` in probe.py): a row names a public function, its JSON arguments and kwargs.
# `Finding` is called by name with its five fields (and `data`, a plain object standing for the
# parsed findings.json, where a row proves the data is honoured, not the file); inside `args_json`
# `{"$new": "Finding", "fields": {...}}` builds one. A construction that raises answers
# `{"error": <class>, "message": <first argument>}`; one that does not answers the five fields.
# `print_findings` (stdout) and `Finding.to_dict` (a method) are not reachable by the mouth: the
# node:test and the pytest suite pin them.
#
# Families (the `id` prefix): `vocab` -- severities and retired codes read from the data;
# `severity`, `code`, `message`, `target`, `fix` -- the five validations, each with the repr of the
# offending value in the message; `order` -- which check speaks first; `data` -- a data object
# passed in place of the file; `line-safe` -- every separator escaped, nothing else; `render` -- the
# canonical line, with and without a target, the skeleton from data, fill that is not re-scanned;
# `exit` -- the severity-by-strict matrix.
#
# Deliberate non-pins: the TypeError text of a missing or unexpected `Finding` argument (a typed
# contract, not a behavior), the `repr()` of a lone surrogate (JSON cannot carry one), a
# `findings.json` that is missing or broken (jsondata owns that), `retired_codes()` of the shipped
# file (appending a retired code is process-owned: a code is spent forever, so the row below pins the
# one that is, and the data rows pin the mechanism).

# --- vocab: the data file's vocabulary, as the module reads it ---

[[case]]
id = "vocab/severities"
fn = "severities"
args_json = '[]'
expected_json = '["ok", "warn", "error"]'

[[case]]
id = "vocab/retired-codes-data"
fn = "retired_codes"
args_json = '[{"retired_codes": ["b.c", "a.b"], "severities": ["ok"]}]'
expected_json = '["a.b", "b.c"]'

[[case]]
id = "vocab/retired-codes-empty"
fn = "retired_codes"
args_json = '[{"retired_codes": []}]'
expected_json = '[]'

[[case]]
id = "vocab/severities-data"
fn = "severities"
args_json = '[{"severities": ["x", "y", "z"], "retired_codes": []}]'
expected_json = '["x", "y", "z"]'

[[case]]
id = "vocab/shipped-retired-code-refused"
fn = "Finding"
kwargs_json = '{"severity": "ok", "code": "hooks.package-mode", "message": "m", "target": "", "fix": "Do it"}'
expected_json = "{\"error\": \"ValueError\", \"message\": \"code 'hooks.package-mode' is retired and must not be reused by a live check\"}"

