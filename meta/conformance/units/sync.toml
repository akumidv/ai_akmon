args_json = '[[{"hooks": [{"type": "command", "command": "p"}]}, {"hooks": [{"type": "command", "command": "q"}]}], [{"hooks": [{"type": "command", "command": "q"}]}, {"hooks": [{"type": "command", "command": "r"}]}]]'
