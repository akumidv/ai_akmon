args_json = '[[{"hooks": [{"command": 5}]}, {"hooks": [{"command": null}]}], [{"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]]'
expected_json = '[{"hooks": [{"command": 5}]}, {"hooks": [{"command": null}]}, {"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]'

[[case]]
id = "merge/custom-root-stale"
fn = "_merge_hook_entries"
args_json = '[[{"hooks": [{"type": "command", "command": "python3 \"$CLAUDE_PROJECT_DIR/tools/ai/akmon/hooks/a.py\""}]}, {"matcher": "Bash", "hooks": [{"type": "command", "command": "echo mine"}]}], [{"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]]'
env = { "AITNA_ROOT" = "tools/ai" }
expected_json = '[{"matcher": "Bash", "hooks": [{"type": "command", "command": "echo mine"}]}, {"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]'

