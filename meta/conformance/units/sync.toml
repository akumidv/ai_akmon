args_json = '[[{"matcher": "Bash", "hooks": [{"type": "command", "command": "echo mine"}]}, {"hooks": [{"type": "command", "command": "b"}]}, {"matcher": "Bash", "hooks": [{"type": "command", "command": "\"$CLAUDE_PROJECT_DIR/.venv/bin/akmon\" hook git-commit-guard"}]}, {"hooks": [{"type": "command", "command": "c"}]}], [{"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]]'
expected_json = '[{"matcher": "Bash", "hooks": [{"type": "command", "command": "echo mine"}]}, {"hooks": [{"type": "command", "command": "b"}]}, {"hooks": [{"type": "command", "command": "c"}]}, {"matcher": "Bash", "hooks": [{"type": "command", "command": "node \"$CLAUDE_PROJECT_DIR/node_modules/akmon/js/hooks/git-commit-guard.mjs\""}]}]'

[[case]]
