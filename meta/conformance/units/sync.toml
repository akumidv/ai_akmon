# Unit table: the pure helpers of `sync` (bin/sync.py; JS mirror js/bin/sync.mjs, ADR 0020 D01, C105).
#
# Why this table exists: `sync` writes the bytes of a committed file, and the helpers below decide those
# bytes through text the two stdlibs handle differently. Python's `str.splitlines()` breaks on `\r`,
# `\v`, `\f`, `\x1c`-`\x1e`, `\x85`, U+2028 and U+2029 and `str.strip()` trims the Unicode `isspace` set
# (U+00A0 and U+3000 yes, U+FEFF and U+200B no, `\x1c`-`\x1f` yes) -- neither is JavaScript's `\s` or
# `trim`; `re` under MULTILINE|DOTALL puts `^` and `$` at a `\n` only (a U+2028, a `\x0b` or a lone `\r`
# is not a line start) and lets `.` cross it; `re.escape` and `findall` answer for a dev-layer root such
# as `a.b+c`; `tomllib` refuses a byte-order mark where the vendored parser folds it in, and a table
# that is a date, an array or a string is not a table; `sorted()` orders names by code point. A JS port
# gets none of this for free. The table is the spec, held to the Python reference row by row:
# `runner.py --impl python` runs it as scenario `units/sync` in the conformance leg of
# `meta/self_ci.py`, and every expected value was read against the function's docstring.
#
# The mouth is the generic one of `routing.toml` (the row format is the block comment above
# `probe_routing` in probe.py): a row is `{id, fn, args_json, expected_json}` plus world keys. What
# this table adds: `fn` names the Python function, a private one included (`_upsert_toml_key`); the JS
# mouth drops the underscore and calls the camelCase export of js/bin/sync.mjs, and hands it
# `readSyncData()` (the bundle of bin/sync.json, common/materialization.json and common/findings.json)
# as the FIRST argument of the exports that read a data file -- the Python takes `data` last and
# optional, so a row never passes it. `$path` arguments are the string on the JS side. Every row runs
# in its own scratch directory (`{{dir}}`), and the project it describes is that directory: the
# `files` world key lays out `AGENTS.md`, the record and the ruff configurations, `files_parts` gives
# the bytes TOML cannot spell, `env` sets AITNA_ROOT where a row relocates the dev layer.
#
# The worlds are package-mode projects (`mount = "package"` in `<AITNA_ROOT>/.akmon.toml`) unless the
# row says otherwise, because that is the mode the JS sync serves (ADR 0020 D02); a mounted-prefix row
# (`imported/no-record-*`) builds no `<AITNA_ROOT>/akmon`, since the JS side never consults a mount
# and the Python side would. The standard tree the files are checked against is the tree under test.
#
# Families (the `id` prefix): `upsert` -- _upsert_toml_key, the comment-preserving edit of the record
# (the key in place, before the first section, at the end; every line separator and every Unicode
# space); `frontmatter` -- _skill_frontmatter_block, the lines a skill stub copies; `imported` --
# imported_standard_files over a world: the fenced-block and inline-code scan that finds the
# `@`-imports (fences of both kinds, unclosed, indented, mid-line, with trailing text; CRLF, lone CR,
# U+2028, VT, FF, NEL as non-lines; inline spans), the plan errors with the line to write, the ruff
# `extend` origins, the dev-layer root in the pattern, the sort; `ruff-extends` -- ruff_extends over
# the three configuration files and the TOML shapes a project can hold; `moved-imports` -- the shipped
# list; `akmon-entry` -- _is_akmon_entry, which entries of settings.json are sync's to replace;
# `merge` -- _merge_hook_entries, the per-event merge that keeps the user's hooks.
#
# Deliberate non-pins, all of them `node:test` instead (js/bin/sync.test.mjs): the wiring and tree
# spellings of Node mode, `packagePinStatus`, the refusal of a record that is not Node package mode,
# the plan and the files `apply` writes and deletes (a world with a project root and a command to
# run: the differential run of C105 compares those against the Python), and the mounted-tree branch
# of `standard_tree_root`.

[[case]]
id = "upsert/empty"
fn = "_upsert_toml_key"
args_json = '["", "mount", "package"]'
expected_json = '"mount = \"package\"\n"'

