expected_json = '"{{dir}}/proj/sub"'

[[case]]
id = "root/nested-projects-nearest-wins"
fn = "project_root"
args_json = '[{"cwd": "{{dir}}/proj/inner/sub"}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "", "proj/inner/AGENTS.md" = "", "proj/inner/_aitna/.akmon.toml" = "", "proj/inner/sub/x" = "" }
expected_json = '"{{dir}}/proj/inner"'

[[case]]
id = "root/missing-cwd-key"
fn = "project_root"
args_json = '[{}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/missing-cwd-key-other-keys"
fn = "project_root"
args_json = '[{"tool_name": "Edit", "session_id": "s"}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-null"
fn = "project_root"
args_json = '[{"cwd": null}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-empty"
fn = "project_root"
args_json = '[{"cwd": ""}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-number"
fn = "project_root"
args_json = '[{"cwd": 5}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-zero"
fn = "project_root"
args_json = '[{"cwd": 0}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-true"
fn = "project_root"
args_json = '[{"cwd": true}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-list"
fn = "project_root"
args_json = '[{"cwd": ["{{dir}}/proj"]}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-dict"
fn = "project_root"
args_json = '[{"cwd": {"path": "{{dir}}/proj"}}]'
files = { "proj/AGENTS.md" = "", "proj/_aitna/.akmon.toml" = "", "proj/sub/x" = "" }
cwd = "proj/sub"
expected_json = '"{{dir}}/proj"'

[[case]]
id = "root/cwd-missing-and-no-project"
fn = "project_root"
args_json = '[{}]'
files = { "plain/x" = "" }
cwd = "plain"
expected_json = '"{{dir}}/plain"'

[[case]]
id = "root/cwd-has-nul"
fn = "project_root"
args_json = '[{"cwd": "{{dir}}/pro\u0000j"}]'
class_only = true
expected_json = '{"error": "ValueError"}'

[[case]]
id = "root/cwd-has-lone-surrogate"
fn = "project_root"
args_json = '[{"cwd": "{{dir}}/pro\ud800j"}]'
class_only = true
expected_json = '{"error": "UnicodeEncodeError"}'

[[case]]
id = "root/cwd-unicode"
fn = "project_root"
args_json = '[{"cwd": "{{dir}}/pröj/süb"}]'
files = { "pröj/AGENTS.md" = "", "pröj/_aitna/.akmon.toml" = "", "pröj/süb/x" = "" }
expected_json = '"{{dir}}/pröj"'

[[case]]
id = "root/payload-is-a-list"
fn = "project_root"
args_json = '[[]]'
class_only = true
expected_json = '{"error": "AttributeError"}'

[[case]]
id = "root/payload-is-a-string"
fn = "project_root"
args_json = '["x"]'
class_only = true
expected_json = '{"error": "AttributeError"}'

[[case]]
id = "root/payload-is-a-number"
fn = "project_root"
args_json = '[5]'
class_only = true
expected_json = '{"error": "AttributeError"}'

[[case]]
id = "root/payload-is-null"
fn = "project_root"
args_json = '[null]'
class_only = true
expected_json = '{"error": "AttributeError"}'
