# --- render: the one JSON document Claude Code reads (json.dumps defaults: ', ' and ': ', ASCII only) ----
# hookSpecificOutput carries the event, the context and the permission pair; Stop's decision/reason and systemMessage ride at the top level.

[[case]]
id = "render/event-only"
fn = "render_result"
args_json = '[{"$new": "HookResult", "fields": {"event_name": "PreToolUse"}}]'
expected_json = '"{\"hookSpecificOutput\": {\"hookEventName\": \"PreToolUse\"}}"'

