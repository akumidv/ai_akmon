# Unit table: the pure half of the Claude Code adapter (hooks/claude_adapter.py; JS mirror
# js/hooks/claude_adapter.mjs, ADR 0020 D01, C104 pass 2). Data file: hooks/vocabulary.json (the
# Claude tool names and the document keys), read from the tree under test; the JS mouth hands the
# module hook_data.mjs's lazy bundle as the first argument of `normalize_tool` and `render_result`.
#
# Why this table exists: `render_result` is the one document Claude Code reads, and it is written
# with `json.dumps` defaults -- `", "` and `": "` separators, every non-ASCII character as a
# `\uXXXX` escape (an astral one as a surrogate pair, U+2028 and U+0085 included), the DEL character
# raw -- which a JS port reproduces by hand (`hookForm`). Key order is part of the document
# (`hookSpecificOutput` first, then `decision`/`reason`, then `systemMessage`), and so is what is
# *left out*: a `reason` without a `decision` is dropped, a `decision` without a `reason` is
# emitted with `""`, an empty string is not `None`. `project_root` is the Python truthiness and
# `isinstance` of a payload field (`cwd` of `0`, `[]`, `{}`, `true` and `""` all ask the process's
# directory), followed by a resolve and a walk up to AGENTS.md. The table is the spec, held to the
# Python reference row by row: `runner.py --impl python` runs it as scenario `units/claude_adapter`
# in the conformance leg of `meta/self_ci.py`, and every expected value was read against the
# docstring.
#
# The mouth is the generic one of `routing.toml` (row format: the block comment above `probe_routing`
# in probe.py); the adapters build a HookResult from `{"$new": "HookResult", "fields": {...}}` (the
# class lives in hook_core on both sides). `render_result`'s answer is the document text itself,
# compared as a string; a row with `cwd` runs with the scratch subdirectory as the process's working
# directory; `class_only` answers the exception class alone (a payload that is not an object is an
# AttributeError at `.get`, which the crash handler would print by name).
#
# Families (the `id` prefix): `tool` -- Claude's edit and read tools become the neutral kinds, every
# other name (case, padding, an object-prototype name) passes through; `render` -- every field
# combination, Stop's decision and reason, the escapes, `None`; `root` -- the payload's cwd in every
# shape, the marker that makes a project root, a custom dev-layer root, and a payload that is not a
# dict.
#
# Deliberate non-pins: `load_payload`, `print_result` and `run_guarded` (stdin, stdout, stderr and
# the exit code are the hook corpus's), and a HookResult field of the wrong type (typed contract).

# --- tool: Claude Code's tool names map to the neutral kinds; every other name passes through --------

