# --- chain: which files an `@`-import reaches, in which order (base 1000: index in the table) ---

[[case]]
id = "chain/plain"
fn = "import_chain"
args_json = '["@a.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "a.md" = "a\n" }
expected_json = '["{{dir}}/a.md"]'

[[case]]
id = "chain/missing"
fn = "import_chain"
args_json = '["@nope.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
expected_json = '[]'

[[case]]
id = "chain/order-first-seen"
fn = "import_chain"
args_json = '["@b.md\n@a.md\n@b.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "a.md" = "a\n", "b.md" = "b\n" }
expected_json = '["{{dir}}/b.md", "{{dir}}/a.md"]'

[[case]]
id = "chain/relative-to-the-importer"
fn = "import_chain"
args_json = '["@sub/a.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "sub/a.md" = "@b.md\n", "sub/b.md" = "b\n", "b.md" = "top\n" }
expected_json = '["{{dir}}/sub/a.md", "{{dir}}/sub/b.md"]'

[[case]]
id = "chain/nested-dotdot"
fn = "import_chain"
args_json = '["@sub/a.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "sub/a.md" = "@../b.md\n", "b.md" = "top\n" }
expected_json = '["{{dir}}/sub/a.md", "{{dir}}/b.md"]'

[[case]]
id = "chain/base-is-the-first-level"
fn = "import_chain"
args_json = '["@a.md\n", {"$path": "{{dir}}/x"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "x/a.md" = "x\n", "a.md" = "top\n" }
expected_json = '["{{dir}}/x/a.md"]'

[[case]]
id = "chain/cycle"
