args_json = '["@a.md\n", {"$path": "{{dir}}"}]'
kwargs_json = '{"root": {"$path": "{{dir}}"}}'
files = { "a.md" = "@b.md\n", "b.md" = "@a.md\n" }
expected_json = '["{{dir}}/a.md", "{{dir}}/b.md"]'

[[case]]
