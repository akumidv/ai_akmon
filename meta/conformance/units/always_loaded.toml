# Unit table: the always-loaded counter (common/always_loaded.py; JS mirror
# js/common/always_loaded.mjs, ADR 0020 D01, C105). Data file: common/always_loaded.json (the
# block heading, the two scopes, the caps and their severities), read from the tree under test on
# both sides: the Python module opens the file beside itself, the JS mouth hands the parsed document
# to the exports that read it as their first argument.
#
# Why this table exists: the counter decides whether a consumer's context ratchet is green, and it is
# the one place where two stdlibs must agree on *which characters are lines, which are whitespace and
# which paths are inside a project*. Python `str.splitlines` names ten line separators, JS regexes
# know four; Python `\s` is Unicode until `re.ASCII` (the Python side is `re.ASCII`, by decision, so a
# no-break space beside an `@`-token is text in both); `^`/`$`/`.` under `MULTILINE`/`DOTALL` mean
# "after \n", "before \n" and "anything" -- never \r or U+2028; `Path.read_text` translates \r\n and
# \r to \n before the bytes are counted; `Path.resolve`, `Path.expanduser` and `Path.relative_to` are
# the stdlib's, with a `RuntimeError` for a symlink loop or an unknown `~user`. A JS port gets none of
# this for free. The table is the spec, held to the Python reference row by row: `runner.py --impl
# python` runs it as scenario `units/always_loaded` in the conformance leg of `meta/self_ci.py`, and
# every expected value was read against the docstrings.
#
# The mouth is the generic one of `routing.toml` (the row format is the block comment above
# `probe_routing` in probe.py): a row names a public function (`marked_block`, `import_chain`,
# `populations`, `report`, `over`, the vocabulary readers), its JSON arguments and the world it runs
# in -- the files of a scratch project (`files`, `files_parts` for bytes TOML cannot spell), links,
# `env` (HOME for the `~` rows). `Cap`, `Member` and `Population` are built with `$new`; a `Path`
# argument is `{"$path": "{{dir}}/…"}` and comes back as its POSIX string with the scratch directory
# tokenized `{{dir}}`; `import_chain`'s keyword `root` is `kwargs_json`. A raise answers
# `{"error": <class>, "message": …}`, or the class alone (`class_only`) where the message is the
# platform's or the Python version's. `Member.lines`/`size` and `Population.lines`/`size` are
# properties: the `report` and `over` rows print and compare them.
#
# Call sites: marked_block, import_chain, populations -- meta/checks/always_loaded.py (the shipped
# leg, self_ci) and bin/verify.py::check_always_loaded (the consumer leg, C105 pass 2); report and
# over -- the same two; the vocabulary readers (block_heading, shipped, consumer, caps, severity) --
# those two plus the finding's severity lookup.
#
# Families (the `id` prefix): `vocab` -- the data as the module exposes it; `block` -- the marked
# block: where it starts, what ends it (`## ` with its space, not `###`), every line separator, a BOM
# or an indent before the heading, a fence that does not hide a peer heading; `chain` -- which files
# an import reaches and in which order: relative to the importer, transitive and first-seen,
# breadth-first, cycles, missing, directories, outside the root (absolute, `..`, a link out), links
# inside, `~` and `~user`, the ASCII/Unicode whitespace boundary, tokens, inline code, comments and
# fences (closed and unclosed, `~~~`, a longer fence, a closer with trailing text, CRLF, a lone \r
# and U+2028 which are no line start), nested files with a BOM, CRLF or bytes that are not UTF-8;
# `report` -- lines and bytes of one population as the report prints them, for every separator and
# for multi-byte text; `over` -- the inclusive boundary on each dimension; `pop` -- both scopes of one
# project: the block, the chain and the tail, the selected files (added after the chain, never doubled,
# skipped when missing or a directory, a link taking its target's name, outside the root raising), a
# root behind a link, CRLF text kept as given and CRLF files translated.
#
# Deliberate non-pins: the message of the `ValueError` `Path.relative_to` raises (the Python version's
# wording), a symlink loop's and an unknown user's message (class only), `~name` of a real user other
# than the one running (NSS), and an import whose path the platform cannot stat (a permission error
# class depends on the user running the probe).

# --- vocab: what the data file carries, as the module exposes it (base 0) ---

[[case]]
id = "vocab/code"
fn = "CODE"
args_json = '[]'
expected_json = '"caps.always-loaded"'

[[case]]
id = "vocab/block-heading"
fn = "block_heading"
args_json = '[]'
expected_json = '"## Dev layer — akmon"'

[[case]]
id = "vocab/shipped"
fn = "shipped"
args_json = '[]'
expected_json = '"akmon-shipped"'

[[case]]
id = "vocab/consumer"
fn = "consumer"
args_json = '[]'
expected_json = '"consumer-total"'

[[case]]
id = "vocab/caps"
fn = "caps"
args_json = '[]'
expected_json = '{"akmon-shipped": {"lines": 320, "bytes": 21000}, "consumer-total": {"lines": 570, "bytes": 34000}}'

[[case]]
id = "vocab/severity"
fn = "severity"
args_json = '[]'
expected_json = '{"akmon-shipped": "error", "consumer-total": "warn"}'

