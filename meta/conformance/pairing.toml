# The pairing gate's exemptions (ADR 0020 D03, design node-consumers.md §5 gate 3): a
# consumer-executable .py without its js/ .mjs counterpart is allowed ONLY with an entry
# here — the reason and the owning task that ports it. The list shrinks as the port lands
# (C104 hooks, C105 CLI, C107 update, C108 tools), and it must not lie in either direction:
# a pattern that matches nothing fails the gate (pairing.stale), and so does one that has
# become unnecessary because every file it covers has been ported — an exemption still
# covering a landed port hides what is outstanding.
#
# A pattern is a glob over the repo-relative .py path; a directory glob covers every file
# under it. The counterpart path the gate checks is the mirrored one (design §4): X/Y.py →
# js/X/Y.mjs, with the package mapping to the package — src/akmon/cli.py → js/akmon/cli.mjs.
#
# [[stub]] is the other half of that honesty. The gate compares names, so a .mjs that exists
# only as a placeholder — it runs, says the port has not landed, exits non-zero — would be
# credited as a port and make the task owning that port look done. An entry names the file by
# its exact path relative to js/ (not a glob), with the reason and the task that replaces it.
# The .py behind a stub counts as exempt, never paired, so it still needs its own [[exempt]]
# entry: the stub keeps the pair out of the paired count, the exemption keeps the gap green.
# Once the real port lands the two names look identical to the gate — drop both by hand.

# common/: owned by the task that ports the first consumer in port order.
[[exempt]]
path = "common/__init__.py"
reason = "structural — ES modules have no package init; js/common is a flat module directory the C104 hooks import first"
task = "C104"

# src/akmon/: the CLI port is C105, update C107's; only the package init is left.
[[exempt]]
path = "src/akmon/__init__.py"
reason = "structural — ES modules have no package init; the node-side version carrier is package.json"
task = "C105"

# tools/: every tool is paired. routing.py was ported with the hooks (C104 pass 1), init.py in
# C105 pass 3, the rest in C108; a new tool module is a gap until it is paired or listed here.
