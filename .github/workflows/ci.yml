name: CI

# Every branch commit runs the full gate; no separate pull_request trigger — same-repo
# PR heads are already covered by their push runs.
on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported floor (pyproject requires-python); 3.13 is the upper leg.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Installs the dev group (pytest, ruff) and builds/installs akmon itself —
      # a wheel-build smoke test on every push.
      - name: Sync environment
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # akmon's own formatting gate only: ruff is this repo's dev dependency, and nothing
      # akmon ships asks a consumer to use it.
      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest meta/tests

      - name: Self CI (synthetic consumer fixture)
        run: uv run python meta/self_ci.py
