# The Python rule catalog — the one owner of every Python rule a program checks.
#
# One table per rule. A document names a rule as `python:<id>` and never restates it.
#   source   the Google Python Style Guide section ("google:2.12"), or "akmon" for a rule of
#            akmon's own
#   text     the rule, in one sentence
#   ruff     the ruff codes that implement the same rule; akmon's own ruff selects every one
#   check    ast       — akmon's check implements it for a consumer
#            formatter — layout: the project's formatter owns it, akmon's check never does
#            ruff      — applied to akmon's own code only, no consumer implementation
#   default  the consumer's severity: error | warn | off
#   tests    on | off — whether it applies to test modules by default
#   params   the rule's parameters, with their defaults
#
# A project changes a severity or a parameter in <AITNA_ROOT>/.akmon.toml [python.rules]; it
# never edits this file.

[rule.specific-suppression]
source = "google:2.1"
text = "A suppression names the rule it silences; a bare `# noqa` or `# type: ignore` is not one."
ruff = ["PGH003", "PGH004"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.import-modules]
source = "google:2.2"
text = "Import a module, not a symbol from it; `typing`, `collections.abc` and their kin are exempt."
ruff = []
check = "ast"
default = "off"
tests = "off"
params = { exempt = ["__future__", "typing", "typing_extensions", "collections.abc"] }

[rule.no-wildcard-import]
source = "google:2.2"
text = "No wildcard import."
ruff = ["F403"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.absolute-imports]
source = "google:2.3"
text = "Import by the full package path; no relative import."
ruff = ["TID252"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.no-bare-except]
source = "google:2.4"
text = "No bare `except:`."
ruff = ["E722"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.no-broad-except]
source = "google:2.4"
text = "No `except Exception` or `except BaseException` that does not re-raise."
ruff = ["BLE001"]
check = "ast"
default = "warn"
tests = "off"
params = {}

[rule.no-silent-except]
source = "google:2.4"
text = "An `except` that catches everything never just passes."
ruff = ["S110"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.no-assert-validation]
source = "google:2.4"
text = "`assert` is not validation: outside tests, a checked condition raises an exception."
ruff = ["S101"]
check = "ast"
default = "error"
tests = "off"
params = {}

[rule.raise-from]
source = "google:2.4"
text = "An exception raised inside an `except` block keeps its cause with `raise ... from`."
ruff = ["B904"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.exception-suffix]
source = "google:3.16"
text = "An exception class's name ends in `Error`."
ruff = ["N818"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.no-global-statement]
source = "google:2.5"
text = "No `global` statement: module state is constant."
ruff = ["PLW0603"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.simple-comprehension]
source = "google:2.7"
text = "A comprehension has one `for` clause and at most one `if`."
ruff = []
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.default-iterator]
source = "google:2.8"
text = "Iterate a mapping directly — `for key in mapping`, not `mapping.keys()`."
ruff = ["SIM118"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.lambda-use]
source = "google:2.10"
text = "No lambda bound to a name, and no `map` or `filter` over a lambda."
ruff = ["E731", "C417"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.no-mutable-default]
source = "google:2.12"
text = "A default argument value is never a mutable object."
ruff = ["B006"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.none-and-bool-compare]
source = "google:2.14"
text = "Compare to `None` with `is`, and never compare to `True` or `False`."
ruff = ["E711", "E712"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.implicit-false]
source = "google:2.14"
text = "Test a sequence's emptiness by its truth — `if seq:`, not `if len(seq):`."
ruff = ["PLC1802"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.no-staticmethod]
source = "google:2.17"
text = "No `@staticmethod`: a function that never touches the instance is a module function."
ruff = []
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.no-power-features]
source = "google:2.19"
text = "No power features: a custom metaclass, `__del__`, three-argument `type()`, `__import__`, `exec`, `eval` or a `getattr` with a computed name."
ruff = ["S102", "S307"]
check = "ast"
default = "warn"
tests = "off"
params = { forbid = ["metaclass", "__del__", "type-3-arg", "__import__", "exec", "eval", "getattr-dynamic"] }

[rule.annotate-public]
source = "google:2.21"
text = "Every public function and method annotates its parameters and its return type."
ruff = ["ANN001", "ANN201"]
check = "ast"
default = "warn"
tests = "off"
params = {}

[rule.explicit-optional]
source = "google:3.19.5"
text = "A parameter that defaults to `None` is annotated `X | None`, never a bare `X`."
ruff = ["RUF013"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.docstrings]
source = "google:3.8"
text = "Every public module, class and function has a docstring; a function's names its arguments under `Args:` and a generator's says `Yields:`."
ruff = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D417"]
check = "ast"
default = "warn"
tests = "off"
params = { args = true, yields = true }

[rule.no-string-concat-loop]
source = "google:3.10"
text = "A string is not accumulated with `+=` in a loop: collect the parts and `join` them."
ruff = []
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.logging-format]
source = "google:3.10.1"
text = "A logging call takes a `%`-pattern and its arguments, never an f-string or a formatted string."
ruff = ["G001", "G002", "G003", "G004"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.open-with-context]
source = "google:3.11"
text = "A file is opened in a `with` statement."
ruff = ["SIM115"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.todo-format]
source = "google:3.12"
text = "A TODO reads `TODO: <link> - <what>`: it carries a tracker link."
ruff = ["TD004", "TD005", "TD006", "TD007"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.naming]
source = "google:3.16"
text = "Names follow PEP 8 casing — `module_name`, `ClassName`, `function_name`, `CONSTANT_NAME` — and a module file name has no dash."
ruff = ["N801", "N802", "N803", "N806", "N816", "N999"]
check = "ast"
default = "error"
tests = "on"
params = {}

[rule.short-names]
source = "google:3.16.1"
text = "No single-character name beyond the conventional loop counters, `e`, `f` and `_`."
ruff = []
check = "ast"
default = "off"
tests = "off"
params = { allowed = ["i", "j", "k", "v", "e", "f", "_"] }

[rule.function-length]
source = "google:3.18"
text = "A function longer than `max_lines` is split, or says why it is not."
ruff = []
check = "ast"
default = "warn"
tests = "off"
params = { max_lines = 40 }

[rule.complexity]
source = "akmon"
text = "A function's cyclomatic complexity stays at or under `max`."
ruff = ["C901"]
check = "ruff"
default = "off"
tests = "off"
params = { max = 10 }

[rule.no-blocking-in-async]
source = "akmon"
text = "No blocking call — `time.sleep`, a synchronous file, process or HTTP call — inside `async def`."
ruff = ["ASYNC"]
check = "ast"
default = "warn"
tests = "on"
params = {}

[rule.stdlib-only]
source = "akmon"
text = "Code that runs on a bare interpreter imports the standard library and the project's own modules only."
ruff = []
check = "ast"
default = "off"
tests = "off"
params = {}

[rule.layout]
source = "google:3.2"
text = "Layout — line length, whitespace, blank lines, import order, one statement per line — is the formatter's."
ruff = ["E501", "E401", "E701", "E702", "E703", "I001", "W291", "W293"]
check = "formatter"
default = "off"
tests = "on"
params = { line_length = 80 }

# An environment switches rules on for the paths a project declares under it.
[environment.python-stdlib]
profile = "python-stdlib.md"
rules = ["stdlib-only"]

# akmon's own recorded deviations from a rule's default parameters.
[akmon.layout]
line_length = 120
