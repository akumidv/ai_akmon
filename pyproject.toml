[project]
name = "akmon"
version = "0.4.0"
description = "Akmon is AI-agent development standard, as an installable package."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    {name = "Andrei Kuminov", email = "akuminov@gmail.com"}
]
# Zero runtime dependencies is a locked contract (ADR 0009 §1) — everything under
# src/akmon/ is stdlib only; verify should assert this stays true.
dependencies = []

[project.urls]
Homepage = "https://github.com/akumidv/ai_akmon"
Repository = "https://github.com/akumidv/ai_akmon"

[project.scripts]
akmon = "akmon.cli:main"

# Dev-only tooling (the runtime stays zero-dep — ADR 0009 §1). `uv sync` installs the
# `dev` group by default; CI runs `uv run pytest` / `uv run ruff` through it.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The standard tree ships as package data under akmon/_tree/: what runs or is read in a consumer,
# not akmon's development record — no meta/, no test files (ADR 0009, C118 amendment). Each
# top-level member is named explicitly (not "." ) so the embedded copy never recurses into src/ or
# this pyproject.toml itself. The member list is split by what hatchling can filter: force-include
# ignores every `exclude` pattern (only its hardcoded constants apply, measured on hatchling 1.27),
# so a directory carrying files to drop — js/ and its `*.test.mjs` — goes through `only-include` +
# `sources`, which the excludes do reach. Root files stay in force-include: a `sources` prefix is a
# directory, so a remapped root file would land at the wheel root, outside the package.
# meta/tests/test_init.py asserts the two lists together equal `init.json::tree_members`.
[tool.hatch.build.targets.wheel]
only-include = ["src/akmon", "js"]
sources = {"src" = "", "js" = "akmon/_tree/js"}

[tool.hatch.build.targets.wheel.force-include]
"ARCHETYPES.md" = "akmon/_tree/ARCHETYPES.md"
"BOOTSTRAP.md" = "akmon/_tree/BOOTSTRAP.md"
"CAPABILITIES.md" = "akmon/_tree/CAPABILITIES.md"
"CHANGELOG.md" = "akmon/_tree/CHANGELOG.md"
"LICENSE" = "akmon/_tree/LICENSE"
"MODEL.md" = "akmon/_tree/MODEL.md"
"README.md" = "akmon/_tree/README.md"
"common" = "akmon/_tree/common"
"bin" = "akmon/_tree/bin"
"examples" = "akmon/_tree/examples"
"guardrails" = "akmon/_tree/guardrails"
"hooks" = "akmon/_tree/hooks"
"pipelines" = "akmon/_tree/pipelines"
"profiles" = "akmon/_tree/profiles"
"roles" = "akmon/_tree/roles"
"skills" = "akmon/_tree/skills"
"tools" = "akmon/_tree/tools"

# The custom patterns apply to the `only-include` members only: force-include entries are filtered
# by hatchling's hardcoded constants (EXCLUDED_DIRECTORIES incl. `__pycache__` and `.ruff_cache`),
# which is why the cache dirs never ship there either. npm drops `.gitignore` files on its own
# (M103); no shipped member carries one, so wheel and npm ship one file set —
# meta/tests/test_carriers_match.py asserts it. `*.test.mjs` is listed here, not on the wheel
# target, because a target-level `exclude` replaces this list rather than extending it; the sdist
# drops the JS tests with it.
[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.git",
    "**/.git/**",
    "**/*.test.mjs",
]

[tool.ruff]
# akmon runs exactly the Python rules it offers a consumer (profiles/ruff.toml, ADR 0014 §6).
extend = "profiles/ruff.toml"
target-version = "py312"
# Experiment material is not akmon source: its inputs are sealed by hash (seal*.json), so their
# bytes cannot be reformatted or brought under the rules (owner decision, C116).
# The A22 P3 suite is parked until A22 resumes (owner decision, C132): its tests are skipped by
# meta/tests/conftest.py and its files leave lint here; drop this entry, that skip and the pin in
# meta/tests/test_ruff_profile.py to resume it.
extend-exclude = ["meta/experiments", "meta/tests/test_a22_p3_*.py"]

[tool.ruff.lint]
# ℹ is the notice glyph akmon's hooks print — meant, not a mistyped `i`.
allowed-confusables = ["ℹ"]
