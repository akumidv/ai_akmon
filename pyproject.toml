[project]
name = "akmon"
version = "0.4.0.dev0"
description = "Akmon is AI-agent development standard, as an installable package."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Andrei Kuminov", email = "akuminov@gmail.com"}
]
# Zero runtime dependencies is a locked contract (ADR 0009 §1) — everything under
# src/akmon/ is stdlib only; verify should assert this stays true.
dependencies = []

[project.urls]
Homepage = "https://github.com/akumidv/ai_akmon"
Repository = "https://github.com/akumidv/ai_akmon"

[project.scripts]
akmon = "akmon.cli:main"

# Dev-only tooling (the runtime stays zero-dep — ADR 0009 §1). `uv sync` installs the
# `dev` group by default; CI runs `uv run pytest` / `uv run ruff` through it.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akmon"]

# The standard tree ships as package data (ADR 0009 §1 — full tree incl. meta/, for parity
# with the submodule mount). Force-include each top-level member explicitly (not "." ) so the
# embedded copy never recurses into src/ or this pyproject.toml itself.
[tool.hatch.build.targets.wheel.force-include]
"ARCHETYPES.md" = "akmon/_tree/ARCHETYPES.md"
"BOOTSTRAP.md" = "akmon/_tree/BOOTSTRAP.md"
"CAPABILITIES.md" = "akmon/_tree/CAPABILITIES.md"
"CHANGELOG.md" = "akmon/_tree/CHANGELOG.md"
"LICENSE" = "akmon/_tree/LICENSE"
"MODEL.md" = "akmon/_tree/MODEL.md"
"README.md" = "akmon/_tree/README.md"
"common" = "akmon/_tree/common"
"bin" = "akmon/_tree/bin"
"examples" = "akmon/_tree/examples"
"guardrails" = "akmon/_tree/guardrails"
"hooks" = "akmon/_tree/hooks"
"meta" = "akmon/_tree/meta"
"pipelines" = "akmon/_tree/pipelines"
"profiles" = "akmon/_tree/profiles"
"roles" = "akmon/_tree/roles"
"skills" = "akmon/_tree/skills"
"tools" = "akmon/_tree/tools"

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.git",
    "**/.git/**",
]

[tool.ruff]
# akmon runs exactly the Python rules it offers a consumer (profiles/ruff.toml, ADR 0014 §6).
extend = "profiles/ruff.toml"
target-version = "py311"

[tool.ruff.lint]
# ℹ is the notice glyph akmon's hooks print — meant, not a mistyped `i`.
allowed-confusables = ["ℹ"]

# C91: the size family's exceptions, one entry per file that still offends. The list only
# shrinks — meta/tests/test_ruff_profile.py fails on an entry added and on one no longer needed.
# `extend-` keeps the profile's test-file ignores; a plain `per-file-ignores` would replace them.
[tool.ruff.lint.extend-per-file-ignores]
"bin/verify.py" = ["C901"]
"common/codex_hooks.py" = ["C901", "PLR0912"]
"common/findings.py" = ["C901"]
"hooks/hook_core.py" = ["PLR0911"]
"meta/checks/runtime.py" = ["C901", "PLR0912", "PLR0915"]
"meta/self_ci.py" = ["PLR0913"]
"meta/tests/test_coverage_map.py" = ["PLR0913"]
"meta/tests/test_findings.py" = ["PLR0913"]
"src/akmon/_init.py" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
"src/akmon/cli.py" = ["PLR0911"]
"tools/model_routing/gate_pack.py" = ["PLR0913"]
"tools/model_routing/stats.py" = ["C901", "PLR0912", "PLR0913"]
"tools/tasks/archive.py" = ["PLR0911"]
